      const b = e.target.closest('[data-tb]'); if (b) return apply(BUILTIN_TPL[b.dataset.tb]);
    });
    s.querySelector('[data-sv]').onclick = () => U.prompt('Tên mẫu', '', v => { if (!v) return; mine[v] = App.chart.inds.map(x => ({ id: x.id, I: x.I, st: x.st })); App.store.set('tpls', mine); U.close('tpl'); App.toast('Đã lưu mẫu', 'ok'); });
  };

  /* =========================================================
   * PHÁT LẠI THANH (bar replay)
   * ========================================================= */
  let rpTimer = null;
  P.replayStart = function () {
    const C = App.chart;
    if (C.replay) return P.replayStop();
    C.replay = { picking: true, speed: 1 };
    App.toast('Bấm vào một nến trên biểu đồ để chọn điểm bắt đầu phát lại', 'info', 6000);
    P.replayBar();
  };
  U.replayPick = function (time) {
    const C = App.chart, b = App.state.bars, n = b.length;
    let k = 0; while (k < n - 1 && b[k + 1].time <= time) k++;
    const idx = Math.max(10, Math.min(n - 2, k));
    C.replay = { idx, speed: C.replay.speed || 1, playing: false };
    C.refresh(true); P.replayBar();
  };
  P.replayStep = function (k = 1) {
    const C = App.chart; if (!C.replay || C.replay.idx == null) return;
    if (C.replay.idx >= App.state.bars.length - 1) { P.replayPause(); return App.toast('Đã phát tới nến mới nhất'); }
    C.replay.idx += k;
    const bar = App.state.bars[C.replay.idx];
    if (['candle', 'bar', 'hollow', 'line', 'linemk', 'step', 'area', 'columns'].includes(C.type)) { C.view.push(bar); C.D = App.ta.prep(C.view); C.main.update(C.toMain(bar)); C.renderIndicators(true); U.legend(null); }
    else C.refresh(true);
    P.replayInfo();
  };
  P.replayPlay = function () { const C = App.chart; if (!C.replay || C.replay.idx == null) return; C.replay.playing = true; clearInterval(rpTimer); rpTimer = setInterval(() => P.replayStep(1), 1000 / C.replay.speed); P.replayBar(); };
  P.replayPause = function () { const C = App.chart; if (C.replay) C.replay.playing = false; clearInterval(rpTimer); P.replayBar(); };
  P.replayStop = function () { clearInterval(rpTimer); App.chart.replay = null; $('#replayBar').classList.add('hidden'); $('#btnReplay').classList.remove('on'); App.chart.refresh(true); };
  P.replayInfo = () => { const C = App.chart, el = $('#rpInfo'); if (el && C.replay && C.replay.idx != null) el.textContent = `${App.fmtTime(App.state.bars[C.replay.idx].time)} · còn ${App.state.bars.length - 1 - C.replay.idx} nến`; };
  P.replayBar = function () {
    const C = App.chart, r = C.replay, bar = $('#replayBar');
    $('#btnReplay').classList.toggle('on', !!r);
    if (!r) return bar.classList.add('hidden');
    bar.classList.remove('hidden');
    bar.innerHTML = r.idx == null ? `<span class="rp-info">${ic('target')} Chọn điểm bắt đầu trên biểu đồ</span><button data-r="stop" title="Thoát">${ic('x')}</button>`
      : `<button data-r="pick" title="Chọn lại điểm bắt đầu">${ic('target')}</button><button data-r="${r.playing ? 'pause' : 'play'}" title="${r.playing ? 'Tạm dừng' : 'Phát'}">${ic(r.playing ? 'pause' : 'play')}</button>
        <button data-r="step" title="Tiến 1 nến">${ic('step')}</button><select data-r="speed" title="Tốc độ">${[0.5, 1, 2, 3, 5, 10].map(x => `<option value="${x}" ${x === r.speed ? 'selected' : ''}>${x}×</option>`).join('')}</select>
        <span class="rp-info" id="rpInfo"></span><button data-r="stop" title="Thoát phát lại">${ic('stop')} Thoát</button>`;
    P.replayInfo();
    bar.onclick = e => { const b = e.target.closest('button[data-r]'); if (!b) return; ({ play: P.replayPlay, pause: P.replayPause, step: () => P.replayStep(1), stop: P.replayStop, pick: () => { P.replayPause(); C.replay = { picking: true, speed: r.speed }; C.refresh(true); P.replayBar(); } })[b.dataset.r](); };
    bar.onchange = e => { if (e.target.dataset.r === 'speed') { r.speed = +e.target.value; if (r.playing) P.replayPlay(); } };
  };

  /* =========================================================
   * KIỂM TRA CHIẾN LƯỢC (bảng dưới)
   * ========================================================= */
  let bpTab = 'sum';
  P.strategyPanel = U.strategyPanel = function () {
    const C = App.chart, list = C.inds.filter(x => App.INDICATORS[x.id] && App.INDICATORS[x.id].cat === 'strategy' && !x.hidden);
    const panel = $('#bottomPanel');
    if (!list.length) { panel.classList.add('hidden'); return; }
    if (panel.classList.contains('hidden') && panel.dataset.closed === '1') return;
    panel.classList.remove('hidden');
    let cur = list.find(x => x.uid === +panel.dataset.uid) || list[0]; panel.dataset.uid = cur.uid;
    const r = (C.results[cur.uid] || {}).backtest;
    const f2 = v => (v >= 0 ? '+' : '') + v.toLocaleString('vi-VN', { maximumFractionDigits: 2 });
    let body = '<div class="empty">Không có giao dịch</div>';
    if (r) {
      if (bpTab === 'sum') body = `<div class="kpis">
        <div class="kpi"><small>Lãi ròng</small><b class="${r.net >= 0 ? 'up' : 'down'}">${f2(r.net)} (${App.fmtPct(r.netPct)})</b></div>
        <div class="kpi"><small>Tổng số lệnh</small><b>${r.n}</b></div><div class="kpi"><small>Tỉ lệ thắng</small><b>${r.winRate.toFixed(1)}%</b></div>
        <div class="kpi"><small>Hệ số lợi nhuận</small><b>${isFinite(r.pf) ? r.pf.toFixed(2) : '∞'}</b></div><div class="kpi"><small>Sụt giảm tối đa</small><b class="down">${r.mdd.toFixed(2)}%</b></div>
        <div class="kpi"><small>TB mỗi lệnh</small><b>${f2(r.avg)}</b></div><div class="kpi"><small>Mua &amp; giữ</small><b class="${r.buyHold >= 0 ? 'up' : 'down'}">${App.fmtPct(r.buyHold)}</b></div></div>
        <canvas id="eqCv" style="width:100%;height:90px;margin-top:10px"></canvas><p class="note">${r.note ? esc(r.note) + ' ' : ''}Vốn ban đầu ${((App.settings.bt || {}).capital || 10000).toLocaleString('vi-VN')}, toàn bộ vốn mỗi lệnh, khớp giá mở cửa nến kế tiếp, phí ${(App.settings.bt || {}).fee ?? 0.04}%/chiều. Đổi trong ⚙ của chiến lược.</p>`;
      else body = `<table class="tt"><tr><th>#</th><th>Loại</th><th>Vào</th><th>Giá vào</th><th>Ra</th><th>Giá ra</th><th>Lãi/lỗ</th><th>%</th></tr>${r.trades.slice().reverse().map((t, k) => `<tr><td>${r.trades.length - k}</td><td class="${t.side === 'Mua' ? 'up' : 'down'}">${t.side}</td><td>${App.fmtTime(C.D.t[t.ei])}</td><td>${App.fmtPrice(t.ep)}</td><td>${App.fmtTime(C.D.t[t.xi])}${t.why === 'Đang mở' ? ' (mở)' : ''}</td><td>${App.fmtPrice(t.xp)}</td><td class="${t.pnl >= 0 ? 'up' : 'down'}">${f2(t.pnl)}</td><td class="${t.pct >= 0 ? 'up' : 'down'}">${App.fmtPct(t.pct)}</td></tr>`).join('')}</table>`;
    }
    panel.innerHTML = `<div class="bp-head">${ic('target')}<b>Kiểm tra chiến lược</b><select id="bpSel">${list.map(x => `<option value="${x.uid}" ${x.uid === cur.uid ? 'selected' : ''}>${esc(App.INDICATORS[x.id].name)}</option>`).join('')}</select>
      <span class="bp-tabs"><button data-bt="sum" class="${bpTab === 'sum' ? 'active' : ''}">Tổng quan</button><button data-bt="list" class="${bpTab === 'list' ? 'active' : ''}">Danh sách lệnh</button></span><span class="grow"></span>
      <button class="mini" data-bt="set" title="Cài đặt">${ic('gear')}</button><button class="mini" data-bt="close" title="Ẩn bảng">${ic('down')}</button></div><div class="bp-body">${body}</div>`;
    panel.onchange = e => { if (e.target.id === 'bpSel') { panel.dataset.uid = e.target.value; P.strategyPanel(); } };
    panel.onclick = e => { const b = e.target.closest('[data-bt]'); if (!b) return; if (b.dataset.bt === 'close') { panel.classList.add('hidden'); panel.dataset.closed = '1'; return; } if (b.dataset.bt === 'set') return U.indSettings(cur); bpTab = b.dataset.bt; P.strategyPanel(); };
    const cv = $('#eqCv'); if (cv && r) { const w = cv.clientWidth, h = 90, dpr = window.devicePixelRatio || 1; cv.width = w * dpr; cv.height = h * dpr; const g = cv.getContext('2d'); g.scale(dpr, dpr);
      const eq = r.equity, mn = Math.min(...eq), mx = Math.max(...eq), y = v => h - 4 - (v - mn) / (mx - mn || 1) * (h - 8);
      g.beginPath(); eq.forEach((v, i) => { const x = i / (eq.length - 1) * w; i ? g.lineTo(x, y(v)) : g.moveTo(x, y(v)); }); g.strokeStyle = App.theme.accent; g.lineWidth = 1.5; g.stroke();
      g.lineTo(w, h); g.lineTo(0, h); g.closePath(); g.fillStyle = App.theme.accentSoft; g.fill(); }
  };

  /* ---------- Chụp ảnh biểu đồ ---------- */
  P.screenshot = function () {
    let framed = true; try { framed = window.self !== window.top; } catch (e) {}
    if (framed) return App.toast('Chụp ảnh chỉ dùng được ở bản file HTML mở trên máy tính', 'err');
    try {
      const c = App.chart.api.takeScreenshot(), g = c.getContext('2d'), d = App.draw.cv, k = c.width / $('#chart').clientWidth / (window.devicePixelRatio || 1);
      g.drawImage(d, 0, 0, d.width * k, d.height * k);
      g.font = `600 ${14 * (c.width / $('#chart').clientWidth)}px sans-serif`; g.fillStyle = App.theme.accent; g.fillText('GreenView · ' + App.state.sym + ' · ' + App.TF_LABEL[App.state.tf], 12, c.height - 14);
      const a = document.createElement('a'); a.download = `GreenView_${App.state.sym.replace(/\W/g, '_')}_${App.state.tf}.png`; a.href = c.toDataURL('image/png');
      document.body.appendChild(a); a.click(); a.remove(); App.toast('Đã lưu ảnh', 'ok');
    } catch (e) { App.toast('Không chụp được ảnh ở chế độ này', 'err'); }
  };
})(window.App);

</script>
<script>
/* --- js/app.js --- */
/* =========================================================
 * app.js — Khởi động GreenView: trạng thái, tải mã, realtime, phím tắt
 * ========================================================= */
(function (App) {
  'use strict';
  const $ = App.$;

  App.state = { src: 'BINANCE', sym: 'BTCUSDT', tf: '1h', bars: [], loading: false, noMore: false, token: 0 };
  App.settings = Object.assign({ tdKey: '', proxy: '', chart: {}, bt: { capital: 10000, fee: 0.04 } }, App.store.get('settings', {}));
  App.saveSettings = () => App.store.set('settings', App.settings);
  // Key Twelve Data do StockPredict đưa vào (file khoa_twelvedata.txt trên máy) – chỉ điền khi chưa có
  if (window.GV_TD_KEY && !App.settings.tdKey) { App.settings.tdKey = window.GV_TD_KEY; App.saveSettings(); }

  App.setStatus = function (kind, text) { $('#stDot').className = 'dot ' + kind; $('#stText').textContent = text; };
  setInterval(() => { const d = new Date(), p = n => String(n).padStart(2, '0'); $('#clock').textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())} (UTC${App.TZ >= 0 ? '+' : ''}${App.TZ / 3600})`; }, 1000);

  /* ---------- Tải một mã ---------- */
  let stopLive = null;
  App.loadSymbol = async function (src, sym, tf, opts = {}) {
    const source = App.sources[src];
    sym = source.normalize(sym);
    if (!source.tfs.includes(tf)) tf = source.tfs.includes('1D') ? '1D' : source.tfs[0];
    const token = ++App.state.token;
    if (stopLive) { stopLive(); stopLive = null; }
    if (App.chart.replay) App.panels.replayStop();
    $('#loading').classList.remove('hidden');
    App.setStatus('load', 'Đang tải ' + sym + '…');
    try {
      const bars = await source.fetchBars(sym, tf);
      if (token !== App.state.token) return;
      if (!bars.length) throw new Error('Không có dữ liệu');
      const changed = src !== App.state.src || sym !== App.state.sym;
      Object.assign(App.state, { src, sym, tf, bars, noMore: !source.canLoadMore });
      if (changed) App.chart.compares.forEach(c => c.series && App.chart.api.removeSeries(c.series)), App.chart.compares = [];
      App.draw.load();
      App.chart.refresh(false);
      App.ui.renderTop();
      $('#stInfo').textContent = `${bars.length} nến`;
      App.setStatus('idle', 'Đã tải ' + sym);
      stopLive = source.live(sym, tf, bar => { if (token === App.state.token) App.chart.updateBar(bar); });
      if (!opts.fallback) App.store.set('last', { src, sym, tf });
      const r = App.store.get('recent', []).filter(x => !(x.src === src && x.sym === sym)); r.unshift({ src, sym }); App.store.set('recent', r.slice(0, 14));
      App.panels.refreshSide();
      return true;
    } catch (e) {
      if (token !== App.state.token) return;
      const msg = e && e.name === 'AbortError' ? 'Hết thời gian chờ' : (e && e.message) || 'Lỗi không rõ';
      App.setStatus('err', 'Lỗi: ' + msg);
      if (!opts.quiet) App.toast(`Không tải được ${sym}: ${msg}${src === 'VN' || src === 'TCBS' ? ' — trình duyệt bị chặn: mở GreenView bằng co_phieu/chay_greenview.bat rồi chọn nguồn "StockPredict (giá VN)"' : ''}`, 'err', 6500);
      if (App.state.bars.length) { const cur = App.sources[App.state.src], t2 = App.state.token; stopLive = cur.live(App.state.sym, App.state.tf, bar => { if (t2 === App.state.token) App.chart.updateBar(bar); }); }
      return false;
    } finally { if (token === App.state.token) $('#loading').classList.add('hidden'); }
  };

  App.loadMoreHistory = async function () {
    const s = App.state;
    if (s.loading || s.noMore || !s.bars.length) return;
    s.loading = true; const token = s.token;
    try {
      const first = s.bars[0].time, older = (await App.sources[s.src].fetchBars(s.sym, s.tf, first)).filter(b => b.time < first);
      if (token !== s.token) return;
      if (!older.length) { s.noMore = true; return; }
      s.bars = older.concat(s.bars); App.chart.prepended(older.length);
      $('#stInfo').textContent = `${s.bars.length} nến`;
    } catch (e) { s.noMore = true; } finally { s.loading = false; }
  };

  /* ---------- Phím tắt (giống TradingView) ---------- */
  document.addEventListener('keydown', e => {
    if (e.target.matches('input,textarea,select') || document.querySelector('.sheet-bg')) return;
    const k = e.key.toLowerCase();
    if (e.altKey) {
      const map = { t: 'trend', h: 'hline', v: 'vline', c: 'crossline', f: 'fibret', j: 'hray', p: 'parallel' };   // Alt+R: đặt lại khung nhìn (extras.js)
      if (map[k]) { e.preventDefault(); App.draw.setTool(map[k]); }
      if (k === 'a') { e.preventDefault(); App.panels.alertSheet(); }
      if (k === 'i') { e.preventDefault(); App.ui.indSheet(); }
      return;
    }
    if (e.key === '/' ) { e.preventDefault(); App.ui.indSheet(); return; }
    if (/^[a-z0-9]$/i.test(e.key) && !e.ctrlKey && !e.metaKey) { App.ui.symbolSheet('open'); setTimeout(() => { const q = $('#sQ'); if (q) { q.value = e.key.toUpperCase(); } }, 30); }
  });

  /* ---------- Khởi động ---------- */
  async function boot() {
    App.setTheme(App.store.get('theme', 'dark'));
    App.ui.initTop();
    App.chart.init($('#chart'));
    App.draw.init($('#chartWrap'));
    App.ui.initTools();
    App.ui.initLegend();
    App.panels.initSide();
    App.panels.badge();
    if ((App.settings.chart || {}).watermark === false) $('#watermark').classList.add('hidden');
    App.store.get('csvNames', []).forEach(n => { const d = App.store.get('csv:' + n); if (d) App.csvSets[n] = d; });
    window.addEventListener('resize', () => requestAnimationFrame(() => App.ui.legend(App.chart.hover)));

    // Connector của Claude (chỉ có khi mở trong Claude) — chờ tối đa ~10 giây
    App.mcpReady = (async () => { try { if (window.claude && window.claude.use) App.mcp = await window.claude.use('mcp'); } catch (e) { App.mcp = null; } return App.mcp; })();
    // Mở từ StockPredict: dữ liệu nhúng sẵn (web app) hoặc máy chủ giá trên máy (chay_greenview.bat)
    const spAuto = () => { ['sp_plan', 'sp_pha'].forEach(id => { if ((id !== 'sp_pha' || window.GV_PHA) && !App.chart.inds.some(x => x.id === id)) App.chart.addIndicator(id); }); };
    if (window.GV_DATA && window.GV_DATA.bars) {
      if (await App.loadSymbol('SP', window.GV_DATA.ma, '1D', { quiet: true, fallback: true })) { spAuto(); App.panels.refreshQuotes(); return; }
    }
    const last = App.store.get('last', window.GV_API != null ? { src: 'SP', sym: 'VNINDEX', tf: '1D' } : { src: 'BINANCE', sym: 'BTCUSDT', tf: '1h' });
    if (window.GV_API != null && (last.src === 'VN' || last.src === 'TCBS')) { last.src = 'SP'; if (!['1D', '1W', '1M'].includes(last.tf)) last.tf = '1D'; }
    if (window.GV_API != null && last.src === 'SP') spAuto();
    if (last.src === 'SP' && window.GV_API == null) { last.src = 'BINANCE'; last.sym = 'BTCUSDT'; last.tf = '1h'; }
    if (last.src === 'TCBS') await App.mcpReady;
    let ok = await App.loadSymbol(last.src, last.sym, last.tf, { quiet: true });
    if (!ok && last.src !== 'BINANCE') ok = await App.loadSymbol('BINANCE', 'BTCUSDT', '1h', { quiet: true });
    if (!ok) {
      await App.mcpReady;
      if (App.mcp) ok = await App.loadSymbol('TCBS', last.src === 'TCBS' || last.src === 'VN' ? last.sym : 'VNINDEX', '1D', { quiet: true });
      const b = $('#banner');
      b.innerHTML = ok ? `${App.icon('info')}<span>Đang dùng <b>connector TCBS</b> cho cổ phiếu Việt Nam. Khung nhỏ (1p–4g) được tự ghép từ giá TCBS trong giờ giao dịch, khi trang đang mở. Crypto, Mỹ, Forex cần mở file HTML trên máy tính.</span><button class="x">${App.icon('x')}</button>`
        : `${App.icon('info')}<span>Không kết nối được API dữ liệu nên đang chạy <b>dữ liệu giả lập</b>. Trong Claude: kết nối TCBS (Cài đặt › Connectors) để xem cổ phiếu VN, hoặc tải file HTML về máy để có đủ nguồn.</span><button class="x">${App.icon('x')}</button>`;
      b.classList.remove('hidden'); b.querySelector('.x').onclick = () => b.classList.add('hidden');
      if (!ok) await App.loadSymbol('DEMO', 'DEMO', last.tf || '1h', { fallback: true });
    }
    // Khi connector TCBS sẵn sàng mà đang xem dữ liệu giả lập -> tự chuyển sang giá thật
    App.mcpReady.then(async m => {
      if (!m) return;
      App.panels.refreshQuotes(['VN', 'TCBS']);
      if (App.state.src === 'DEMO' || !App.state.bars.length) {
        const ok2 = await App.loadSymbol('TCBS', 'VNINDEX', '1D', { quiet: true });
        const b = $('#banner');
        b.innerHTML = ok2 ? `${App.icon('info')}<span>Đang dùng <b>connector TCBS</b> cho cổ phiếu Việt Nam. Khung nhỏ (1p–4g) được tự ghép từ giá TCBS trong giờ giao dịch, khi trang đang mở. Crypto, Mỹ, Forex cần mở file HTML trên máy tính.</span><button class="x">${App.icon('x')}</button>`
          : `${App.icon('info')}<span>Đã thấy connector TCBS nhưng chưa lấy được dữ liệu: <b>${App.esc($('#stText').textContent)}</b>. Hãy cho phép GreenView dùng TCBS khi Claude hỏi, rồi tải lại trang.</span><button class="x">${App.icon('x')}</button>`;
        b.classList.remove('hidden'); b.querySelector('.x').onclick = () => b.classList.add('hidden');
      }
    });
    App.panels.refreshQuotes();
  }
  boot();
})(window.App);

</script>
<script>
/* --- js/extras.js --- */
/* =========================================================
 * extras.js — giống TradingView:
 *   • Đếm ngược thời gian còn lại của nến hiện tại, hiện ngay dưới nhãn giá trên trục giá
 *   • Menu chuột phải trên biểu đồ: đặt lại khung nhìn (Alt+R), sao chép giá, cảnh báo tại giá,
 *     vẽ vị thế Mua/Bán tại giá, đường dọc tại thời điểm, xem dạng bảng, cây đối tượng, mẫu,
 *     xoá chỉ báo, cài đặt
 * ========================================================= */
(function (App) {
  'use strict';
  const $ = App.$, esc = App.esc, ic = App.icon;
  const C = () => App.chart;

  /* ---------------- Đặt lại khung nhìn ---------------- */
  App.resetView = function () {
    const c = C(); if (!c || !c.api) return;
    try { c.api.priceScale('right').applyOptions({ autoScale: true }); } catch (e) {}
    try { c.main && c.main.priceScale().applyOptions({ autoScale: true }); } catch (e) {}
    try { c.api.timeScale().resetTimeScale(); } catch (e) {}
    try { const n = App.state.bars.length; if (n) c.api.timeScale().setVisibleLogicalRange({ from: Math.max(0, n - 150), to: n + 8 }); } catch (e) {}
    App.toast('Đã đặt lại khung nhìn', 'ok', 1500);
  };

  /* ---------------- Đếm ngược thời gian nến ---------------- */
  const cd = document.createElement('div');
  cd.id = 'cdLabel';
  cd.style.cssText = 'position:fixed;z-index:6;pointer-events:none;font:600 11px/15px -apple-system,Segoe UI,Roboto,sans-serif;' +
    'color:#fff;text-align:center;border-radius:0 0 3px 3px;display:none;font-variant-numeric:tabular-nums';
  document.body.appendChild(cd);

  App.conLaiNen = function () {
    const s = App.state, n = s.bars.length; if (!n) return null;
    const last = s.bars[n - 1].time, now = Date.now() / 1000 + App.TZ;
    let end;
    // Cổ phiếu VN khung ngày: phiên đóng cửa lúc 14:45
    if (s.tf === '1D' && ['SP', 'VN', 'TCBS'].includes(s.src)) return last + 14.75 * 3600 - now;
    if (s.tf === '1M') { const d = new Date(last * 1000); end = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1) / 1000; }
    else end = last + (App.TF[s.tf] || 86400);
    return end - now;
  };
  App.fmtConLai = function (r) {
    if (r == null || r <= 0) return '';
    const p = v => String(Math.floor(v)).padStart(2, '0');
    if (r >= 86400) { const d = Math.floor(r / 86400); return `${d} ngày ${p((r % 86400) / 3600)}g`; }
    return r >= 3600 ? `${p(r / 3600)}:${p((r % 3600) / 60)}:${p(r % 60)}` : `${p(r / 60)}:${p(r % 60)}`;
  };
  function veDemNguoc() {
    const c = C(), s = App.state, n = s.bars.length;
    const tat = (App.settings.chart || {}).countdown === false;
    if (tat || !c || !c.main || !n || App.chart.replay) { cd.style.display = 'none'; return; }
    const r = App.conLaiNen(), txt = App.fmtConLai(r);
    const b = s.bars[n - 1], y = c.main.priceToCoordinate(b.close);
    const box = $('#chart').getBoundingClientRect();
    let w = 0; try { w = c.api.priceScale('right').width(); } catch (e) {}
    if (!txt || y == null || !w || y < 0 || y > box.height - 30) { cd.style.display = 'none'; return; }
    cd.textContent = txt;
    cd.style.background = b.close >= b.open ? (App.theme.up || '#089981') : (App.theme.down || '#f23645');
    cd.style.left = (box.right - w) + 'px'; cd.style.width = w + 'px';
    cd.style.top = (box.top + y + 9) + 'px';
    cd.style.display = 'block';
  }
  setInterval(veDemNguoc, 1000);
  const hook = setInterval(() => {
    const c = C(); if (!c || !c.api) return;
    clearInterval(hook);
    c.api.timeScale().subscribeVisibleLogicalRangeChange(() => requestAnimationFrame(veDemNguoc));
    window.addEventListener('resize', () => requestAnimationFrame(veDemNguoc));
    document.addEventListener('pointermove', e => { if (e.buttons) requestAnimationFrame(veDemNguoc); });
    document.addEventListener('wheel', () => requestAnimationFrame(veDemNguoc), { passive: true });
  }, 200);

  /* ---------------- Menu chuột phải ---------------- */
  function themHinh(tool, t, p) {
    const DR = App.draw, def = DR.TOOLS[tool]; if (!def) return;
    const d = { id: 'd' + Date.now() + Math.floor(Math.random() * 999), tool, pts: [{ t, p }], style: Object.assign({}, DR.style, def.style || {}), _hit: [] };
    if (def.init) def.init(d, DR);
    DR.list.push(d); DR.save(); DR.select && DR.select(d); DR.render && DR.render();
  }

  function bangGia() {
    const s = App.state, rows = s.bars.slice(-300).reverse();
    App.ui.sheet({ id: 'tbl', title: `Dạng bảng · ${esc(s.sym)} · ${App.TF_LABEL[s.tf] || s.tf}`, cls: 'wide',
      body: `<div style="max-height:65vh;overflow:auto"><table class="tt"><tr><th>Thời gian</th><th>Mở</th><th>Cao</th><th>Thấp</th><th>Đóng</th><th>%</th><th>KL</th></tr>${
        rows.map((b, k) => { const pr = rows[k + 1], ch = pr ? (b.close / pr.close - 1) * 100 : 0;
          return `<tr><td>${App.fmtTime(b.time)}</td><td>${App.fmtPrice(b.open)}</td><td>${App.fmtPrice(b.high)}</td><td>${App.fmtPrice(b.low)}</td><td>${App.fmtPrice(b.close)}</td><td class="${ch >= 0 ? 'up' : 'down'}">${App.fmtPct(ch)}</td><td>${(b.volume || 0).toLocaleString('vi-VN')}</td></tr>`; }).join('')}</table></div>` });
  }

  function moMenu(ev) {
    const c = C(); if (!c || !c.main || !App.state.bars.length) return;
    ev.preventDefault();
    const box = $('#chart').getBoundingClientRect(), y = ev.clientY - box.top, x = ev.clientX - box.left;
    let gia = c.main.coordinateToPrice(y);
    if (gia == null || !isFinite(gia)) gia = App.state.bars[App.state.bars.length - 1].close;
    let t = c.api.timeScale().coordinateToTime(x);
    if (t == null) t = App.state.bars[App.state.bars.length - 1].time;
    const g = App.fmtPrice(gia), sym = esc(App.state.sym), soInd = c.inds.length;
    const demNguoc = (App.settings.chart || {}).countdown !== false;
    const row = (a, icon, text, kb) => `<div class="fo-row" data-a="${a}">${icon ? ic(icon) : '<span style="width:26px"></span>'}<span class="nm">${text}</span>${kb ? `<small style="color:var(--muted)">${kb}</small>` : ''}</div>`;
    const hr = '<div style="border-top:1px solid var(--line);margin:4px 0"></div>';
    const f = $('#flyout');
    f.innerHTML = row('reset', 'refresh', 'Đặt lại khung nhìn biểu đồ', 'Alt + R') + hr
      + row('copy', null, `Sao chép giá ${g}`) + hr
      + row('alert', 'bell', `Thêm cảnh báo ${sym} tại ${g}…`, 'Alt + A')
      + row('long', null, `Vẽ vị thế MUA ${sym} tại ${g}`)
      + row('short', null, `Vẽ vị thế BÁN ${sym} tại ${g}`)
      + row('hline', null, `Vẽ đường ngang tại ${g}`) + hr
      + row('vline', null, `Khoá đường dọc tại ${App.fmtTime(t)}`)
      + row('cd', null, `${demNguoc ? '✓ ' : ''}Đếm ngược thời gian nến`) + hr
      + row('table', null, 'Xem dạng bảng') + row('tree', null, 'Cây đối tượng') + row('tpl', null, 'Mẫu biểu đồ ›') + hr
      + (soInd ? row('rmind', 'trash', `Xoá ${soInd} chỉ báo`) + hr : '')
      + row('set', 'gear', 'Cài đặt…');
    f.style.left = Math.min(ev.clientX, window.innerWidth - 300) + 'px';
    f.classList.remove('hidden');
    f.style.top = Math.max(6, Math.min(ev.clientY, window.innerHeight - f.offsetHeight - 6)) + 'px';
    f.onclick = e => {
      const b = e.target.closest('[data-a]'); if (!b) return;
      f.classList.add('hidden');
      ({
        reset: App.resetView,
        copy: () => { const v = String(+gia.toPrecision(8)); (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => App.toast('Đã chép ' + v, 'ok', 1500), () => App.toast(v, 'info')); },
        alert: () => App.panels.alertSheet(+gia.toPrecision(6)),
        long: () => themHinh('long', t, gia), short: () => themHinh('short', t, gia),
        hline: () => themHinh('hline', t, gia), vline: () => themHinh('vline', t, gia),
        cd: () => { App.settings.chart = Object.assign({}, App.settings.chart, { countdown: !demNguoc }); App.saveSettings(); veDemNguoc(); },
        table: bangGia, tree: () => App.panels.mobilePanel('ot'), tpl: App.panels.templates,
        rmind: () => App.ui.confirm(`Xoá ${soInd} chỉ báo?`, () => { c.inds = []; c.saveInds(); c.renderIndicators(); }),
        set: App.ui.chartSettings
      })[b.dataset.a]();
    };
    setTimeout(() => document.addEventListener('pointerdown', function h(e2) { if (!f.contains(e2.target)) { f.classList.add('hidden'); document.removeEventListener('pointerdown', h); } }), 0);
  }
  const gan = setInterval(() => { const w = $('#chartWrap'); if (!w) return; clearInterval(gan); w.addEventListener('contextmenu', moMenu); }, 200);

  // Phím tắt Alt+R: đặt lại khung nhìn
  document.addEventListener('keydown', e => {
    if (e.altKey && e.key.toLowerCase() === 'r' && !e.target.matches('input,textarea,select')) { e.preventDefault(); App.resetView(); }
  });
})(window.App);

</script>
</body>
</html>
