<script>
/* --- js/chart.js --- */
/* =========================================================
 * chart.js — Bộ điều khiển biểu đồ GreenView
 *  - 17 loại biểu đồ (nến, Heikin Ashi, Renko, Kagi, P&F…)
 *  - Chỉ báo dạng "phiên bản" (thêm nhiều lần, mỗi cái tham số riêng)
 *  - So sánh mã, phát lại thanh (bar replay), thang giá log/%
 * ========================================================= */
(function (App) {
  'use strict';
  const LC = window.LightweightCharts, T = App.ta, isN = T.isN;

  App.CHART_TYPES = [
    ['bar', 'Thanh'], ['candle', 'Nến'], ['hollow', 'Nến rỗng'], ['line', 'Đường'], ['linemk', 'Đường có điểm'], ['step', 'Đường bậc thang'],
    ['area', 'Vùng'], ['hlcarea', 'Vùng HLC'], ['baseline', 'Đường cơ sở'], ['columns', 'Cột'], ['highlow', 'Cao-Thấp'],
    ['ha', 'Heikin Ashi'], ['renko', 'Renko'], ['linebreak', 'Line break'], ['kagi', 'Kagi'], ['pnf', 'Point & figure']
  ];
  const SYNTH = { renko: 1, linebreak: 1, kagi: 1, pnf: 1 };

  const C = App.chart = {
    api: null, main: null, extra: [], type: App.store.get('chartType', 'candle'),
    inds: App.store.get('inds', null) || [{ uid: 1, id: 'volume', I: {}, st: {} }],
    series: {},    // uid -> [series]
    results: {},   // uid -> kết quả tính
    compares: [],
    replay: null,
    view: [],

    init(el) {
      C.el = el;
      C.api = LC.createChart(el, { autoSize: true, crosshair: { mode: LC.CrosshairMode.Normal }, localization: { locale: 'vi-VN', priceFormatter: p => App.fmtPrice(p) },
        timeScale: { timeVisible: true, secondsVisible: false, rightOffset: 10 }, rightPriceScale: { scaleMargins: { top: 0.08, bottom: 0.08 } },
        layout: { panes: { enableResize: true } } });
      C.applyTheme();
      C.api.subscribeCrosshairMove(p => { C.hover = p && p.time != null ? p : null; App.ui.legend(C.hover); });
      C.api.timeScale().subscribeVisibleLogicalRangeChange(r => { if (r && r.from < 5 && !C.replay) App.loadMoreHistory && App.loadMoreHistory(); });
      C.api.subscribeClick(p => { if (C.replay && C.replay.picking && p && p.time != null) App.ui.replayPick(p.time); });
      C.setType(C.type, true);
    },

    applyTheme() {
      const th = App.theme, cs = App.settings.chart || {};
      C.api.applyOptions({
        layout: { background: { type: 'solid', color: th.chartBg }, textColor: th.muted, fontFamily: '-apple-system, "Segoe UI", Roboto, sans-serif', panes: { separatorColor: th.line, separatorHoverColor: th.accentSoft } },
        grid: { vertLines: { color: th.grid, visible: cs.grid !== false }, horzLines: { color: th.grid, visible: cs.grid !== false } },
        rightPriceScale: { borderColor: th.line, mode: cs.scale || 0 }, timeScale: { borderColor: th.line },
        crosshair: { mode: cs.magnetCross ? LC.CrosshairMode.Magnet : LC.CrosshairMode.Normal, vertLine: { color: th.muted, labelBackgroundColor: th.accentDark }, horzLine: { color: th.muted, labelBackgroundColor: th.accentDark } }
      });
      if (C.main) C.styleMain();
    },
    colors() { const cs = App.settings.chart || {}; return { up: cs.up || App.theme.up, dn: cs.dn || App.theme.down }; },

    /* ---------- Loại biểu đồ ---------- */
    setType(type, silent) {
      const prev = C.type;
      C.type = type; App.store.set('chartType', type);
      if (C.main) { try { C.markersApi && C.markersApi.detach && C.markersApi.detach(); } catch (e) {} C.markersApi = null; C.api.removeSeries(C.main); }
      C.extra.forEach(s => C.api.removeSeries(s)); C.extra = [];
      const S = { line: LC.LineSeries, linemk: LC.LineSeries, step: LC.LineSeries, kagi: LC.LineSeries, area: LC.AreaSeries, hlcarea: LC.AreaSeries, baseline: LC.BaselineSeries, columns: LC.HistogramSeries, bar: LC.BarSeries }[type] || LC.CandlestickSeries;
      C.main = C.api.addSeries(S, {}, 0);
      if (type === 'hlcarea') C.extra = [C.api.addSeries(LC.LineSeries, { lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }, 0), C.api.addSeries(LC.LineSeries, { lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }, 0)];
      C.styleMain();
      if (!silent) C.refresh(!(SYNTH[type] || SYNTH[prev]) || type === prev);
    },
    styleMain() {
      const { up, dn } = C.colors(), t = C.type, acc = App.theme.accent, o = { priceLineVisible: true, lastValueVisible: true };
      if (t === 'line' || t === 'linemk' || t === 'step' || t === 'kagi') Object.assign(o, { color: acc, lineWidth: 2, lineType: t === 'step' || t === 'kagi' ? 1 : 0, pointMarkersVisible: t === 'linemk' });
      else if (t === 'area' || t === 'hlcarea') Object.assign(o, { lineColor: acc, topColor: App.theme.accentSoft, bottomColor: 'rgba(0,0,0,0)', lineWidth: 2 });
      else if (t === 'baseline') Object.assign(o, { topLineColor: up, bottomLineColor: dn, topFillColor1: up + '55', topFillColor2: up + '08', bottomFillColor1: dn + '08', bottomFillColor2: dn + '55' });
      else if (t === 'columns') Object.assign(o, { color: acc });
      else if (t === 'bar') Object.assign(o, { upColor: up, downColor: dn, thinBars: false });
      else if (t === 'hollow') Object.assign(o, { upColor: 'rgba(0,0,0,0)', downColor: dn, borderUpColor: up, borderDownColor: dn, wickUpColor: up, wickDownColor: dn, borderVisible: true });
      else if (t === 'highlow') Object.assign(o, { upColor: acc, downColor: acc, borderVisible: false, wickVisible: false });
      else Object.assign(o, { upColor: up, downColor: dn, borderUpColor: up, borderDownColor: dn, wickUpColor: up, wickDownColor: dn, borderVisible: false });
      C.main.applyOptions(o);
      C.extra.forEach((s, k) => s.applyOptions({ color: k ? dn : up }));
    },

    /* ---------- Dữ liệu hiển thị (sau phát lại & biến đổi) ---------- */
    viewBars() { return C.view; },
    buildView() {
      let b = App.state.bars;
      if (C.replay && C.replay.idx != null) b = b.slice(0, C.replay.idx + 1);
      C.view = C.transform(b, C.type);
      C.D = T.prep(C.view);
      return C.view;
    },
    transform(b, type) {
      if (!b.length) return b;
      if (type === 'ha') {
        const out = []; let po = b[0].open, pc = b[0].close;
        b.forEach(x => { const c = (x.open + x.high + x.low + x.close) / 4, o = (po + pc) / 2; out.push({ time: x.time, open: o, high: Math.max(x.high, o, c), low: Math.min(x.low, o, c), close: c, volume: x.volume }); po = o; pc = c; });
        return out;
      }
      if (type === 'highlow') return b.map(x => ({ ...x, open: x.low, close: x.high }));
      if (!SYNTH[type]) return b;
      const D = T.prep(b), atr = T.atr(D, 14)[D.n - 1] || b[b.length - 1].close * 0.01, box = (App.settings.chart && App.settings.chart.box) || +(atr.toPrecision(2));
      const out = []; let lastT = -Infinity;
      const push = (t, o, h, l, c, v) => { t = Math.max(t, lastT + 1); lastT = t; out.push({ time: t, open: o, high: h, low: l, close: c, volume: v || 0 }); };
      if (type === 'renko') {
        let base = Math.floor(b[0].close / box) * box, dir = 0;
        b.forEach(x => {
          while (x.close >= base + box * (dir === -1 ? 2 : 1)) { const o = dir === -1 ? base + box : base; push(x.time, o, o + box, o, o + box, x.volume); base = o + box; dir = 1; }
          while (x.close <= base - box * (dir === 1 ? 2 : 1)) { const o = dir === 1 ? base - box : base; push(x.time, o, o, o - box, o - box, x.volume); base = o - box; dir = -1; }
        });
        if (!out.length) push(b[0].time, b[0].open, b[0].high, b[0].low, b[0].close);
        // gán lại "base" để nến sau cùng nối tiếp đúng
        return out;
      }
      if (type === 'linebreak') {
        const L = [{ o: b[0].open, c: b[0].close }]; push(b[0].time, b[0].open, Math.max(b[0].open, b[0].close), Math.min(b[0].open, b[0].close), b[0].close);
        b.slice(1).forEach(x => { const last3 = L.slice(-3), hi = Math.max(...last3.map(l => Math.max(l.o, l.c))), lo = Math.min(...last3.map(l => Math.min(l.o, l.c))), prev = L[L.length - 1];
          if (x.close > hi || x.close < lo) { const o = x.close > hi ? Math.max(prev.o, prev.c) : Math.min(prev.o, prev.c); L.push({ o, c: x.close }); push(x.time, o, Math.max(o, x.close), Math.min(o, x.close), x.close, x.volume); } });
        return out;
      }
      if (type === 'kagi') {
        const rev = box * 2; let dir = 0, ext = b[0].close; push(b[0].time, ext, ext, ext, ext);
        b.forEach(x => { const c = x.close;
          if (dir >= 0 && c > ext) { ext = c; dir = 1; out[out.length - 1].close = c; }
          else if (dir <= 0 && c < ext) { ext = c; dir = -1; out[out.length - 1].close = c; }
          else if ((dir >= 0 && ext - c >= rev) || (dir <= 0 && c - ext >= rev)) { dir = -dir || -1; ext = c; push(x.time, c, c, c, c, x.volume); } });
        return out.map(o => ({ ...o, open: o.close, high: o.close, low: o.close }));
      }
      if (type === 'pnf') {
        const rev = 3; let col = null;
        b.forEach(x => {
          if (!col) { col = { up: x.close >= x.open, top: Math.ceil(x.high / box) * box, bot: Math.floor(x.low / box) * box, t: x.time }; return; }
          if (col.up) { if (x.high >= col.top + box) col.top = Math.floor(x.high / box) * box; else if (x.low <= col.top - box * rev) { push(col.t, col.bot, col.top, col.bot, col.top); col = { up: false, top: col.top - box, bot: Math.ceil(x.low / box) * box, t: x.time }; } }
          else { if (x.low <= col.bot - box) col.bot = Math.ceil(x.low / box) * box; else if (x.high >= col.bot + box * rev) { push(col.t, col.top, col.top, col.bot, col.bot); col = { up: true, bot: col.bot + box, top: Math.floor(x.high / box) * box, t: x.time }; } }
        });
        if (col) col.up ? push(col.t, col.bot, col.top, col.bot, col.top) : push(col.t, col.top, col.top, col.bot, col.bot);
        return out;
      }
      return b;
    },
    toMain(x) {
      const t = C.type;
      if (t === 'line' || t === 'linemk' || t === 'step' || t === 'area' || t === 'baseline' || t === 'kagi' || t === 'hlcarea') return { time: x.time, value: x.close };
      if (t === 'columns') return { time: x.time, value: x.close, color: x.close >= x.open ? C.colors().up : C.colors().dn };
      return { time: x.time, open: x.open, high: x.high, low: x.low, close: x.close };
    },
    applyPrecision() {
      const v = C.view; if (!v.length) return;
      const a = Math.abs(v[v.length - 1].close), d = a >= 1000 ? 2 : a >= 10 ? 2 : a >= 1 ? 3 : a >= 0.1 ? 4 : a >= 0.001 ? 6 : 8;
      C.main.applyOptions({ priceFormat: { type: 'price', precision: d, minMove: Math.pow(10, -d) } });
    },

    /* ---------- Vẽ lại toàn bộ ---------- */
    refresh(keepView) {
      if (!App.state.bars.length) return;
      const range = keepView ? C.api.timeScale().getVisibleLogicalRange() : null;
      C.buildView();
      C.applyPrecision();
      C.main.setData(C.view.map(C.toMain));
      if (C.type === 'hlcarea') { C.extra[0].setData(C.view.map(x => ({ time: x.time, value: x.high }))); C.extra[1].setData(C.view.map(x => ({ time: x.time, value: x.low }))); }
      if (C.type === 'baseline') { const v = C.view; C.main.applyOptions({ baseValue: { type: 'price', price: v[Math.max(0, v.length - 100)].close } }); }
      C.renderIndicators();
      C.renderCompares();
      if (range) C.api.timeScale().setVisibleLogicalRange(range);
      else if (!keepView) { const n = C.view.length; C.api.timeScale().setVisibleLogicalRange({ from: Math.max(-5, n - 140), to: n + 10 }); }
      App.ui.legend(null);
    },
    // Thêm nến cũ vào đầu, giữ khung nhìn
    prepended(k) {
      const r = C.api.timeScale().getVisibleLogicalRange();
      C.refresh(false);
      if (r && !SYNTH[C.type]) C.api.timeScale().setVisibleLogicalRange({ from: r.from + k, to: r.to + k });
    },

    /* ---------- Cập nhật realtime ---------- */
    updateBar(bar) {
      const bars = App.state.bars; if (!bars.length) return;
      const last = bars[bars.length - 1];
      if (bar.time < last.time) { const i = bars.findIndex(b => b.time === bar.time); if (i >= 0) bars[i] = bar; return; }
      const isNew = bar.time > last.time;
      if (isNew) bars.push(bar); else bars[bars.length - 1] = bar;
      App.onPrice && App.onPrice(App.state.src, App.state.sym, bar.close);
      if (C.replay) return; // đang phát lại thì không vẽ giá mới
      if (SYNTH[C.type] || C.type === 'ha') { C.throttle(() => C.refresh(true), 1000); return; }
      C.view = bars; C.D = T.prep(bars);
      C.main.update(C.toMain(bar));
      if (C.type === 'hlcarea') { C.extra[0].update({ time: bar.time, value: bar.high }); C.extra[1].update({ time: bar.time, value: bar.low }); }
      C.throttle(() => { C.D = T.prep(C.view); C.renderIndicators(true); }, isNew ? 0 : 1200);
      if (!C.hover) App.ui.legend(null);
    },
    throttle(fn, ms) {
      if (C._thr) { C._pend = fn; return; }
      fn(); C._thr = setTimeout(() => { C._thr = null; if (C._pend) { const f = C._pend; C._pend = null; C.throttle(f, ms); } }, ms);
    },

    /* =========================================================
     * CHỈ BÁO
     * ========================================================= */
    saveInds() { App.store.set('inds', C.inds); App.ui.refreshTree && App.ui.refreshTree(); },
    addIndicator(id, I) {
      const def = App.INDICATORS[id]; if (!def) return;
      if (def.need) { App.toast(def.name + ': ' + def.need, 'err', 6000); return; }
      const uid = Date.now() + Math.floor(Math.random() * 1000);
      C.inds.push({ uid, id, I: I || {}, st: {} });
      C.saveInds(); C.renderIndicators();
      App.toast('Đã thêm ' + def.name, 'ok');
      return uid;
    },
    removeIndicator(uid) { C.inds = C.inds.filter(x => x.uid !== uid); C.saveInds(); C.renderIndicators(); },
    inputs(inst) { const def = App.INDICATORS[inst.id], I = {}; def.inputs.forEach(([k, , v]) => { I[k] = inst.I[k] != null ? inst.I[k] : v; }); return I; },
    plotStyle(inst, k) { const def = App.INDICATORS[inst.id], p = def.plots.find(x => x[0] === k) || []; return Object.assign({ c: p[2] || App.theme.accent, w: p[3] === 'hist' || p[3] === 'cols' ? 1 : 1.5, v: true }, (inst.st || {})[k] || {}); },
    paneOf: {},

    renderIndicators(soft) {
      const D = C.D; if (!D || !D.n) return;
      // Tính toán
      C.results = {};
      C.inds.forEach(inst => {
        const def = App.INDICATORS[inst.id]; if (!def || def.need) return;
        try { C.results[inst.uid] = def.calc(D, C.inputs(inst)) || {}; } catch (e) { console.warn(inst.id, e); C.results[inst.uid] = {}; }
      });
      // Cấu trúc khung (pane) có thay đổi không?
      const sig = C.inds.map(x => x.uid + ':' + x.id + ':' + (x.hidden ? 0 : 1) + ':' + JSON.stringify(x.st || {})).join('|') + '#' + C.type;
      if (soft && sig === C._sig) { C.updateIndicatorData(); C.updateMarkers(); return; }
      C._sig = sig;
      Object.values(C.series).flat().forEach(s => { try { C.api.removeSeries(s); } catch (e) {} });
      C.series = {}; C.paneOf = {};
      let pane = 1;
      C.inds.forEach(inst => {
        const def = App.INDICATORS[inst.id], res = C.results[inst.uid]; if (!def || !res || inst.hidden) return;
        const myPane = def.overlay ? 0 : pane;
        const list = [];
        def.plots.forEach(([k, , , type]) => {
          if (!res[k]) return;
          const st = C.plotStyle(inst, k); if (!st.v) return;
          const base = { priceLineVisible: false, lastValueVisible: def.overlay ? false : true, crosshairMarkerVisible: false, title: '' };
          if (def.scale === 'vol') Object.assign(base, { priceScaleId: 'vol' + inst.uid, lastValueVisible: false });
          let s;
          if (type === 'hist' || type === 'cols') s = C.api.addSeries(LC.HistogramSeries, Object.assign(base, { color: st.c, base: 0 }), myPane);
          else if (type === 'area') s = C.api.addSeries(LC.AreaSeries, Object.assign(base, { lineColor: st.c, topColor: st.c + '44', bottomColor: st.c + '05', lineWidth: st.w }), myPane);
          else s = C.api.addSeries(LC.LineSeries, Object.assign(base, { color: st.c, lineWidth: st.w, lineType: type === 'step' ? 1 : 0, lineVisible: !(type === 'dots' || type === 'cross'), pointMarkersVisible: type === 'dots' || type === 'cross', pointMarkersRadius: 2 }), myPane);
          s._plot = k; s._uid = inst.uid; list.push(s);
        });
        if (def.scale === 'vol' && list.length) C.api.priceScale('vol' + inst.uid, 0).applyOptions({ scaleMargins: { top: 0.8, bottom: 0 }, visible: false });
        // các mức ngang
        if (list[0] && def.levels && def.levels.length && !def.overlay) def.levels.forEach(v => list.find(s => s._plot) .createPriceLine({ price: v, color: App.theme.muted, lineWidth: 1, lineStyle: 2, axisLabelVisible: false }));
        C.series[inst.uid] = list;
        if (!def.overlay && (list.length || def.plots.length)) { C.paneOf[inst.uid] = pane; pane++; }
      });

      // chiều cao khung chỉ báo
      const ps = C.api.panes(); ps.forEach((p, i) => p.setStretchFactor(i === 0 ? 3 : 1));
      C.updateMarkers();
      App.ui.legend(C.hover);
      requestAnimationFrame(() => requestAnimationFrame(() => App.ui.legend(C.hover)));
      App.ui.strategyPanel && App.ui.strategyPanel();
    },
    updateIndicatorData() {
      const D = C.D, step = D.n > 1 ? D.t[D.n - 1] - D.t[D.n - 2] : 86400;
      Object.entries(C.series).forEach(([uid, list]) => {
        const res = C.results[uid]; if (!res) return;
        list.forEach(s => {
          const arr = res[s._plot], cols = res.colors && res.colors[s._plot], out = [];
          for (let i = 0; i < D.n; i++) {
            const v = arr[i];
            if (!isN(v)) { out.push({ time: D.t[i] }); continue; }
            const p = { time: D.t[i], value: v }; if (cols && cols[i]) p.color = cols[i]; out.push(p);
          }
          const fut = res.future && res.future[s._plot];
          if (fut) fut.forEach((v, k) => out.push(isN(v) ? { time: D.t[D.n - 1] + step * (k + 1), value: v } : { time: D.t[D.n - 1] + step * (k + 1) }));

          try { s.setData(out.slice(f)); } catch (e) { console.warn(e); }
        });
      });
    },
    updateMarkers() {
      const D = C.D, mk = [];
      C.inds.forEach(inst => { const r = C.results[inst.uid]; if (inst.hidden || !r || !r.markers) return; r.markers.forEach(m => { if (m.i >= 0 && m.i < D.n) mk.push({ time: D.t[m.i], position: m.pos, shape: m.shape, color: m.color, text: App.settings.markerText === false ? '' : (m.text || ''), size: 0.8 }); }); });
      mk.sort((a, b) => a.time - b.time);
      if (!C.markersApi) C.markersApi = LC.createSeriesMarkers(C.main, mk); else C.markersApi.setMarkers(mk);
    },

    /* ---------- Phần vẽ thêm của chỉ báo (trên canvas) ---------- */
    drawOverlays(g) {
      const D = C.D; if (!D) return;
      const ts = C.api.timeScale(), W = ts.width(), H = App.draw.H;
      const X = {
        W, H, D,
        x: i => ts.logicalToCoordinate(i), y: p => C.main.priceToCoordinate(p),
        visible() { const r = ts.getVisibleLogicalRange() || { from: 0, to: D.n - 1 }; return [Math.max(0, Math.ceil(r.from)), Math.min(D.n - 1, Math.floor(r.to))]; },
        seg(g, x1, y1, x2, y2, col, dash, w) { if ([x1, y1, x2, y2].some(v => v == null)) return; g.beginPath(); g.strokeStyle = col; g.lineWidth = w || 1; g.setLineDash(dash || []); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); g.setLineDash([]); },

(function (App) {
  'use strict';
  const $ = App.$, $$ = App.$$, esc = App.esc, ic = App.icon;
  const U = App.ui = {};
  U.mobile = () => window.innerWidth <= 860;

  /* =========================================================
   * BẢNG TRƯỢT / HỘP THOẠI dùng chung
   * ========================================================= */
  U.sheet = function ({ id, title, body, foot, cls = '', back, onClose, noHead }) {
    U.close(id);
    const bg = document.createElement('div');
    bg.className = 'sheet-bg'; bg.dataset.id = id;
    bg.innerHTML = `<div class="sheet ${cls}" role="dialog" aria-label="${esc(title || '')}">
      <div class="sh-grab"></div>
      ${noHead ? '' : `<div class="sh-head">${back ? `<button class="circ" data-back>${ic('back')}</button>` : '<span class="sp"></span>'}<h3>${title || ''}</h3><button class="circ" data-x aria-label="Đóng">${ic('x')}</button></div>`}
      <div class="sh-body"></div>${foot ? `<div class="sh-foot">${foot}</div>` : ''}</div>`;
    const b = bg.querySelector('.sh-body');
    if (typeof body === 'string') b.innerHTML = body; else if (body) b.appendChild(body);
    bg.addEventListener('mousedown', e => { if (e.target === bg) U.close(id); });
    bg.querySelectorAll('[data-x]').forEach(x => x.onclick = () => U.close(id));
    if (back) bg.querySelector('[data-back]').onclick = () => { U.close(id); back(); };
    bg._onClose = onClose;
    $('#sheets').appendChild(bg);
    return bg;
  };
  U.close = function (id) { $$('#sheets .sheet-bg').forEach(s => { if (!id || s.dataset.id === id) { s._onClose && s._onClose(); s.remove(); } }); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { const all = $$('#sheets .sheet-bg'); if (all.length) all[all.length - 1].remove(); $('#flyout').classList.add('hidden'); } });

  U.prompt = function (label, value, cb, multi) {
    const s = U.sheet({ id: 'prompt', title: label, cls: 'small', body: `${multi ? `<textarea class="inp" rows="4" id="pIn">${esc(value)}</textarea>` : `<input class="inp" id="pIn" value="${esc(value)}">`}`,
      foot: '<button class="btn" data-c>Huỷ</button><button class="btn pri" data-ok>OK</button>', onClose: () => { if (!done) cb(null); } });
    let done = false;
    const inp = s.querySelector('#pIn'); setTimeout(() => { inp.focus(); inp.select && inp.select(); }, 60);
    const ok = () => { done = true; cb(inp.value); U.close('prompt'); };
    s.querySelector('[data-ok]').onclick = ok; s.querySelector('[data-c]').onclick = () => U.close('prompt');
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && (!multi || e.ctrlKey || e.metaKey)) ok(); });
  };
  U.confirm = function (text, ok) {
    const s = U.sheet({ id: 'confirm', title: 'Xác nhận', cls: 'small', body: `<p>${esc(text)}</p>`, foot: '<button class="btn" data-c>Huỷ</button><button class="btn pri" data-ok>Đồng ý</button>' });
    s.querySelector('[data-c]').onclick = () => U.close('confirm');
    s.querySelector('[data-ok]').onclick = () => { U.close('confirm'); ok(); };
  };
  U.pickImage = function (d) {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 480 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); d.style.img = c.toDataURL('image/jpeg', 0.85); App.draw.save(); }; im.src = r.result; };
      r.readAsDataURL(f);
    };
    inp.click();
  };

  /* =========================================================
   * THANH TRÊN
   * ========================================================= */
  U.initTop = function () {
    $$('[data-i]').forEach(el => { if (el.tagName === 'I') el.outerHTML = ic(el.dataset.i); else if (!el.querySelector('svg')) el.insertAdjacentHTML('afterbegin', ic(el.dataset.i)); });
    $('#brand').onclick = () => U.about();
    $('#btnSymbol').onclick = () => U.symbolSheet('open');
    $('#btnCompare').onclick = () => U.symbolSheet('compare');
    $('#btnType').onclick = U.typeSheet;
    $('#btnInd').onclick = () => U.indSheet();
    $('#btnTpl').onclick = () => App.panels.templates();
    $('#btnAlert').onclick = () => App.panels.alertSheet();
    $('#btnReplay').onclick = () => App.panels.replayStart();
    $('#btnTheme').onclick = () => App.setTheme(App.themeName === 'dark' ? 'light' : 'dark');
    $('#btnShot').onclick = App.panels.screenshot;
    $('#btnSettings').onclick = U.chartSettings;
    $('#btnHub').onclick = () => App.panels.hub();
    $('#btnDrawM').onclick = () => U.drawSheet();
    $('#btnTfM').onclick = () => U.tfSheet();
    $('#tfBar').addEventListener('click', e => { if (e.target.closest('[data-more]')) return U.tfSheet(); const b = e.target.closest('button[data-tf]'); if (b && !b.disabled) App.loadSymbol(App.state.src, App.state.sym, b.dataset.tf); });
  };
  U.renderTop = function () {
    const s = App.state, src = App.sources[s.src];
    $('#symName').textContent = s.sym;
    $('#symSrc').textContent = src.short;
    const b = App.badge(s.src, s.sym); $('#symIco').style.background = b.bg; $('#symIco').textContent = b.txt;
    $('#watermark').textContent = s.sym;
    document.title = s.sym + ' · GreenView';
    const quick = ['1m', '5m', '15m', '1h', '4h', '1D', '1W'];
    if (!quick.includes(s.tf)) quick.push(s.tf);
    $('#tfBar').innerHTML = Object.keys(App.TF).filter(tf => quick.includes(tf)).map(tf => `<button data-tf="${tf}" class="${tf === s.tf ? 'active' : ''}" ${src.tfs.includes(tf) ? '' : 'disabled title="Nguồn này không hỗ trợ"'} title="${App.TF_NAME[tf]}">${App.TF_LABEL[tf]}</button>`).join('')
      + `<button data-more="1" title="Tất cả khung thời gian">${ic('down')}</button>`;
    $('#btnType').innerHTML = ic('candle');
    $('#btnTfM').textContent = App.TF_LABEL[s.tf];
  };
  U.tfSheet = function () {
    const src = App.sources[App.state.src];
    const names = App.TF_NAME;
    const s = U.sheet({ id: 'tf', title: 'Khung thời gian', cls: 'small', body: `<div class="ilist">${Object.keys(App.TF).map(tf => `<div class="irow ${src.tfs.includes(tf) ? '' : 'dis'}" data-tf="${tf}"><span class="nm">${names[tf]}${src.tfs.includes(tf) ? (App.state.src === 'TCBS' && App.TF[tf] < 86400 || (App.state.src === 'VN' && App.mcp && App.TF[tf] < 86400) ? '<small>Tự ghép từ giá TCBS khi trang đang mở</small>' : '') : '<small>Nguồn này không hỗ trợ</small>'}</span>${tf === App.state.tf ? ic('check') : ''}</div>`).join('')}</div>` });
    s.addEventListener('click', e => { const r = e.target.closest('[data-tf]'); if (r && src.tfs.includes(r.dataset.tf)) { U.close('tf'); App.loadSymbol(App.state.src, App.state.sym, r.dataset.tf); } });
  };

  /* =========================================================
   * THANH VẼ BÊN TRÁI (máy tính) — nhóm công cụ xổ ra như TradingView
   * ========================================================= */
  const DR = App.draw;
  const lastOfCat = App.store.get('lastTool', { trend: 'trend', fib: 'fibret', pattern: 'xabcd', predict: 'long', geo: 'brush', note: 'text', img: 'emo0' });
  U.initTools = function () {
    const cats = ['trend', 'fib', 'pattern', 'predict', 'geo', 'note', 'img'];
    let h = `<button class="tl" data-tool="cursor" title="Con trỏ">${DR.ICONS.cursor}</button><div class="tl-sep"></div>`;
    cats.forEach(c => { const t = DR.TOOLS[lastOfCat[c]] || Object.values(DR.TOOLS).find(x => x.cat === c); h += `<button class="tl grp" data-cat="${c}" data-tool="${t.id}" title="${esc(t.name)}">${t.icon}</button>`; });
    h += `<div class="tl-sep"></div>
      <button class="tl" data-act="measure" title="Đo lường (Shift + kéo)">${DR.ICONS.measure}</button>
      <button class="tl" data-act="zin" title="Phóng to">${DR.ICONS.zin}</button>
      <div class="tl-sep"></div>
      <button class="tl" data-act="magnet" title="Nam châm">${DR.ICONS.magnet}</button>
      <button class="tl" data-act="keep" title="Tiếp tục vẽ">${DR.ICONS.keep}</button>
      <button class="tl" data-act="lock" title="Khóa tất cả hình vẽ">${DR.ICONS.lock}</button>
      <button class="tl" data-act="hide" title="Ẩn tất cả hình vẽ">${DR.ICONS.hide}</button>
      <button class="tl" data-act="clear" title="Xóa tất cả hình vẽ">${DR.ICONS.trash}</button>
      <div class="tl-sep"></div>
      <button class="tl" data-act="fav" title="Yêu thích / tất cả công cụ">${ic('star')}</button>`;
    $('#tools').innerHTML = h;
    $('#tools').addEventListener('click', e => {
      const b = e.target.closest('.tl'); if (!b) return;
      if (b.dataset.act) return U.action(b.dataset.act, b);
      if (b.dataset.cat) {
        const r = b.getBoundingClientRect();
        // bấm nửa phải (mũi tên) hoặc đang chọn → mở bảng xổ; còn lại → chọn công cụ
        if (e.clientX > r.right - 12 || DR.tool === b.dataset.tool) return U.flyout(b.dataset.cat, b);
      }
      DR.setTool(b.dataset.tool);
    });
    $('#tools').addEventListener('contextmenu', e => { const b = e.target.closest('.tl[data-cat]'); if (b) { e.preventDefault(); U.flyout(b.dataset.cat, b); } });
    let lp; $('#tools').addEventListener('pointerdown', e => { const b = e.target.closest('.tl[data-cat]'); if (b) lp = setTimeout(() => U.flyout(b.dataset.cat, b), 450); });
    $('#tools').addEventListener('pointerup', () => clearTimeout(lp));
    U.syncToolState();
  };
  U.flyout = function (cat, anchor) {
    const f = $('#flyout');
    const list = Object.values(DR.TOOLS).filter(t => t.cat === cat && !t.hidden);
    const name = (DR.CATS.find(c => c[0] === cat) || [])[1];
    if (cat === 'img') f.innerHTML = `<div class="fo-h">${name}</div><div class="emo-grid">${list.map(t => `<button data-tool="${t.id}" title="${esc(t.name)}">${t.emoji}</button>`).join('')}</div>`;
    else f.innerHTML = `<div class="fo-h">${name}</div>` + list.map(t => `<div class="fo-row ${DR.tool === t.id ? 'active' : ''}" data-tool="${t.id}"><span class="tsvg">${t.icon}</span><span class="nm">${esc(t.name)}</span><button class="fav ${DR.favs.includes(t.id) ? 'on' : ''}" data-fav="${t.id}">${ic('star')}</button></div>`).join('');
    const r = anchor.getBoundingClientRect();
    f.style.left = (r.right + 6) + 'px'; f.style.top = Math.max(8, Math.min(r.top - 8, window.innerHeight - 420)) + 'px';
    f.classList.remove('hidden');
    f.onclick = e => {
      const fv = e.target.closest('[data-fav]'); if (fv) { U.toggleFav(fv.dataset.fav); fv.classList.toggle('on'); e.stopPropagation(); return; }
      const t = e.target.closest('[data-tool]'); if (!t) return;
      lastOfCat[cat] = t.dataset.tool; App.store.set('lastTool', lastOfCat);
      anchor.dataset.tool = t.dataset.tool; anchor.innerHTML = DR.TOOLS[t.dataset.tool].icon; anchor.title = DR.TOOLS[t.dataset.tool].name;
      DR.setTool(t.dataset.tool); f.classList.add('hidden');
    };
    setTimeout(() => document.addEventListener('pointerdown', function h(ev) { if (!f.contains(ev.target)) { f.classList.add('hidden'); document.removeEventListener('pointerdown', h); } }), 0);
  };
  U.toggleFav = function (id) { const i = DR.favs.indexOf(id); if (i >= 0) DR.favs.splice(i, 1); else DR.favs.push(id); App.store.set('drawFavs', DR.favs); };
  U.action = function (a, btn) {
    const ts = App.chart.api.timeScale();
    switch (a) {
      case 'measure': DR.setTool('measure'); break;
      case 'eraser': DR.setTool('eraser'); App.toast('Bấm vào hình cần xoá'); break;
      case 'zin': case 'zout': { const r = ts.getVisibleLogicalRange(); if (!r) break; const c = (r.from + r.to) / 2, w = (r.to - r.from) * (a === 'zin' ? 0.35 : 0.8); ts.setVisibleLogicalRange({ from: c - w, to: c + w }); break; }
      case 'magnet': DR.magnet = { off: 'weak', weak: 'strong', strong: 'off' }[DR.magnet]; App.store.set('magnet', DR.magnet); App.toast('Nam châm: ' + { off: 'tắt', weak: 'yếu', strong: 'mạnh' }[DR.magnet]); break;
      case 'keep': DR.keep = !DR.keep; App.store.set('keepDraw', DR.keep); App.toast('Tiếp tục vẽ: ' + (DR.keep ? 'bật' : 'tắt')); break;
      case 'lock': DR.lockAll = !DR.lockAll; App.toast(DR.lockAll ? 'Đã khoá tất cả hình vẽ' : 'Đã mở khoá hình vẽ'); break;
      case 'hide': DR.hideAll = !DR.hideAll; DR.select(null); break;
      case 'clear': if (!DR.list.length) App.toast('Chưa có hình vẽ nào'); else U.confirm(`Xoá tất cả ${DR.list.length} hình vẽ của ${App.state.sym}?`, DR.clearAll); break;
      case 'fav': U.drawSheet('fav'); break;
    }
    U.syncToolState();
  };
  U.syncToolState = function () {
    $$('#tools .tl[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === DR.tool));
    const set = (a, on) => { const b = $(`#tools [data-act="${a}"]`); if (b) b.classList.toggle('active', !!on); };
    set('magnet', DR.magnet !== 'off'); set('keep', DR.keep); set('lock', DR.lockAll); set('hide', DR.hideAll); set('measure', DR.tool === 'measure');
    const m = $('#tools [data-act="magnet"]'); if (m) m.title = 'Nam châm: ' + { off: 'tắt', weak: 'yếu', strong: 'mạnh' }[DR.magnet];
  };
  U.onToolChange = function (t) {
    U.syncToolState();
    if (t !== 'cursor' && t !== 'eraser' && U.mobile()) App.toast(`${DR.TOOLS[t] ? DR.TOOLS[t].name : t}: chạm lên biểu đồ để đặt điểm`, 'info', 2500);
  };

  /* ---------- Bảng "Bản vẽ" (giống TradingView điện thoại) ---------- */
  U.drawSheet = function (cat) {
    let cur = cat || App.store.get('drawCat', 'trend'), q = '';
    const s = U.sheet({ id: 'draw', title: 'Bản vẽ', body: `<div class="search">${ic('search')}<input placeholder="Tìm kiếm" id="dsQ"></div><div class="chips" id="dsCats"></div><div id="dsGrid"></div>` });
    const render = () => {
      $('#dsCats').innerHTML = DR.CATS.map(([k, n]) => `<button class="chip ${k === cur && !q ? 'active' : ''}" data-c="${k}">${n}</button>`).join('');
      let items;
      if (q) items = Object.values(DR.TOOLS).filter(t => !t.hidden && t.cat !== 'img' && t.name.toLowerCase().includes(q)).map(t => tile(t));
      else if (cur === 'tools') items = DR.ACTIONS.map(([id, nm, icon, kind]) => {
        const on = (id === 'keep' && DR.keep) || (id === 'hide' && DR.hideAll) || (id === 'lock' && DR.lockAll) || (id === 'magnet' && DR.magnet !== 'off');
        const label = id === 'magnet' ? 'Nam châm ' + { off: '(tắt)', weak: 'yếu', strong: 'mạnh' }[DR.magnet] : nm;
        return `<button class="tile ${kind ? 'big-tile' : ''} ${on ? 'on' : ''}" data-act="${id}">${icon}<span>${label}</span></button>`; });
      else if (cur === 'fav') items = DR.favs.filter(id => DR.TOOLS[id]).map(id => tile(DR.TOOLS[id]));
      else items = Object.values(DR.TOOLS).filter(t => t.cat === cur && !t.hidden).map(t => tile(t));
      $('#dsGrid').innerHTML = items.length ? `<div class="grid3">${items.join('')}</div>` : '<div class="empty">Chưa có công cụ yêu thích — bấm ☆ trên ô công cụ để thêm</div>';
    };
    const tile = t => `<button class="tile ${DR.tool === t.id ? 'active' : ''}" data-tool="${t.id}">${t.icon}<span>${esc(t.cat === 'img' ? '' : t.name)}</span><span class="fav ${DR.favs.includes(t.id) ? 'on' : ''}" data-fav="${t.id}">${ic('star')}</span></button>`;
    render();
    $('#dsQ').oninput = e => { q = e.target.value.trim().toLowerCase(); render(); };
    s.addEventListener('click', e => {
      const c = e.target.closest('[data-c]'); if (c) { cur = c.dataset.c; App.store.set('drawCat', cur); q = ''; $('#dsQ').value = ''; render(); return; }
      const f = e.target.closest('[data-fav]'); if (f) { e.stopPropagation(); U.toggleFav(f.dataset.fav); render(); return; }
      const a = e.target.closest('[data-act]'); if (a) { U.action(a.dataset.act); if (['measure', 'eraser', 'zin', 'zout', 'clear'].includes(a.dataset.act)) U.close('draw'); else render(); return; }
      const t = e.target.closest('[data-tool]'); if (t) { DR.setTool(t.dataset.tool); U.close('draw'); }
    });
  };

  /* ---------- Thanh công cụ của hình đang chọn ---------- */
  const COLORS = ['#2962ff', '#14d1a0', '#089981', '#c6f432', '#ffeb3b', '#ff9800', '#f23645', '#e91e63', '#9c27b0', '#673ab7', '#00bcd4', '#795548', '#787b86', '#ffffff', '#000000', '#0f7a43'];
  U.drawToolbar = function (d) {
    const bar = $('#drawBar');
    if (!d) { bar.classList.add('hidden'); return; }
    const def = DR.TOOLS[d.tool] || {}, st = d.style;
    bar.innerHTML = `<span class="ot-ico tsvg" title="${esc(def.name)}">${def.icon || ''}</span>
      <button data-a="color" title="Màu"><span class="sw" style="background:${st.color}"></span></button>
      <select data-a="width" title="Độ dày">${[1, 2, 3, 4, 6, 10, 16].map(w => `<option ${+st.width === w ? 'selected' : ''} value="${w}">${w}px</option>`).join('')}</select>
      <select data-a="dash" title="Kiểu nét"><option value="solid">━━</option><option value="dashed" ${st.dash === 'dashed' ? 'selected' : ''}>╍╍</option><option value="dotted" ${st.dash === 'dotted' ? 'selected' : ''}>┈┈</option></select>
      ${def.text ? `<button data-a="text" title="Sửa chữ">${ic('text')}</button><select data-a="fs" title="Cỡ chữ">${[10, 12, 14, 18, 24, 32, 48].map(z => `<option ${+(st.fontSize || 12) === z ? 'selected' : ''}>${z}</option>`).join('')}</select>` : ''}
      ${(def.opts || []).includes('extL') ? `<button data-a="extL" class="${st.extL ? 'on' : ''}" title="Kéo dài sang trái">${ic('extL')}</button>` : ''}
      ${(def.opts || []).includes('extR') ? `<button data-a="extR" class="${st.extR ? 'on' : ''}" title="Kéo dài sang phải">${ic('extR')}</button>` : ''}
      ${(def.opts || []).includes('info') ? `<button data-a="info" class="${st.info ? 'on' : ''}" title="Hiện thông tin">${ic('info')}</button>` : ''}
      ${d.tool === 'image' ? `<button data-a="img" title="Chọn ảnh">${ic('folder')}</button>` : ''}
      <span class="dsep"></span>
      <button data-a="lock" class="${d.locked ? 'on' : ''}" title="${d.locked ? 'Mở khoá' : 'Khoá'}">${ic(d.locked ? 'lock' : 'unlock')}</button>
      <button data-a="clone" title="Nhân bản">${ic('copy')}</button>
      <button data-a="hide" title="Ẩn">${ic('eyeoff')}</button>
      <button data-a="del" title="Xoá (Delete)">${ic('trash')}</button>`;
    bar.classList.remove('hidden');
    bar.onchange = e => { const a = e.target.dataset.a; if (a === 'width') st.width = +e.target.value; if (a === 'dash') st.dash = e.target.value; if (a === 'fs') st.fontSize = +e.target.value; DR.save(); Object.assign(DR.style, { width: st.width, dash: st.dash }); App.store.set('drawStyle', DR.style); };
    bar.onclick = e => {
      const b = e.target.closest('button'); if (!b) return; const a = b.dataset.a;
      if (a === 'color') return U.colorPop(b, st.color, c => { st.color = c; DR.style.color = c; App.store.set('drawStyle', DR.style); DR.save(); U.drawToolbar(d); });
      if (a === 'text') return DR.editText(d);
      if (a === 'img') return U.pickImage(d);
      if (a === 'extL' || a === 'extR' || a === 'info') st[a] = !st[a];
      if (a === 'lock') d.locked = !d.locked;
      if (a === 'clone') return DR.clone(d);
      if (a === 'hide') { d.hidden = true; DR.select(null); DR.save(); App.toast('Đã ẩn — bật lại trong Cây đối tượng'); return; }
      if (a === 'del') return DR.remove(d);
      DR.save(); U.drawToolbar(d);
    };
  };
  U.colorPop = function (anchor, cur, cb) {
    const f = $('#flyout');
    f.innerHTML = `<div class="swatches">${COLORS.map(c => `<button style="background:${c}" class="${c === cur ? 'on' : ''}" data-c="${c}"></button>`).join('')}</div><div style="padding:4px 8px 8px"><input type="color" value="${cur && cur[0] === '#' ? cur.slice(0, 7) : '#2962ff'}" style="width:100%;height:30px;border:none;background:none"></div>`;
    const r = anchor.getBoundingClientRect();
    f.style.left = Math.min(r.left, window.innerWidth - 240) + 'px'; f.style.top = (r.bottom + 6 + 200 > window.innerHeight ? r.top - 210 : r.bottom + 6) + 'px';
    f.classList.remove('hidden');
    f.onclick = e => { const b = e.target.closest('[data-c]'); if (b) { cb(b.dataset.c); f.classList.add('hidden'); } };
    f.querySelector('input').oninput = e => cb(e.target.value);
    setTimeout(() => document.addEventListener('pointerdown', function h(ev) { if (!f.contains(ev.target)) { f.classList.add('hidden'); document.removeEventListener('pointerdown', h); } }), 0);
  };

  /* =========================================================
   * CHÚ THÍCH (legend) — dòng giá + từng chỉ báo có nút ẩn/cài đặt/xoá
   * ========================================================= */
  U.legendOpen = App.store.get('legendOpen', true);
  U.legend = function (param) {
    const C = App.chart, v = C.view; if (!v || !v.length) return;
    let i = v.length - 1;
    if (param && param.time != null) { const k = v.findIndex(b => b.time === param.time); if (k >= 0) i = k; }

      <div id="sCsv" class="hidden"><label class="f">Nhập file CSV (cột: Ngày, Mở, Cao, Thấp, Đóng, Khối lượng)</label><div class="row"><input class="inp" id="csvName" placeholder="Tên hiển thị, VD: VANG_SJC"><label class="btn" style="flex:0">Chọn file…<input type="file" id="csvFile" accept=".csv,.txt,text/csv" hidden></label></div></div>
      <label class="f">Đã xem gần đây</label><div class="chips wrap" id="sRecent"></div>` });
    const render = () => {
      $('#sSrc').innerHTML = Object.entries(App.sources).map(([k, x]) => `<button class="chip ${k === src ? 'active' : ''}" data-src="${k}">${x.label}</button>`).join('');
      $('#sHint').textContent = App.sources[src].hint + (src === 'TD' && !App.settings.tdKey ? ' — chưa có API key, vào Cài đặt › Nguồn dữ liệu.' : '');
      const chips = src === 'CSV' ? App.store.get('csvNames', []) : CHIPS[src];
      $('#sChips').innerHTML = chips.map(c => { const n = App.symName(src, c); return `<button class="chip" data-sym="${esc(c)}">${esc(c)}${n ? ` <small>${esc(n)}</small>` : ''}</button>`; }).join('');
      $('#sCsv').classList.toggle('hidden', src !== 'CSV');
      $('#sRecent').innerHTML = App.store.get('recent', []).map(r => `<button class="chip" data-rs="${r.src}" data-sym="${esc(r.sym)}">${esc(r.sym)} <small>${App.sources[r.src] ? App.sources[r.src].short : ''}</small></button>`).join('') || '<span class="note">Chưa có</span>';
    };
    const choose = (sr, sym) => {
      if (!sym) return; U.close('sym'); sym = App.sources[sr].normalize(sym);
      if (mode === 'compare') App.chart.addCompare(sr, sym);
      else if (mode === 'watch') App.panels.addWatch(sr, sym, after);
      else App.loadSymbol(sr, sym, App.state.tf);
    };
    render();
    s.addEventListener('click', e => {
      const a = e.target.closest('[data-src]'); if (a) { src = a.dataset.src; render(); return; }
      const b = e.target.closest('[data-sym]'); if (b) choose(b.dataset.rs || src, b.dataset.sym);
    });
    $('#sQ').addEventListener('keydown', e => { if (e.key === 'Enter') choose(src, e.target.value.trim()); });
    $('#csvFile').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const bars = App.parseCSV(await f.text()), name = ($('#csvName').value.trim() || f.name.replace(/\.\w+$/, '')).toUpperCase().slice(0, 30);
        App.csvSets[name] = bars; App.store.set('csv:' + name, bars);
        const names = App.store.get('csvNames', []); if (!names.includes(name)) { names.push(name); App.store.set('csvNames', names); }
        App.toast(`Đã nhập ${bars.length} dòng`, 'ok'); choose('CSV', name);
      } catch (err) { App.toast('Lỗi đọc CSV: ' + err.message, 'err', 6000); }
    };
    setTimeout(() => !U.mobile() && $('#sQ').focus(), 80);
  };

  U.about = function () {
    U.sheet({ id: 'about', title: 'GreenView', cls: 'small', body: `<div style="text-align:center;padding:8px 0"><span class="logo">${App.logoSVG(App.theme, 64)}</span><h2 style="margin:8px 0 2px">Green<span style="color:var(--accent)">View</span></h2><p class="note">Công cụ biểu đồ giá cá nhân · ${Object.values(App.INDICATORS).filter(d => !d.need).length} chỉ báo &amp; mô hình · ${Object.values(App.draw.TOOLS).filter(t => !t.hidden).length} công cụ vẽ</p>
      <p class="note">Biểu đồ dùng thư viện mã nguồn mở Lightweight Charts™ của TradingView (giấy phép Apache 2.0).<br>Không phải lời khuyên đầu tư.</p></div>` });
  };
})(window.App);

</script>
<script>
/* --- js/panels.js --- */
/* =========================================================
 * panels.js — Danh sách theo dõi, cảnh báo, cây đối tượng, đánh giá kỹ thuật,
 *             thông tin mã, Trung tâm phân tích, bố cục, mẫu chỉ báo,
 *             phát lại thanh, kiểm tra chiến lược, chụp ảnh
 * ========================================================= */
(function (App) {
  'use strict';
  const $ = App.$, $$ = App.$$, esc = App.esc, ic = App.icon, U = App.ui;
  const P = App.panels = {};

  /* ---------- Tên & biểu tượng tròn cho từng mã ---------- */
  const NAMES = {
    BTCUSDT: 'Bitcoin / TetherUS', ETHUSDT: 'Ethereum / TetherUS', BNBUSDT: 'BNB / TetherUS', SOLUSDT: 'Solana / TetherUS', XRPUSDT: 'XRP / TetherUS', DOGEUSDT: 'Dogecoin / TetherUS', ADAUSDT: 'Cardano / TetherUS', PAXGUSDT: 'PAX Gold / TetherUS',
    VNINDEX: 'Chỉ số VN-Index', VN30: 'Chỉ số VN30', HNXINDEX: 'Chỉ số HNX', VNM: 'CTCP Sữa Việt Nam', FPT: 'CTCP FPT', HPG: 'CTCP Tập đoàn Hòa Phát', VCB: 'Ngân hàng Vietcombank', MWG: 'CTCP Thế Giới Di Động', SSI: 'CTCP Chứng khoán SSI', VIC: 'Tập đoàn Vingroup', TCB: 'Ngân hàng Techcombank', VIX: 'CTCP Chứng khoán VIX',
    AAPL: 'Apple Inc.', MSFT: 'Microsoft Corp.', NVDA: 'NVIDIA Corp.', TSLA: 'Tesla, Inc.', NFLX: 'Netflix, Inc.', 'EUR/USD': 'Euro / Đô la Mỹ', 'USD/JPY': 'Đô la Mỹ / Yên Nhật', 'GBP/USD': 'Bảng Anh / Đô la Mỹ', 'XAU/USD': 'Vàng / Đô la Mỹ', SPX: 'Chỉ số S&P 500', DXY: 'Chỉ số Đồng Đô la Mỹ',
    DEMO: 'Dữ liệu giả lập'
  };
  App.symName = (src, sym) => NAMES[sym] || (src === 'BINANCE' && /USDT$/.test(sym) ? sym.replace(/USDT$/, '') + ' / TetherUS' : '');
  const BADGE = { BTCUSDT: ['₿', '#f7931a'], ETHUSDT: ['Ξ', '#627eea'], BNBUSDT: ['B', '#f3ba2f'], SOLUSDT: ['S', '#9945ff'], XRPUSDT: ['X', '#23292f'], DOGEUSDT: ['Ð', '#c2a633'], ADAUSDT: ['A', '#0033ad'], PAXGUSDT: ['Au', '#d4a017'],
    'XAU/USD': ['Au', '#d4a017'], 'EUR/USD': ['€', '#1e5aa8'], 'USD/JPY': ['¥', '#bc002d'], 'GBP/USD': ['£', '#012169'], AAPL: ['', '#1c1c1e'], TSLA: ['T', '#e31937'], NFLX: ['N', '#e50914'], MSFT: ['M', '#00a4ef'], NVDA: ['N', '#76b900'],
    SPX: ['500', '#b22234'], DXY: ['$', '#2e7d5b'], VNINDEX: ['VN', '#da251d'], VN30: ['30', '#da251d'] };
  App.badge = function (src, sym) {
    if (BADGE[sym]) return { txt: BADGE[sym][0] || sym[0], bg: BADGE[sym][1] };
    let h = 0; for (const c of sym) h = (h * 31 + c.charCodeAt(0)) % 360;
    return { txt: sym.replace(/[^A-Z0-9]/g, '').slice(0, src === 'VN' ? 3 : 2), bg: `hsl(${h},55%,40%)` };
  };

  /* =========================================================
   * THANH BÊN & TRANG ĐIỆN THOẠI
   * ========================================================= */
  P.tab = App.store.get('sideTab', 'wl');
  P.show = function (tab) {
    P.tab = tab; App.store.set('sideTab', tab);
    $$('.st').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    ({ wl: P.renderWatch, al: P.renderAlerts, ot: P.renderTree, tr: P.renderRating, in: P.renderInfo }[tab] || P.renderWatch)();
  };
  P.initSide = function () {
    $$('.st').forEach(b => b.onclick = () => P.show(b.dataset.tab));
    $$('#bottomNav button').forEach(b => b.onclick = () => P.page(b.dataset.page));
    P.show(U.mobile() ? 'wl' : P.tab);
    if (U.mobile()) $('#side').classList.add('closed');
  };
  // Điều hướng trên điện thoại
  P.page = function (pg) {
    $$('#bottomNav button').forEach(b => b.classList.toggle('active', b.dataset.page === pg));
    if (pg === 'chart') { $('#side').classList.add('closed'); return; }
    if (pg === 'menu') { $('#side').classList.add('closed'); P.hub(); $$('#bottomNav button').forEach(b => b.classList.toggle('active', b.dataset.page === 'chart')); return; }
    $('#side').classList.remove('closed'); P.show(pg);
  };
  P.refreshSide = () => { if (!$('#side').classList.contains('closed')) P.show(P.tab); };

  /* =========================================================
   * DANH SÁCH THEO DÕI (có nhóm, như TradingView)
   * ========================================================= */
  let wl = App.store.get('wl2', [
    { sec: 'Crypto' }, { src: 'BINANCE', sym: 'BTCUSDT' }, { src: 'BINANCE', sym: 'ETHUSDT' }, { src: 'BINANCE', sym: 'SOLUSDT' }, { src: 'BINANCE', sym: 'PAXGUSDT' },
    { sec: 'Cổ phiếu Việt Nam' }, { src: 'VN', sym: 'VNINDEX' }, { src: 'VN', sym: 'FPT' }, { src: 'VN', sym: 'HPG' }, { src: 'VN', sym: 'VIX' },
    { sec: 'Mỹ · Forex · Vàng' }, { src: 'TD', sym: 'XAU/USD' }, { src: 'TD', sym: 'AAPL' }, { src: 'TD', sym: 'EUR/USD' },
    { sec: 'Giả lập' }, { src: 'DEMO', sym: 'DEMO' }
  ]);
  const quotes = {}; const qk = (s, y) => s + ':' + y;
  P.quotes = quotes;
  const saveWl = () => App.store.set('wl2', wl);
  P.addWatch = function (src, sym, afterSec) {
    if (wl.some(w => w.src === src && w.sym === sym)) return App.toast(sym + ' đã có trong danh sách');
    let at = wl.length;
    if (afterSec != null) { at = afterSec + 1; while (at < wl.length && !wl[at].sec) at++; }
    wl.splice(at, 0, { src, sym }); saveWl(); P.refreshQuotes([src]); P.refreshSide(); App.toast('Đã thêm ' + sym, 'ok');
  };
  P.renderWatch = function () {
    const s = App.state;
    let h = `<div class="sec-head"><span>Danh sách theo dõi</span><span style="display:flex;gap:2px"><button data-w="addsec" title="Thêm nhóm">${ic('folder')}</button><button data-w="add" title="Thêm mã">${ic('plus')}</button></span></div>`;
    wl.forEach((w, i) => {
      if (w.sec) { h += `<div class="wl-sec"><span>${esc(w.sec)}</span><span style="display:flex;gap:2px"><button class="mini" data-w="addto" data-i="${i}" title="Thêm mã vào nhóm">${ic('plus')}</button><button class="mini" data-w="delsec" data-i="${i}" title="Xoá nhóm">${ic('x')}</button></span></div>`; return; }
      const q = quotes[qk(w.src, w.sym)], b = App.badge(w.src, w.sym), cls = q ? (q.chg >= 0 ? 'up' : 'down') : 'muted', need = w.src === 'TD' && !App.settings.tdKey;
      const abs = q && q.prev ? q.price - q.prev : null;
      h += `<div class="wl-row ${w.src === s.src && w.sym === s.sym ? 'cur' : ''}" data-i="${i}">
        <span class="wl-ico" style="background:${b.bg}">${esc(b.txt)}</span>
        <span class="wl-nm"><b>${esc(w.sym)}</b><small>${esc(App.symName(w.src, w.sym) || App.sources[w.src].short)}</small></span>
        <span class="wl-px" data-q="${esc(qk(w.src, w.sym))}"><b>${q ? App.fmtPrice(q.price) : need ? '<small class="muted">cần key</small>' : '…'}</b><small class="${cls}">${q ? (abs != null ? (abs >= 0 ? '+' : '') + App.fmtPrice(abs) + ' ' : '') + App.fmtPct(q.chg) : ''}</small></span>
        <button class="del" data-w="del" data-i="${i}" title="Bỏ khỏi danh sách">${ic('x')}</button></div>`;
    });
    $('#sideBody').innerHTML = h;
  };
  $('#sideBody') && 0;
  document.addEventListener('click', e => {
    const body = e.target.closest('#sideBody'); if (!body || P.tab !== 'wl') return;
    const b = e.target.closest('[data-w]');
    if (b) {
      e.stopPropagation(); const i = +b.dataset.i;
      if (b.dataset.w === 'del') { wl.splice(i, 1); saveWl(); P.renderWatch(); }
      if (b.dataset.w === 'delsec') U.confirm(`Xoá nhóm "${wl[i].sec}" (các mã trong nhóm vẫn giữ)?`, () => { wl.splice(i, 1); saveWl(); P.renderWatch(); });
      if (b.dataset.w === 'add') U.symbolSheet('watch');
      if (b.dataset.w === 'addto') U.symbolSheet('watch', i);
      if (b.dataset.w === 'addsec') U.prompt('Tên nhóm mới', '', v => { if (v && v.trim()) { wl.push({ sec: v.trim() }); saveWl(); P.renderWatch(); } });
      return;
    }
    const r = e.target.closest('.wl-row');
    if (r) { const w = wl[+r.dataset.i]; App.loadSymbol(w.src, w.sym, App.state.tf); if (U.mobile()) P.page('chart'); }
  });

  const POLL = { BINANCE: 10, DEMO: 5, CSV: 3600, VN: 60, TD: 180 }, lastPoll = {};
  P.refreshQuotes = async function (only) {
    const groups = {};
    wl.forEach(w => { if (!w.sec) (groups[w.src] = groups[w.src] || []).push(w.sym); });
    await Promise.all(Object.entries(groups).map(async ([src, syms]) => {
      if (only && !only.includes(src)) return;
      lastPoll[src] = Date.now();
      try {
        const res = await App.sources[src].quotes(syms);
        Object.entries(res).forEach(([sym, q]) => {
          const k = qk(src, sym), old = quotes[k];
          q.prev = q.price / (1 + q.chg / 100);
          quotes[k] = q;
          if (!(src === App.state.src && sym === App.state.sym)) App.onPrice(src, sym, q.price, true);
          if (old && old.price !== q.price) { const el = document.querySelector(`[data-q="${CSS.escape(k)}"]`); if (el) { const row = el.parentElement; row.classList.remove('flash-up', 'flash-down'); void row.offsetWidth; row.classList.add(q.price > old.price ? 'flash-up' : 'flash-down'); } }
        });
      } catch (e) { /* thử lại lần sau */ }
    }));
    if (P.tab === 'wl') P.refreshSide();
  };
  setInterval(() => { const due = Object.keys(POLL).filter(s => !lastPoll[s] || Date.now() - lastPoll[s] >= POLL[s] * 1000); if (due.length) P.refreshQuotes(due); }, 5000);
  P.liveQuote = function (src, sym, price) {
    const q = quotes[qk(src, sym)]; if (!q || q.price === price) return;
    q.price = price; if (q.prev) q.chg = (price / q.prev - 1) * 100;
    const el = document.querySelector(`[data-q="${CSS.escape(qk(src, sym))}"] b`); if (el) el.textContent = App.fmtPrice(price);
  };

  /* =========================================================
   * CẢNH BÁO GIÁ
   * ========================================================= */
  let alerts = App.store.get('alerts', []), alog = App.store.get('alertLog', []);
  const saveAl = () => { App.store.set('alerts', alerts); App.store.set('alertLog', alog.slice(0, 50)); P.badge(); };
  P.badge = () => { const n = alerts.filter(a => a.on).length; $('#alBadge').textContent = n; $('#alBadge').classList.toggle('hidden', !n); };
  App.onPrice = function (src, sym, price, fromQuote) {
    if (!fromQuote) P.liveQuote(src, sym, price);
    alerts.forEach(a => {
      if (!a.on || a.src !== src || a.sym !== sym) return;
      const prev = a.last; a.last = price;
      const hit = a.op === '>=' ? price >= a.price : a.op === '<=' ? price <= a.price : prev != null && ((prev < a.price && price >= a.price) || (prev > a.price && price <= a.price));
      if (hit) {
        a.on = false; const msg = `🔔 ${a.sym} ${{ '>=': '≥', '<=': '≤', 'x': 'cắt' }[a.op]} ${App.fmtPrice(a.price)} — giá ${App.fmtPrice(price)}${a.note ? ' (' + a.note + ')' : ''}`;
        alog.unshift({ msg, at: Date.now() }); saveAl(); App.toast(msg, 'alert', 15000); App.beep();
        try { if ('Notification' in window && Notification.permission === 'granted') new Notification('GreenView — Cảnh báo giá', { body: msg }); } catch (e) {}
        if (P.tab === 'al') P.refreshSide();
      }
    });
  };
  P.renderAlerts = function () {
    $('#sideBody').innerHTML = `<div class="sec-head"><span>Cảnh báo</span><button data-a="new" title="Tạo cảnh báo">${ic('plus')}</button></div>` +
      (alerts.map((a, i) => `<div class="al-row ${a.on ? '' : 'off'}"><span class="wl-ico" style="background:${App.badge(a.src, a.sym).bg};width:28px;height:28px">${esc(App.badge(a.src, a.sym).txt)}</span>
        <div class="info"><b>${esc(a.sym)}</b> ${{ '>=': '≥', '<=': '≤', 'x': 'cắt' }[a.op]} ${App.fmtPrice(a.price)}<small>${esc(App.sources[a.src] ? App.sources[a.src].short : a.src)}${a.note ? ' · ' + esc(a.note) : ''}${a.on ? ' · đang chờ' : ' · đã kích hoạt / tắt'}</small></div>
        <button class="mini" data-a="tog" data-i="${i}" title="${a.on ? 'Tắt' : 'Bật lại'}">${ic(a.on ? 'pause' : 'play')}</button><button class="mini" data-a="del" data-i="${i}" title="Xoá">${ic('trash')}</button></div>`).join('') || '<div class="empty">Chưa có cảnh báo nào</div>') +
      `<div class="sec-head"><span>Nhật ký</span></div>` + (alog.slice(0, 20).map(l => `<div class="log-row">${esc(l.msg)}<br><small>${new Date(l.at).toLocaleString('vi-VN')}</small></div>`).join('') || '<div class="empty">—</div>') +
      '<p class="note">Cảnh báo chỉ hoạt động khi trang GreenView đang mở.</p>';
    $('#sideBody').onclick = e => {
      if (P.tab !== 'al') return; const b = e.target.closest('[data-a]'); if (!b) return;
      if (b.dataset.a === 'new') P.alertSheet();
      if (b.dataset.a === 'tog') { alerts[+b.dataset.i].on = !alerts[+b.dataset.i].on; saveAl(); P.renderAlerts(); }
      if (b.dataset.a === 'del') { alerts.splice(+b.dataset.i, 1); saveAl(); P.renderAlerts(); }
    };
  };
  P.alertSheet = function (price) {
    const s = App.state, last = s.bars[s.bars.length - 1];
    const sh = U.sheet({ id: 'alert', title: 'Tạo cảnh báo', cls: 'small', body: `<label class="f">Mã</label><div class="inp">${esc(s.sym)} · ${esc(App.sources[s.src].short)}</div>
      <label class="f">Điều kiện</label><select id="aOp"><option value="x">Giá cắt qua</option><option value=">=">Giá lên đến hoặc vượt (≥)</option><option value="<=">Giá xuống đến hoặc thấp hơn (≤)</option></select>
      <label class="f">Mức giá</label><input type="number" step="any" id="aPx" value="${price || (last ? +last.close.toPrecision(6) : '')}">
      <p class="note">Giá hiện tại: ${last ? App.fmtPrice(last.close) : '–'}</p><label class="f">Ghi chú</label><input type="text" id="aNote" maxlength="60" placeholder="VD: chốt lời">`,
      foot: '<button class="btn" data-c>Huỷ</button><button class="btn pri" data-ok>Tạo</button>' });
    sh.querySelector('[data-c]').onclick = () => U.close('alert');
    sh.querySelector('[data-ok]').onclick = () => {
      const px = parseFloat($('#aPx').value); if (!(px > 0)) return App.toast('Nhập mức giá', 'err');
      alerts.push({ id: Date.now(), src: s.src, sym: s.sym, op: $('#aOp').value, price: px, note: $('#aNote').value.trim(), on: true, last: last ? last.close : null });
      saveAl(); U.close('alert'); App.toast('Đã tạo cảnh báo cho ' + s.sym, 'ok');
      try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {}); } catch (e) {}
      if (!wl.some(w => w.src === s.src && w.sym === s.sym)) P.addWatch(s.src, s.sym);
      P.refreshSide();
    };
  };

  /* =========================================================
   * CÂY ĐỐI TƯỢNG
   * ========================================================= */
  P.renderTree = function () {
    const C = App.chart, D = App.draw;
    let h = `<div class="sec-head"><span>Chỉ báo (${C.inds.length})</span><button data-t="addind" title="Thêm chỉ báo">${ic('plus')}</button></div>`;
    h += C.inds.map(x => { const d = App.INDICATORS[x.id]; return `<div class="ot-row"><span class="ot-ico">${ic('fx')}</span><div class="info">${esc(d ? d.name : x.id)}<small>${d && d.overlay ? 'Trên biểu đồ giá' : 'Khung riêng'}</small></div>
      <button class="mini" data-t="ieye" data-u="${x.uid}">${ic(x.hidden ? 'eyeoff' : 'eye')}</button><button class="mini" data-t="iset" data-u="${x.uid}">${ic('gear')}</button><button class="mini" data-t="idel" data-u="${x.uid}">${ic('trash')}</button></div>`; }).join('') || '<div class="empty">Chưa có</div>';
    h += `<div class="sec-head"><span>Hình vẽ (${D.list.length})</span>${D.list.length ? `<button data-t="dclear" title="Xoá tất cả">${ic('trash')}</button>` : ''}</div>`;
    h += D.list.map((d, i) => { const t = D.TOOLS[d.tool] || {}; return `<div class="ot-row"><span class="ot-ico tsvg">${t.icon || ''}</span><div class="info" data-t="dsel" data-k="${i}" style="cursor:pointer">${esc(t.name || d.tool)}${d.style.text ? ` <small>${esc(String(d.style.text).slice(0, 30))}</small>` : ''}</div>
      <button class="mini" data-t="deye" data-k="${i}">${ic(d.hidden ? 'eyeoff' : 'eye')}</button><button class="mini" data-t="dlock" data-k="${i}">${ic(d.locked ? 'lock' : 'unlock')}</button><button class="mini" data-t="ddel" data-k="${i}">${ic('trash')}</button></div>`; }).join('') || '<div class="empty">Chưa có hình vẽ cho mã này</div>';
    $('#sideBody').innerHTML = h;
    $('#sideBody').onclick = e => {
      if (P.tab !== 'ot') return; const b = e.target.closest('[data-t]'); if (!b) return;
      const t = b.dataset.t, inst = C.inds.find(x => x.uid === +b.dataset.u), d = D.list[+b.dataset.k];
      if (t === 'addind') U.indSheet();

  const gauge = (v, size = 200) => {
    const a = Math.PI * (1 - (v + 1) / 2), cx = size / 2, cy = size * 0.55, r = size * 0.4;
    const seg = (a1, a2, col) => `<path d="M${cx + r * Math.cos(a1)} ${cy - r * Math.sin(a1)} A${r} ${r} 0 0 1 ${cx + r * Math.cos(a2)} ${cy - r * Math.sin(a2)}" stroke="${col}" stroke-width="${size * 0.06}" fill="none"/>`;
    const cols = [App.theme.down, '#f0596b99', App.theme.muted, App.theme.up + '99', App.theme.up];
    let h = `<svg width="${size}" height="${size * 0.62}" viewBox="0 0 ${size} ${size * 0.62}">`;
    for (let k = 0; k < 5; k++) h += seg(Math.PI - k * Math.PI / 5 - 0.03, Math.PI - (k + 1) * Math.PI / 5 + 0.03, cols[k]);
    h += `<line x1="${cx}" y1="${cy}" x2="${cx + r * 0.85 * Math.cos(a)}" y2="${cy - r * 0.85 * Math.sin(a)}" stroke="${App.theme.text}" stroke-width="3" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="5" fill="${App.theme.text}"/></svg>`;
