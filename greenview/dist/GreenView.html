<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>GreenView</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* =========================================================
 * GreenView — giao diện
 * Màu lấy từ biến CSS do theme.js đặt (--bg, --panel, --accent…)
 * ========================================================= */
:root { --r: 8px; --top-h: 48px; --tools-w: 48px; --side-w: 300px; color-scheme: dark; }
[data-theme=light] { color-scheme: light; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
  font: 13px/1.45 "Be Vietnam Pro", -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
.hidden { display: none !important; }
.grow { flex: 1; }
.muted { color: var(--muted); }
.up { color: var(--up); } .down { color: var(--down); }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
#app { display: flex; flex-direction: column; height: 100%; }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

/* ---------------- Thanh trên ---------------- */
#top { height: var(--top-h); display: flex; align-items: center; gap: 4px; padding: 0 8px; padding-top: env(safe-area-inset-top);
  background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0; overflow-x: auto; scrollbar-width: none; }
#top::-webkit-scrollbar { display: none; }
.brand { display: flex; align-items: center; gap: 7px; padding: 0 8px 0 2px; text-decoration: none; color: var(--text); flex-shrink: 0; cursor: pointer; }
.brand-name { font-weight: 700; font-size: 16px; letter-spacing: -.2px; } .brand-name b { color: var(--accent); font-weight: 700; }
.logo { display: inline-flex; }
.sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; flex-shrink: 0; }
.ib, .tb, .sym-btn, .tfbar button { background: none; border: none; border-radius: 6px; height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--text); flex-shrink: 0; transition: background .12s; }
.ib { width: 34px; } .tb { padding: 0 10px; font-weight: 500; }
.ib:hover, .tb:hover, .sym-btn:hover, .tfbar button:hover { background: var(--hover); }
.ib.on, .tb.on { color: var(--accent); background: var(--accent-soft); }
.tb i, #bottomNav i { display: inline-flex; }
.sym-btn { padding: 0 10px 0 6px; font-weight: 700; font-size: 15px; }
.sym-ico { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #fff; }
.src-tag { font-size: 10px; font-weight: 500; color: var(--muted); background: var(--panel2); padding: 2px 6px; border-radius: 4px; }
.tfbar { display: flex; gap: 1px; flex-shrink: 0; }
.tfbar button { padding: 0 8px; color: var(--muted); font-weight: 500; }
.tfbar button.active { color: var(--accent); background: var(--accent-soft); }
.tfbar button:disabled { opacity: .3; cursor: not-allowed; }
.banner { background: rgba(255,152,0,.12); border-bottom: 1px solid rgba(255,152,0,.35); color: #e6a23c; padding: 7px 12px; font-size: 12px; flex-shrink: 0; display: flex; gap: 8px; align-items: center; }
.banner .x { margin-left: auto; background: none; border: none; color: inherit; }

/* ---------------- Khu chính ---------------- */
#main { flex: 1; display: flex; min-height: 0; position: relative; }
#tools { width: var(--tools-w); background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; flex-shrink: 0; overflow-y: auto; scrollbar-width: none; }
#tools::-webkit-scrollbar { display: none; }
.tl { width: 38px; height: 38px; border: none; background: none; border-radius: 7px; color: var(--text); display: flex; align-items: center; justify-content: center; position: relative; }
.tl svg { width: 26px; height: 26px; }
.tl:hover { background: var(--hover); }
.tl.active { background: var(--accent-soft); color: var(--accent); }
.tl.grp::after { content: ''; position: absolute; right: 3px; bottom: 3px; border: 3px solid transparent; border-right-color: var(--muted); border-bottom-color: var(--muted); }
.tl-sep { width: 26px; height: 1px; background: var(--line); margin: 4px 0; }
/* biểu tượng công cụ vẽ */
.tsvg svg, .tl svg, .tile svg { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.tsvg svg .h, .tl svg .h, .tile svg .h { fill: var(--panel); stroke: currentColor; stroke-width: 1.2; }
.tile svg text, .tl svg text { fill: currentColor; stroke: none; font-weight: 600; font-family: sans-serif; }
.emo { font-size: 22px; line-height: 1; }

#center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#chartWrap { flex: 1; position: relative; min-height: 0; }
#chart { position: absolute; inset: 0; }
.draw-layer { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; }
#chartWrap.drawing { cursor: crosshair; }
#chartWrap.drawing .lg-row, #chartWrap.drawing .lg-toggle { pointer-events: none; }
#chartWrap.drawing #chart { cursor: crosshair; }
#chartWrap.over-draw #chart { cursor: move; }
#chartWrap[data-handle="1"] #chart { cursor: pointer; }
#watermark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 1; font-size: 64px; font-weight: 700; color: var(--text); opacity: .045; letter-spacing: 2px; }

/* Chú thích (legend) */
#legend { position: absolute; left: 8px; top: 6px; z-index: 5; max-width: calc(100% - 90px); pointer-events: none; }
.lg-main { display: flex; align-items: center; gap: 8px; white-space: nowrap; flex-wrap: wrap; text-shadow: 0 0 4px var(--bg); }
.lg-main .nm { font-weight: 600; font-size: 14px; }
.lg-ohlc { display: flex; gap: 8px; font-size: 12px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.lg-ohlc b { color: var(--muted); font-weight: 500; margin-right: 2px; }
.lg-row { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 2px; pointer-events: auto; width: max-content; max-width: 100%; padding: 1px 4px 1px 2px; border-radius: 4px; border: 1px solid transparent; }
.lg-row:hover { background: var(--panel); border-color: var(--line); }
.lg-row .t { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.lg-row .v { font-variant-numeric: tabular-nums; white-space: nowrap; }
.lg-row .acts { display: none; gap: 1px; }
.lg-row:hover .acts, .lg-row.touch .acts { display: flex; }
.lg-row .acts button { background: none; border: none; width: 22px; height: 22px; padding: 0; color: var(--muted); display: flex; align-items: center; justify-content: center; border-radius: 4px; }
.lg-row .acts button:hover { color: var(--text); background: var(--hover); }
.lg-row .acts svg { width: 15px; height: 15px; }
.lg-row.off .t, .lg-row.off .v { opacity: .45; }
.lg-toggle { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; color: var(--muted); font-size: 11px; padding: 0 6px; margin-top: 3px; }

#paneLegends { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 5; }
.pane-lg { position: absolute; left: 8px; pointer-events: none; white-space: nowrap; }
.pane-lg .lg-row { margin-top: 0; }
/* Thanh công cụ của hình đang chọn */
#drawBar { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 8; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); display: flex; align-items: center; gap: 2px; padding: 4px; max-width: calc(100% - 16px); overflow-x: auto; }
#drawBar button, #drawBar select { background: none; border: none; height: 30px; min-width: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--text); padding: 0 6px; }
#drawBar button:hover { background: var(--hover); } #drawBar button.on { color: var(--accent); background: var(--accent-soft); }
#drawBar .sw { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); }
#drawBar select { background: var(--panel2); font-size: 12px; }
#drawBar .dsep { width: 1px; height: 20px; background: var(--line); margin: 0 3px; }
#drawBar svg { width: 18px; height: 18px; }
.swatches { display: grid; grid-template-columns: repeat(8, 22px); gap: 6px; padding: 8px; }
.swatches button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; }
.swatches button.on { border-color: var(--text); }

#loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.12); z-index: 9; }
.spinner { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Thanh phát lại */
#replayBar { position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%); z-index: 8; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.3); display: flex; align-items: center; gap: 4px; padding: 6px 8px; }
#replayBar button { background: none; border: none; height: 32px; min-width: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 4px; color: var(--text); padding: 0 8px; }
#replayBar button:hover { background: var(--hover); }
#replayBar .rp-info { font-size: 12px; color: var(--muted); padding: 0 6px; white-space: nowrap; }
#replayBar select { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; height: 30px; }

/* Bảng dưới: kiểm tra chiến lược */
#bottomPanel { height: 210px; border-top: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; flex-shrink: 0; }
.bp-head { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.bp-head b { font-size: 13px; } .bp-head select { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
.bp-tabs button { background: none; border: none; padding: 4px 10px; border-radius: 6px; color: var(--muted); } .bp-tabs button.active { color: var(--text); background: var(--panel2); }
.bp-body { flex: 1; overflow: auto; padding: 8px 10px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.kpi { background: var(--panel2); border-radius: 8px; padding: 8px 10px; } .kpi small { color: var(--muted); display: block; font-size: 11px; } .kpi b { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
table.tt { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
table.tt th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 6px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
table.tt td { padding: 4px 6px; border-bottom: 1px solid var(--line); }

/* ---------------- Thanh bên phải ---------------- */
#side { width: var(--side-w); background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; flex-shrink: 0; }
#side.closed { display: none; }
.side-tabs { display: flex; border-bottom: 1px solid var(--line); padding: 4px; gap: 2px; }
.st { flex: 1; height: 34px; border: none; background: none; border-radius: 6px; color: var(--muted); display: flex; align-items: center; justify-content: center; position: relative; }
.st.active { color: var(--accent); background: var(--accent-soft); } .st:hover { background: var(--hover); }
.badge { position: absolute; top: 3px; right: 10px; background: var(--down); color: #fff; border-radius: 8px; font-size: 9px; padding: 0 5px; line-height: 14px; }
.side-body { flex: 1; overflow-y: auto; }
.sec-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 6px; font-weight: 600; font-size: 13px; color: var(--muted); }
.sec-head button { background: none; border: none; color: var(--muted); padding: 2px; border-radius: 4px; display: flex; } .sec-head button:hover { color: var(--text); background: var(--hover); }
.sec-head svg { width: 18px; height: 18px; }
.wl-sec { padding: 14px 14px 4px; font-weight: 600; color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
.wl-row { display: flex; align-items: center; gap: 10px; padding: 8px 14px; cursor: pointer; border-bottom: 1px solid var(--line); position: relative; }
.wl-row:hover { background: var(--hover); } .wl-row.cur { background: var(--accent-soft); }
.wl-ico { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0; letter-spacing: -.3px; }
.wl-nm { flex: 1; min-width: 0; } .wl-nm b { display: block; font-size: 14px; font-weight: 600; } .wl-nm small { color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
.wl-px { text-align: right; font-variant-numeric: tabular-nums; } .wl-px b { display: block; font-weight: 600; font-size: 14px; } .wl-px small { font-size: 12px; }
.wl-row .del { position: absolute; right: 4px; top: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 50%; width: 20px; height: 20px; display: none; align-items: center; justify-content: center; color: var(--muted); padding: 0; }
.wl-row .del svg { width: 12px; height: 12px; } .wl-row:hover .del { display: flex; }
.flash-up { animation: fu .9s; } .flash-down { animation: fd .9s; }
@keyframes fu { from { background: rgba(20,209,160,.25); } } @keyframes fd { from { background: rgba(240,89,107,.25); } }
.empty { color: var(--muted); padding: 24px 14px; text-align: center; font-size: 13px; }
.row-btns { display: flex; gap: 6px; padding: 8px 14px; flex-wrap: wrap; }
.al-row, .ot-row { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.al-row .info, .ot-row .info { flex: 1; min-width: 0; } .al-row small, .ot-row small { color: var(--muted); display: block; font-size: 11px; }
.al-row.off { opacity: .5; }
.mini { background: none; border: none; width: 28px; height: 28px; border-radius: 6px; color: var(--muted); display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0; }
.mini:hover { background: var(--hover); color: var(--text); } .mini svg { width: 17px; height: 17px; }
.ot-ico { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; color: var(--muted); } .ot-ico svg { width: 22px; height: 22px; }
.log-row { padding: 6px 14px; font-size: 12px; border-bottom: 1px solid var(--line); } .log-row small { color: var(--muted); }
.note { color: var(--muted); font-size: 12px; margin: 6px 0 10px; line-height: 1.5; }
.side-body .note { padding: 0 14px; }

/* Đồng hồ đánh giá kỹ thuật */
.gauge-box { padding: 10px 14px; text-align: center; }
.gauge-box h4 { margin: 8px 0 0; font-size: 13px; color: var(--muted); font-weight: 500; }
.gauge-box .lbl { font-size: 18px; font-weight: 700; margin-top: -4px; }
.gauge-cnt { display: flex; justify-content: center; gap: 14px; font-size: 12px; color: var(--muted); margin: 4px 0 8px; } .gauge-cnt b { display: block; font-size: 15px; color: var(--text); }
.gauges-sm { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); margin: 10px 14px; border-radius: 8px; overflow: hidden; }
.info-grid div { background: var(--panel); padding: 8px 10px; } .info-grid small { color: var(--muted); display: block; font-size: 11px; } .info-grid b { font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------------- Thanh trạng thái & điều hướng dưới ---------------- */
#status { display: flex; align-items: center; gap: 8px; padding: 3px 10px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); background: var(--panel); flex-shrink: 0; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.dot.live { background: var(--up); box-shadow: 0 0 6px var(--up); } .dot.warn { background: #ff9800; } .dot.err { background: var(--down); } .dot.load { background: var(--accent); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .3; } }
#bottomNav { display: none; }

/* ---------------- Bảng trượt / hộp thoại ---------------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.sheet { background: var(--panel); color: var(--text); border-radius: 14px; width: 520px; max-width: 100%; max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.4); border: 1px solid var(--line); animation: pop .18s ease-out; }
.sheet.wide { width: 760px; } .sheet.small { width: 380px; }
@keyframes pop { from { transform: translateY(10px) scale(.98); opacity: 0; } }
.sh-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; }
.sh-head h3 { margin: 0; font-size: 17px; font-weight: 700; flex: 1; text-align: left; }
.sh-head .circ { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: flex; align-items: center; justify-content: center; color: var(--text); }
.sh-head .circ:hover { background: var(--hover); }
.sh-grab { display: none; }
.sh-body { padding: 4px 16px 16px; overflow-y: auto; flex: 1; min-height: 0; }
.sh-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
.search { display: flex; align-items: center; gap: 8px; background: var(--panel2); border-radius: 12px; padding: 0 12px; height: 42px; margin-bottom: 10px; border: 1px solid transparent; }
.search:focus-within { border-color: var(--accent); }
.search input { border: none; background: none; outline: none; flex: 1; height: 100%; font-size: 15px; }
.search svg { color: var(--muted); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 6px; scrollbar-width: none; flex-wrap: nowrap; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { background: var(--panel2); border: none; border-radius: 18px; padding: 7px 14px; white-space: nowrap; font-weight: 500; color: var(--text); flex-shrink: 0; }
.chip.active { background: var(--text); color: var(--panel); }
.chip:hover:not(.active) { background: var(--hover); } .chip small { color: var(--muted); font-weight: 400; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--panel2); border: 1px solid transparent; border-radius: 14px; padding: 14px 6px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; font-size: 12.5px; color: var(--text); position: relative; min-height: 92px; }
.tile:hover { background: var(--hover); } .tile.active, .tile.on { border-color: var(--accent); color: var(--accent); }
.tile svg { width: 30px; height: 30px; } .tile .ico { width: 26px; height: 26px; }
.tile .fav { position: absolute; top: 6px; right: 6px; background: none; border: none; color: var(--muted); padding: 2px; display: none; }
.tile .fav svg { width: 15px; height: 15px; } .tile:hover .fav, .tile .fav.on { display: block; } .tile .fav.on { color: #f5a623; } .tile .fav.on svg { fill: #f5a623; }
.tile.dis { opacity: .45; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hub-sec { font-size: 13px; font-weight: 700; color: var(--muted); margin: 16px 2px 8px; letter-spacing: .3px; }
.big-tile { border: 1px solid var(--line); background: var(--panel); }
.ilist { margin: 0 -16px; }
.irow { display: flex; align-items: center; gap: 10px; padding: 11px 16px; cursor: pointer; font-size: 14.5px; }
.irow:hover { background: var(--hover); }
.irow .star { background: none; border: none; color: var(--muted); padding: 0; display: flex; } .irow .star.on { color: #f5a623; } .irow .star.on svg { fill: #f5a623; }
.irow .nm { flex: 1; min-width: 0; } .irow .nm small { display: block; color: var(--muted); font-size: 12px; }
.irow .q { background: none; border: none; color: var(--muted); padding: 0; display: flex; opacity: .7; }
.irow.dis .nm { opacity: .5; }
.tag { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: var(--panel2); color: var(--muted); margin-left: 6px; letter-spacing: .4px; }
.tag.new { background: rgba(255,152,0,.15); color: #ff9800; }
.isec { padding: 14px 16px 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .6px; text-transform: uppercase; }
label.f { display: block; color: var(--muted); font-size: 12px; margin: 12px 0 4px; }
.inp, .sh-body select, .sh-body input[type=number], .sh-body input[type=text], .sh-body textarea { width: 100%; padding: 9px 11px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; outline: none; color: var(--text); }
.inp:focus, .sh-body select:focus, .sh-body input:focus, .sh-body textarea:focus { border-color: var(--accent); }
.row { display: flex; gap: 8px; align-items: center; } .row > * { flex: 1; }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font-weight: 500; color: var(--text); white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn.danger { color: var(--down); border-color: rgba(240,89,107,.4); }
.chk { display: flex; align-items: center; gap: 10px; margin: 10px 0; cursor: pointer; } .chk input { accent-color: var(--accent); width: 17px; height: 17px; }
.tabs2 { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 -16px 10px; padding: 0 16px; }
.tabs2 button { background: none; border: none; padding: 8px 12px; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500; }
.tabs2 button.active { color: var(--text); border-bottom-color: var(--accent); }
.prow { display: grid; grid-template-columns: 1fr 120px; gap: 8px; align-items: center; margin: 8px 0; }
.prow > span { font-size: 13px; }
.srow { display: flex; align-items: center; gap: 8px; margin: 8px 0; } .srow .nm { flex: 1; }
.srow input[type=color] { width: 34px; height: 30px; border: none; background: none; padding: 0; cursor: pointer; }
.srow select { width: 70px !important; padding: 5px !important; }
.typelist .irow svg { width: 22px; height: 22px; }

/* Toast */
#toasts { position: fixed; right: 14px; bottom: 34px; display: flex; flex-direction: column; gap: 6px; z-index: 90; max-width: calc(100% - 28px); }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: 10px 14px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.25); transition: opacity .3s, transform .3s; max-width: 380px; }
.toast.err { border-left-color: var(--down); } .toast.ok { border-left-color: var(--up); } .toast.alert { border-left-color: #ff9800; font-weight: 600; }
.toast.out { opacity: 0; transform: translateX(20px); }

/* Bảng xổ của thanh vẽ (máy tính) */
#flyout { position: fixed; z-index: 70; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 36px rgba(0,0,0,.35); padding: 6px; max-height: 80vh; overflow-y: auto; min-width: 260px; }
.fo-h { font-size: 11px; font-weight: 700; color: var(--muted); padding: 8px 10px 4px; text-transform: uppercase; letter-spacing: .5px; }
.fo-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
.fo-row:hover { background: var(--hover); } .fo-row.active { color: var(--accent); background: var(--accent-soft); }
.fo-row svg { width: 26px; height: 26px; } .fo-row .nm { flex: 1; }
.fo-row .fav { background: none; border: none; color: var(--muted); visibility: hidden; padding: 0; display: flex; } .fo-row:hover .fav, .fo-row .fav.on { visibility: visible; } .fo-row .fav.on { color: #f5a623; } .fo-row .fav.on svg { fill: #f5a623; } .fo-row .fav svg { width: 15px; height: 15px; }
.emo-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; padding: 4px; } .emo-grid button { background: none; border: none; font-size: 22px; padding: 6px; border-radius: 8px; } .emo-grid button:hover { background: var(--hover); }

/* ---------------- Điện thoại ---------------- */
.mob { display: none !important; }
@media (max-width: 860px) {
  :root { --top-h: 50px; }
  .desk, .desk-flex { display: none !important; } .mob { display: inline-flex !important; }
  #top { gap: 2px; } .sep { margin: 0 2px; } .sym-btn { font-size: 14px; padding: 0 6px; } .src-tag { display: none; }
  #btnTfM { font-weight: 700; color: var(--accent); min-width: 40px; }
  .brand-name { display: none; } .tb .lbl { display: none; }
  #tools { display: none; }
  #side { position: absolute; inset: 0; width: 100%; border: none; z-index: 20; }
  #side .side-tabs { display: none; }
  #status { display: none; }
  #bottomNav { display: flex; background: var(--panel); border-top: 1px solid var(--line); padding: 4px 6px calc(4px + env(safe-area-inset-bottom)); flex-shrink: 0; }
  #bottomNav button { flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); padding: 5px 0; border-radius: 12px; }
  #bottomNav button.active { color: var(--text); background: var(--panel2); font-weight: 600; }
  #bottomNav .ico { width: 22px; height: 22px; }
  .sheet-bg { align-items: flex-end; padding: 0; }
  .sheet, .sheet.wide, .sheet.small { width: 100%; max-height: 92vh; border-radius: 22px 22px 0 0; animation: up .22s ease-out; padding-bottom: env(safe-area-inset-bottom); }
  @keyframes up { from { transform: translateY(40px); opacity: .5; } }
  .sh-grab { display: block; width: 44px; height: 5px; background: var(--line); border-radius: 3px; margin: 8px auto 0; }
  .sh-head h3 { text-align: center; } .sh-head .sp { width: 36px; }
  #legend { max-width: calc(100% - 70px); }
  .lg-row .acts { display: flex; } .lg-row { background: var(--panel); border-color: var(--line); }
  #drawBar { top: auto; bottom: 10px; }
  #toasts { top: calc(56px + env(safe-area-inset-top)); bottom: auto; left: 12px; right: 12px; }
  #bottomPanel { height: 45%; }
  #watermark { font-size: 40px; }
  .grid3 { gap: 8px; } .tile { min-height: 86px; font-size: 12px; }
}

</style>
</head>
<body>
<div id="app">
  <!-- ================= THANH TRÊN ================= -->
  <header id="top">
    <a class="brand" id="brand" title="GreenView"><span class="logo"></span><span class="brand-name">Green<b>View</b></span></a>
    <button class="sym-btn" id="btnSymbol" title="Tìm mã"><span class="sym-ico" id="symIco"></span><span id="symName">—</span><span class="src-tag" id="symSrc"></span></button>
    <button class="ib desk" id="btnCompare" title="So sánh / thêm mã" data-i="plus"></button>
    <span class="sep"></span>
    <div id="tfBar" class="tfbar desk-flex"></div>
    <button class="tb mob" id="btnTfM" title="Khung thời gian"></button>
    <button class="ib" id="btnType" title="Loại biểu đồ" data-i="candle"></button>
    <span class="sep"></span>
    <button class="tb" id="btnInd" title="Chỉ báo, chỉ số và chiến lược"><i data-i="fx"></i><span class="lbl">Chỉ báo</span></button>
    <button class="ib desk" id="btnTpl" title="Mẫu chỉ báo" data-i="grid"></button>
    <span class="sep desk"></span>
    <button class="tb desk" id="btnAlert" title="Tạo cảnh báo"><i data-i="alarm"></i><span class="lbl">Cảnh báo</span></button>
    <button class="tb desk" id="btnReplay" title="Chế độ phát lại thanh"><i data-i="replay"></i><span class="lbl">Phát lại</span></button>
    <span class="grow"></span>
    <button class="ib mob" id="btnDrawM" title="Bản vẽ" data-i="pen"></button>
    <button class="ib" id="btnTheme" title="Đổi giao diện sáng/tối" data-i="moon"></button>
    <button class="ib desk" id="btnShot" title="Chụp ảnh biểu đồ" data-i="camera"></button>
    <button class="ib desk" id="btnSettings" title="Cài đặt biểu đồ" data-i="gear"></button>
    <button class="ib" id="btnHub" title="Trung tâm phân tích" data-i="dots"></button>
  </header>

  <div id="banner" class="banner hidden"></div>

  <main id="main">
    <!-- ================= THANH VẼ BÊN TRÁI ================= -->
    <nav id="tools"></nav>

    <!-- ================= KHU BIỂU ĐỒ ================= -->
    <section id="center">
      <div id="chartWrap">
        <div id="chart"></div>
        <div id="legend"></div>
        <div id="paneLegends"></div>
        <div id="watermark"></div>
        <div id="drawBar" class="hidden"></div>
        <div id="loading" class="hidden"><div class="spinner"></div></div>
        <div id="replayBar" class="hidden"></div>
      </div>
      <div id="bottomPanel" class="hidden"></div>
    </section>

    <!-- ================= THANH BÊN PHẢI ================= -->
    <aside id="side">
      <div class="side-tabs">
        <button class="st active" data-tab="wl" title="Danh sách theo dõi" data-i="list"></button>
        <button class="st" data-tab="al" title="Cảnh báo" data-i="alarm"><span id="alBadge" class="badge hidden"></span></button>
        <button class="st" data-tab="ot" title="Cây đối tượng" data-i="layers"></button>
        <button class="st" data-tab="tr" title="Chỉ số kỹ thuật" data-i="gauge"></button>
        <button class="st" data-tab="in" title="Thông tin mã" data-i="info"></button>
      </div>
      <div class="side-body" id="sideBody"></div>
    </aside>
  </main>

  <!-- Thanh điều hướng dưới (điện thoại) -->
  <nav id="bottomNav">
    <button data-page="wl"><i data-i="list"></i><span>D.sách theo dõi</span></button>
    <button data-page="chart" class="active"><i data-i="chart"></i><span>Biểu đồ</span></button>
    <button data-page="al"><i data-i="alarm"></i><span>Cảnh báo</span></button>
    <button data-page="menu"><i data-i="menu"></i><span>Menu</span></button>
  </nav>

  <footer id="status">
    <span id="stDot" class="dot"></span><span id="stText">Sẵn sàng</span>
    <span class="grow"></span>
    <span id="stInfo"></span>
    <span id="clock"></span>
  </footer>
</div>

<!-- Lớp hộp thoại / bảng trượt -->
<div id="sheets"></div>
<div id="toasts"></div>
<div id="flyout" class="hidden"></div>

<script>
/* --- js/util.js --- */
/* =========================================================
 * util.js — Các hàm tiện ích dùng chung
 * Mọi module gắn vào đối tượng toàn cục window.App
 * ========================================================= */
window.App = window.App || {};

(function (App) {
  'use strict';

  // Độ lệch múi giờ của máy (giây). Thư viện biểu đồ hiển thị theo UTC,
  // nên ta cộng thêm độ lệch này để trục thời gian hiện đúng giờ địa phương.
  App.TZ = -new Date().getTimezoneOffset() * 60;

  /* ---------- Lưu trữ trong trình duyệt (localStorage) ---------- */
  App.store = {
    get(key, def) {
      try {
        const v = localStorage.getItem('gv:' + key);
        return v == null ? def : JSON.parse(v);
      } catch (e) { return def; }
    },
    set(key, val) {
      try { localStorage.setItem('gv:' + key, JSON.stringify(val)); } catch (e) { /* bộ nhớ đầy hoặc bị chặn */ }
    },
    del(key) { try { localStorage.removeItem('gv:' + key); } catch (e) {} }
  };

  /* ---------- Gọi API trả về JSON, có thời gian chờ ---------- */
  App.fetchJSON = async function (url, opts = {}) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), opts.timeout || 12000);
    try {
      const res = await fetch(url, { signal: ctrl.signal, headers: opts.headers });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  };

  // Gắn proxy CORS (nếu cô cấu hình trong Cài đặt) vào trước URL
  App.withProxy = function (url) {
    const p = (App.settings && App.settings.proxy || '').trim();
    if (!p) return url;
    return p.includes('{url}') ? p.replace('{url}', encodeURIComponent(url)) : p + encodeURIComponent(url);
  };

  /* ---------- Định dạng số ---------- */
  App.fmtPrice = function (v) {
    if (v == null || isNaN(v)) return '–';
    const a = Math.abs(v);
    let d = a >= 1000 ? 2 : a >= 1 ? 2 : a >= 0.01 ? 4 : 8;
    if (a >= 100000) d = 0;
    return v.toLocaleString('vi-VN', { minimumFractionDigits: d, maximumFractionDigits: d });
  };
  App.fmtVol = function (v) {
    if (v == null || isNaN(v)) return '–';
    const a = Math.abs(v);
    if (a >= 1e9) return (v / 1e9).toFixed(2) + ' tỷ';
    if (a >= 1e6) return (v / 1e6).toFixed(2) + ' tr';
    if (a >= 1e3) return (v / 1e3).toFixed(1) + ' N';
    return v.toFixed(a < 10 ? 3 : 0);
  };
  App.fmtPct = function (v) {
    if (v == null || isNaN(v)) return '–';
    return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
  };
  App.fmtTime = function (sec, withTime = true) {
    // sec là "giờ hiển thị" (đã cộng múi giờ) nên đọc theo UTC
    const d = new Date(sec * 1000);
    const p = n => String(n).padStart(2, '0');
    const s = p(d.getUTCDate()) + '/' + p(d.getUTCMonth() + 1) + '/' + d.getUTCFullYear();
    return withTime ? s + ' ' + p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) : s;
  };

  // Độ dài khoảng thời gian dạng chữ (VD: 3 ngày 4 giờ)
  App.fmtSpan = function (sec) {
    sec = Math.abs(sec);
    if (sec >= 86400 * 2) return Math.round(sec / 86400) + ' ngày';
    if (sec >= 3600) return Math.floor(sec / 3600) + ' giờ' + (sec % 3600 >= 60 ? ' ' + Math.round((sec % 3600) / 60) + ' phút' : '');
    return Math.round(sec / 60) + ' phút';
  };

  /* ---------- Thông báo nổi (toast) ---------- */
  App.toast = function (msg, type = 'info', ms = 4000) {
    const box = document.getElementById('toasts');
    if (!box) return;
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    box.appendChild(el);
    while (box.children.length > 3) box.firstChild.remove();
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, ms);
  };

  /* ---------- Tiếng "bíp" khi có cảnh báo ---------- */
  let audioCtx = null;
  App.beep = function () {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.25].forEach(t => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 880; o.type = 'sine';
        g.gain.setValueAtTime(0.2, audioCtx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.2);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.22);
      });
    } catch (e) {}
  };

  /* ---------- Hộp thoại (modal) tự làm, không dùng alert/prompt ---------- */
  App.openModal = function (id) { document.getElementById(id).classList.add('show'); };
  App.closeModal = function (id) { document.getElementById(id).classList.remove('show'); };

  App.$ = sel => document.querySelector(sel);
  App.$$ = sel => Array.from(document.querySelectorAll(sel));
  App.esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Bộ sinh số ngẫu nhiên có "hạt giống" — để dữ liệu giả lập ổn định theo mã
  App.seededRandom = function (seedStr) {
    let h = 2166136261;
    for (const ch of seedStr) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
    return function () {
      h += 0x6D2B79F5;
      let t = h;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
})(window.App);

</script>

    layout: 'M4 4h16v16H4zM4 10h16M10 10v10', play: 'M7 4l13 8L7 20z', pause: 'M7 4h4v16H7zM14 4h4v16h-4z', step: 'M5 4l10 8l-10 8zM17 4h2v16h-2z', stop: 'M6 6h12v12H6z', target: 'M12 21a9 9 0 1 0 0-18a9 9 0 1 0 0 18zM12 16a4 4 0 1 0 0-8a4 4 0 1 0 0 8z',

    help: 'M12 21a9 9 0 1 0 0-18a9 9 0 1 0 0 18zM9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17v.01', check: 'M5 12l5 5l9-10', edit: 'M4 20h4l11-11l-4-4L4 16zM13 7l4 4', text: 'M6 5h12M12 5v14M9 19h6',
    extL: 'M20 12H4M8 8l-4 4l4 4', extR: 'M4 12h16M16 8l4 4l-4 4', ruler: 'M4 16L16 4l4 4L8 20zM8 12l2 2M11 9l2 2M14 6l2 2'
  };

})(window.App);

</script>
<script>
/* --- js/sources.js --- */
/* =========================================================
 * sources.js — Các nguồn dữ liệu giá
 *
 * Mỗi nguồn có cùng "giao diện":
 *   label            : tên hiển thị
 *   tfs              : các khung thời gian hỗ trợ
 *   fetchBars(sym, tf, beforeTime?) -> Promise<[{time,open,high,low,close,volume}]>
 *   live(sym, tf, onBar)            -> hàm dừng (cập nhật nến realtime)
 *   quotes([sym])                   -> Promise<{sym:{price, chg}}> (cho danh sách theo dõi)
 *
 * "time" là số giây ĐÃ CỘNG múi giờ địa phương (xem App.TZ trong util.js).
 * ========================================================= */
(function (App) {
  'use strict';

  // Khung thời gian chung: mã -> số giây
  App.TF = { '1m': 60, '3m': 180, '5m': 300, '15m': 900, '30m': 1800, '1h': 3600, '2h': 7200, '4h': 14400, '6h': 21600, '12h': 43200, '1D': 86400, '3D': 259200, '1W': 604800, '1M': 2592000 };
  App.TF_LABEL = { '1m': '1p', '3m': '3p', '5m': '5p', '15m': '15p', '30m': '30p', '1h': '1g', '2h': '2g', '4h': '4g', '6h': '6g', '12h': '12g', '1D': '1N', '3D': '3N', '1W': '1T', '1M': '1Th' };
  App.TF_NAME = { '1m': '1 phút', '3m': '3 phút', '5m': '5 phút', '15m': '15 phút', '30m': '30 phút', '1h': '1 giờ', '2h': '2 giờ', '4h': '4 giờ', '6h': '6 giờ', '12h': '12 giờ', '1D': '1 ngày', '3D': '3 ngày', '1W': '1 tuần', '1M': '1 tháng' };

  const now = () => Math.floor(Date.now() / 1000);

  /* =======================================================
   * 1) BINANCE — tiền mã hoá, miễn phí, không cần key
   * ======================================================= */
  const BN_REST = ['https://api.binance.com', 'https://data-api.binance.vision'];
  const BN_WS = ['wss://stream.binance.com:9443/ws/', 'wss://data-stream.binance.vision/ws/'];
  const BN_TF = { '1m': '1m', '3m': '3m', '5m': '5m', '15m': '15m', '30m': '30m', '1h': '1h', '2h': '2h', '4h': '4h', '6h': '6h', '12h': '12h', '1D': '1d', '3D': '3d', '1W': '1w', '1M': '1M' };
  let bnBase = 0; // máy chủ đang dùng được

  async function bnGet(path) {
    let lastErr;
    for (let i = 0; i < BN_REST.length; i++) {
      const idx = (bnBase + i) % BN_REST.length;
      try {
        const j = await App.fetchJSON(BN_REST[idx] + path);
        bnBase = idx;
        return j;
      } catch (e) { lastErr = e; }
    }
    throw lastErr;
  }

  const binance = {
    label: 'Binance (Crypto)',
    short: 'Binance',
    tfs: Object.keys(BN_TF),
    canLoadMore: true,
    hint: 'VD: BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT',
    normalize: s => s.toUpperCase().replace(/[^A-Z0-9]/g, ''),

    async fetchBars(sym, tf, beforeTime) {
      let q = `/api/v3/klines?symbol=${sym}&interval=${BN_TF[tf]}&limit=1000`;
      if (beforeTime) q += `&endTime=${(beforeTime - App.TZ) * 1000 - 1}`;
      const rows = await bnGet(q);
      if (!Array.isArray(rows)) throw new Error('Mã không hợp lệ');
      return rows.map(r => ({
        time: r[0] / 1000 + App.TZ,
        open: +r[1], high: +r[2], low: +r[3], close: +r[4], volume: +r[5]
      }));
    },

    live(sym, tf, onBar) {
      let ws, stopped = false, tries = 0, wsIdx = 0;
      const open = () => {
        if (stopped) return;
        ws = new WebSocket(BN_WS[wsIdx % BN_WS.length] + sym.toLowerCase() + '@kline_' + BN_TF[tf]);
        ws.onopen = () => { tries = 0; App.setStatus('live', 'Realtime (WebSocket)'); };
        ws.onmessage = ev => {
          const k = JSON.parse(ev.data).k;
          if (!k) return;
          onBar({ time: k.t / 1000 + App.TZ, open: +k.o, high: +k.h, low: +k.l, close: +k.c, volume: +k.v });
        };
        ws.onclose = () => {
          if (stopped) return;
          App.setStatus('warn', 'Mất kết nối, đang nối lại…');
          tries++; wsIdx++;
          setTimeout(open, Math.min(30000, 1000 * 2 ** tries));
        };
        ws.onerror = () => { try { ws.close(); } catch (e) {} };
      };
      open();
      return () => { stopped = true; try { ws && ws.close(); } catch (e) {} };
    },

    async quotes(syms) {
      if (!syms.length) return {};
      const rows = await bnGet('/api/v3/ticker/24hr?symbols=' + encodeURIComponent(JSON.stringify(syms)));
      const out = {};
      rows.forEach(r => { out[r.symbol] = { price: +r.lastPrice, chg: +r.priceChangePercent }; });
      return out;
    }
  };

  /* =======================================================
   * 2) CỔ PHIẾU VIỆT NAM — API công khai VNDirect, dự phòng TCBS
   *    (không chính thức; giá tính theo NGHÌN ĐỒNG)
   * ======================================================= */
  const VND_TF = { '1m': '1', '5m': '5', '15m': '15', '30m': '30', '1h': '60', '1D': 'D', '1W': 'W' };
  // Khung VN không có sẵn -> gộp từ khung nhỏ hơn
  const VN_AGG = { '3m': '1m', '2h': '1h', '4h': '1h', '1M': '1D' };

  async function vnTry(urls) {
    // Thử lần lượt: gọi thẳng, rồi qua proxy (nếu có cấu hình)
    let lastErr;
    const list = [...urls];
    if (App.settings.proxy) urls.forEach(u => list.push(App.withProxy(u)));
    for (const u of list) {
      try { return await App.fetchJSON(u); } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error('Không lấy được dữ liệu');
  }

  async function vnDirect(sym, tf, from, to) {
    const url = `https://dchart-api.vndirect.com.vn/dchart/history?resolution=${VND_TF[tf]}&symbol=${sym}&from=${from}&to=${to}`;
    const j = await vnTry([url]);
    if (!j || !j.t || !j.t.length) throw new Error('Không có dữ liệu cho mã ' + sym);
    return j.t.map((t, i) => ({
      time: t + App.TZ, open: +j.o[i], high: +j.h[i], low: +j.l[i], close: +j.c[i], volume: +j.v[i]
    }));
  }

  async function vnTcbs(sym, count) {
    const isIndex = /INDEX|^VN30$|^HNX/.test(sym);
    const url = `https://apipubaws.tcbs.com.vn/stock-insight/v1/stock/bars-long-term?ticker=${sym}&type=${isIndex ? 'index' : 'stock'}&resolution=D&to=${now()}&countBack=${count}`;
    const j = await vnTry([url]);
    if (!j || !j.data || !j.data.length) throw new Error('Không có dữ liệu cho mã ' + sym);
    const k = isIndex ? 1 : 1000; // TCBS trả giá cổ phiếu theo đồng -> đổi sang nghìn đồng
    return j.data.map(d => ({
      time: Math.floor(Date.parse(d.tradingDate) / 1000),
      open: d.open / k, high: d.high / k, low: d.low / k, close: d.close / k, volume: +d.volume
    }));
  }

  // Nến trong phiên từ API công khai của TCBS (dự phòng cho VNDirect)
  async function vnTcbsIntraday(sym, tf, to) {
    const res = { '1m': 1, '5m': 5, '15m': 15, '30m': 30, '1h': 60 }[tf];
    const isIndex = App.isIndex(sym);
    const url = `https://apipubaws.tcbs.com.vn/stock-insight/v2/stock/bars?ticker=${sym}&type=${isIndex ? 'index' : 'stock'}&resolution=${res}&to=${Math.floor(to)}&countBack=600`;
    const j = await vnTry([url]);
    if (!j || !j.data || !j.data.length) throw new Error('Không có dữ liệu trong phiên cho ' + sym);
    const k = isIndex ? 1 : 1000;
    return j.data.map(d => ({ time: Math.floor(Date.parse(d.tradingDate) / 1000) + (/Z$/.test(d.tradingDate) ? App.TZ : 0), open: d.open / k, high: d.high / k, low: d.low / k, close: d.close / k, volume: +d.volume })).sort((a, b) => a.time - b.time);
  }

  const vn = {
    label: 'Cổ phiếu Việt Nam',
    short: 'VN',
    tfs: ['1m', '3m', '5m', '15m', '30m', '1h', '2h', '4h', '1D', '1W', '1M'],
    canLoadMore: true,
    hint: 'VD: VNM, FPT, HPG, VCB, VNINDEX, VN30 — giá theo nghìn đồng',
    normalize: s => s.toUpperCase().replace(/[^A-Z0-9]/g, ''),

    async fetchBars(sym, tf, beforeTime) {
      try { return await vn._fetch(sym, tf, beforeTime); }
      catch (e) {
        // Không gọi được API công khai -> dùng connector TCBS (nếu đang mở trong Claude)
        if (App.mcp && tcbs.tfs.includes(tf)) return (await tcbs.fetchBars(sym, tf, beforeTime)).map(b => App.isIndex(sym) ? b : { ...b, open: b.open / 1000, high: b.high / 1000, low: b.low / 1000, close: b.close / 1000 });
        throw e;
      }
    },
    async _fetch(sym, tf, beforeTime) {
      if (VN_AGG[tf]) {
        const base = await vn._fetch(sym, VN_AGG[tf], beforeTime);
        return tf === '1M' ? App.aggregateMonth(base) : App.aggregate(base, App.TF[tf]);
      }
      const tfs = App.TF[tf];
      const intraday = tfs < 86400;
      const to = beforeTime ? beforeTime - App.TZ - 1 : now();
      // Lấy khoảng thời gian đủ ~600 nến (tính cả ngày nghỉ, giờ không giao dịch)
      const span = intraday ? tfs * 600 * 5 : tfs * 600 * 1.5;
      try {
        return await vnDirect(sym, tf, Math.floor(to - span), to);
      } catch (e) {
        if (intraday) return await vnTcbsIntraday(sym, tf, to);
        if (!beforeTime && (tf === '1D' || tf === '1W')) {
          const d = await vnTcbs(sym, 600);
          return tf === '1W' ? App.aggregate(d, 604800) : d;
        }
        throw e;
      }
    },

    live(sym, tf, onBar) {
      // VN không có WebSocket công khai -> hỏi lại mỗi 20 giây
      let stopped = false;
      const tick = async () => {
        if (stopped) return;
        try {
          const t = now();
          const bars = VN_AGG[tf] ? (await vn._fetch(sym, tf)).slice(-2) : await vnDirect(sym, tf, t - App.TF[tf] * 3 - 86400 * 4, t);
          bars.slice(-2).forEach(onBar);
          App.setStatus('live', 'Cập nhật mỗi 20 giây');
        } catch (e) {
          if (App.mcp && tcbs.tfs.includes(tf)) {
            try { (await tcbs.liveBars(sym, tf)).forEach(b => onBar(App.isIndex(sym) ? b : { ...b, open: b.open / 1000, high: b.high / 1000, low: b.low / 1000, close: b.close / 1000 })); App.setStatus('live', 'Qua TCBS (connector)'); return; } catch (e2) {}
          }
          App.setStatus('warn', 'Không cập nhật được giá VN');
        }
      };
      const id = setInterval(tick, App.mcp ? 30000 : 20000);
      return () => { stopped = true; clearInterval(id); };
    },

    async quotes(syms) {
      const out = {};
      await Promise.all(syms.map(async s => {
        try {
          let d;
          try { d = await vnDirect(s, '1D', now() - 86400 * 15, now()); }
          catch (e) { try { d = await vnTcbs(s, 5); } catch (e2) { if (!App.mcp) throw e2; d = (await tcbs.fetchBars(s, '1D', null, 3)).map(b => App.isIndex(s) ? b : { ...b, close: b.close / 1000 }); } }
          const a = d[d.length - 1], b = d[d.length - 2] || a;
          out[s] = { price: a.close, chg: (a.close / b.close - 1) * 100 };
        } catch (e) { /* bỏ qua mã lỗi */ }
      }));
      return out;
    }
  };

  /* =======================================================
   * 3) TWELVE DATA — Cổ phiếu Mỹ, Forex, Vàng (cần API key miễn phí)
   * ======================================================= */
  const TD_TF = { '1m': '1min', '5m': '5min', '15m': '15min', '30m': '30min', '1h': '1h', '2h': '2h', '4h': '4h', '1D': '1day', '1W': '1week', '1M': '1month' };
  const tdTZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { return 'UTC'; } })();

  function tdKey() {
    const k = (App.settings.tdKey || '').trim();
    if (!k) throw new Error('Cần API key Twelve Data — vào ⚙ Cài đặt để nhập');
    return k;
  }
  function tdParse(dt) {
    // "2024-01-02" hoặc "2024-01-02 09:30:00" (đã theo giờ máy) -> đọc như UTC
    return Math.floor(Date.parse(dt.replace(' ', 'T') + (dt.length <= 10 ? 'T00:00:00Z' : 'Z')) / 1000);
  }
  async function tdSeries(sym, tf, size, endDate) {
    let url = `https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(sym)}&interval=${TD_TF[tf]}&outputsize=${size}&timezone=${encodeURIComponent(tdTZ)}&apikey=${tdKey()}`;
    if (endDate) url += '&end_date=' + encodeURIComponent(endDate);
    const j = await App.fetchJSON(url);
    if (j.status === 'error') throw new Error('Twelve Data: ' + j.message);
    return (j.values || []).map(v => ({
      time: tdParse(v.datetime),
      open: +v.open, high: +v.high, low: +v.low, close: +v.close, volume: v.volume ? +v.volume : 0
    })).reverse();
  }

  const td = {
    label: 'Mỹ / Forex / Vàng (Twelve Data)',
    short: 'TwelveData',
    tfs: Object.keys(TD_TF),
    canLoadMore: true,
    hint: 'VD: AAPL, TSLA, EUR/USD, USD/JPY, XAU/USD (vàng), BTC/USD',
    normalize: s => s.toUpperCase().replace(/\s/g, ''),

    async fetchBars(sym, tf, beforeTime) {
      let end;
      if (beforeTime) {
        const d = new Date((beforeTime - 1) * 1000);
        end = d.toISOString().slice(0, 19).replace('T', ' ');
      }
      return tdSeries(sym, tf, 1000, end);
    },

    live(sym, tf, onBar) {
      // Gói miễn phí giới hạn 8 lần gọi/phút -> hỏi lại mỗi 60 giây
      const tick = async () => {
        try {
          (await tdSeries(sym, tf, 2)).forEach(onBar);
          App.setStatus('live', 'Cập nhật mỗi 60 giây');
        } catch (e) { App.setStatus('warn', e.message); }
      };
      const id = setInterval(tick, 60000);
      return () => clearInterval(id);
    },

    async quotes(syms) {
      if (!syms.length || !App.settings.tdKey) return {};
      const j = await App.fetchJSON(`https://api.twelvedata.com/quote?symbol=${encodeURIComponent(syms.join(','))}&apikey=${tdKey()}`);
      const out = {};
      const one = q => { if (q && q.symbol && q.close) out[q.symbol.toUpperCase()] = { price: +q.close, chg: +q.percent_change }; };
      if (j.symbol) one(j); else Object.values(j).forEach(one);
      return out;
    }
  };

  /* =======================================================
   * 3b) TCBS — qua connector TCBS của cô trên Claude
   *     (chỉ chạy khi mở GreenView trong Claude; giá theo ĐỒNG)
   * ======================================================= */
  App.isIndex = sym => /INDEX$|^VN30$|^HNX30$|^UPCOM$|^VN100$|^VNMID$|^VNSML$|^VNALL$/.test(sym);
  App.mcp = null;
  App.tcbsErr = function (e) {
    const m = { needs_reauth: 'Kết nối TCBS đã hết hạn — vào Cài đặt › Connectors trên claude.ai để kết nối lại',
      server_not_connected: 'Chưa kết nối TCBS — thêm trong Cài đặt › Connectors trên claude.ai',
      not_in_manifest: 'Cô chưa cho phép GreenView dùng TCBS', approval_required: 'Cần cô cho phép GreenView dùng TCBS',
      selection_required: 'Có nhiều connector tên TCBS — hãy chọn một', blocked_by_policy: 'TCBS bị chặn bởi chính sách tài khoản',
      server_unavailable: 'Máy chủ TCBS tạm thời không phản hồi', tool_error: 'TCBS báo lỗi: ' + (e && e.message) };
    return new Error(m[e && e.code] || (e && e.message) || 'Lỗi TCBS');
  };
  App.tcbs = async function (tool, input, fresh) {
    if (!App.mcp) throw new Error('TCBS chỉ dùng được khi mở GreenView trong Claude (đã kết nối connector TCBS)');
    try {
      const r = await App.mcp.callTool('Tcbs', 'tcinvest-' + tool, input, fresh ? { cache: false } : { cache: { staleTime: 60000, gcTime: 600000 } });
      return r.payload;
    } catch (e) {
      if (e && e.retryable) { await new Promise(r => setTimeout(r, Math.min(e.retryAfterMs || 1500, 8000) + Math.random() * 500)); try { return (await App.mcp.callTool('Tcbs', 'tcinvest-' + tool, input, { cache: false })).payload; } catch (e2) { throw App.tcbsErr(e2); } }
      throw App.tcbsErr(e);
    }
  };
  const TC_TF = { '1D': 'D', '1W': 'W', '1M': 'M' };
  const TC_INTRA = ['1m', '3m', '5m', '15m', '30m', '1h', '2h', '4h'];
  // Giờ giao dịch HOSE/HNX (giờ Việt Nam): 9:00–11:30, 13:00–15:00, thứ 2–6
  App.vnMarketOpen = function (t) {
    const d = new Date(((t || now()) + 7 * 3600) * 1000), m = d.getUTCHours() * 60 + d.getUTCMinutes(), wd = d.getUTCDay();
    return wd >= 1 && wd <= 5 && ((m >= 540 && m <= 690) || (m >= 780 && m <= 905));
  };
  /* Tự ghép nến trong phiên: mỗi lần hỏi TCBS lấy nến NGÀY hiện tại (giá khớp + KL cộng dồn),
     lưu lại thành "điểm giá" theo thời gian, rồi gộp thành nến 1p, 5p… */
  const tickKey = sym => 'tick:' + sym;
  const loadTicks = sym => App.store.get(tickKey(sym), []);
  function addTick(sym, day) {
    const t = now(), ticks = loadTicks(sym), last = ticks[ticks.length - 1];
    if (!App.vnMarketOpen(t)) return ticks;
    if (last && t <= last.t) return ticks;
    if (last && last.p === day.close && last.v === day.volume && t - last.t < 600) return ticks;
    ticks.push({ t, p: day.close, v: day.volume, d: day.time });
    const cut = t - 6 * 86400; while (ticks.length && (ticks[0].t < cut || ticks.length > 4000)) ticks.shift();
    App.store.set(tickKey(sym), ticks);
    return ticks;
  }
  function buildBars(ticks, tf) {
    const step = App.TF[tf], out = [];
    let prevV = null, prevD = null;
    ticks.slice().sort((a, b) => a.t - b.t).forEach(k => {
      const time = Math.floor((k.t + App.TZ) / step) * step;
      if (k.d !== prevD) { prevV = null; prevD = k.d; }
      const dv = prevV == null ? 0 : Math.max(0, k.v - prevV); prevV = k.v;
      const b = out[out.length - 1];
      if (b && b.time === time) { b.high = Math.max(b.high, k.p); b.low = Math.min(b.low, k.p); b.close = k.p; b.volume += dv; }
      else out.push({ time, open: b ? b.close : k.p, high: Math.max(k.p, b ? b.close : k.p), low: Math.min(k.p, b ? b.close : k.p), close: k.p, volume: dv });
    });
    return out;
  }
  async function dailyNow(sym) {
    const d = await tcbs.fetchBars(sym, '1D', null, 1, true);
    return d[d.length - 1];
  }
  const tcbs = {
    label: 'TCBS (connector)',
    short: 'TCBS',
    tfs: TC_INTRA.concat(['1D', '1W', '1M']),
    canLoadMore: true,
    hint: 'Cổ phiếu & chỉ số VN qua connector TCBS. VD: FPT, VCB, HPG, VNINDEX, VN30 — giá theo đồng. Khung nhỏ được tự ghép từ lúc mở trang, trong giờ giao dịch',
    normalize: s => s.toUpperCase().replace(/[^A-Z0-9]/g, ''),
    async fetchBars(sym, tf, beforeTime, count, fresh) {
      if (TC_INTRA.includes(tf)) {
        if (beforeTime) return [];
        let ticks = loadTicks(sym);
        try { ticks = addTick(sym, await dailyNow(sym)); } catch (e) { if (!ticks.length) throw e; }
        let bars = buildBars(ticks, tf);
        if (!bars.length) {
          // chưa có điểm nào (ngoài giờ giao dịch): hiện 1 nến từ giá đóng cửa gần nhất
          const d = await dailyNow(sym), step = App.TF[tf];
          bars = [{ time: Math.floor((now() + App.TZ) / step) * step, open: d.close, high: d.close, low: d.close, close: d.close, volume: 0 }];
          App.toast(App.vnMarketOpen() ? 'Đang bắt đầu ghép nến — cứ 30 giây có thêm điểm giá mới' : 'Ngoài giờ giao dịch (9:00–11:30, 13:00–15:00). Nến khung nhỏ chỉ được ghép trong giờ giao dịch, khi trang đang mở.', 'info', 7000);
        } else App.toast(`Nến ${App.TF_NAME[tf]} tự ghép từ ${ticks.length} điểm giá đã thu (TCBS không có sẵn nến trong phiên)`, 'info', 5000);
        return bars;
      }
      const day = 86400, to = beforeTime ? Math.floor((beforeTime - 1) / day) * day : Math.floor(now() / day) * day;
      const j = await App.tcbs('getLongTermCandleChart', { type: App.isIndex(sym) ? 'index' : 'stock', ticker: sym, resolution: TC_TF[tf] || 'D', to, countBack: count || 250 }, fresh);
      if (!j || !j.data || !j.data.length) throw new Error('TCBS không có dữ liệu cho ' + sym);
      const out = j.data.map(d => ({ time: Math.floor(Date.parse(d.tradingDate) / 1000), open: +d.open, high: +d.high, low: +d.low, close: +d.close, volume: +d.volume || 0 }));
      out.sort((a, b) => a.time - b.time);
      return out.filter((b, i) => !i || b.time !== out[i - 1].time);
    },
    // Lấy nến mới nhất (dùng cho cập nhật realtime)
    async liveBars(sym, tf) {
      if (TC_INTRA.includes(tf)) { const ticks = addTick(sym, await dailyNow(sym)), b = buildBars(ticks, tf); return b.slice(-2); }
      return tcbs.fetchBars(sym, tf, null, 2, true);
    },
    live(sym, tf, onBar) {
      const intra = TC_INTRA.includes(tf), ms = intra ? 30000 : 60000;
      const msg = intra ? 'TCBS · tự ghép nến, 30 giây/lần' + (App.vnMarketOpen() ? '' : ' (ngoài giờ giao dịch)') : 'TCBS · cập nhật mỗi 60 giây';
      const id = setInterval(async () => {
        try { (await tcbs.liveBars(sym, tf)).forEach(onBar); App.setStatus('live', msg); }
        catch (e) { App.setStatus('warn', e.message); }
      }, ms);
      App.setStatus('live', msg);
      return () => clearInterval(id);
    },
    async quotes(syms) {
      const out = {};
      await Promise.all(syms.map(async s => { try { const d = await tcbs.fetchBars(s, '1D', null, 3); const a = d[d.length - 1], b = d[d.length - 2] || a; out[s] = { price: a.close, chg: (a.close / b.close - 1) * 100 }; } catch (e) {} }));
      return out;
    }
  };

  /* =======================================================
   * 4) DỮ LIỆU GIẢ LẬP — chạy mọi nơi, không cần mạng
   * ======================================================= */
  const demoState = {}; // lưu chuỗi nến theo mã+khung

  function demoGen(sym, tf) {
    const key = sym + '|' + tf;
    if (demoState[key]) return demoState[key];
    const rnd = App.seededRandom(key);
    const step = App.TF[tf];
    const n = 800;
    const end = Math.floor((now() + App.TZ) / step) * step;
    let price = 50 + rnd() * 950;
    const vol = 0.004 * Math.sqrt(step / 3600) + 0.002;
    const bars = [];
    let trend = 0;
    for (let i = n - 1; i >= 0; i--) {
      if (i % 60 === 0) trend = (rnd() - 0.5) * vol * 0.6;
      const o = price;
      const c = o * (1 + trend + (rnd() - 0.5) * 2 * vol);
      const h = Math.max(o, c) * (1 + rnd() * vol * 0.8);
      const l = Math.min(o, c) * (1 - rnd() * vol * 0.8);
      bars.push({ time: end - i * step, open: o, high: h, low: l, close: c, volume: Math.round(1000 + rnd() * 9000 * (1 + Math.abs(c - o) / o * 50)) });
      price = c;
    }
    return (demoState[key] = bars);
  }

  const demo = {
    label: 'Dữ liệu giả lập',
    short: 'Giả lập',
    tfs: Object.keys(App.TF),
    canLoadMore: false,
    hint: 'Gõ tên bất kỳ, VD: DEMO, ABC, TEST1',
    normalize: s => s.toUpperCase().replace(/[^A-Z0-9]/g, '') || 'DEMO',
    async fetchBars(sym, tf) { return demoGen(sym, tf).map(b => ({ ...b })); },
    live(sym, tf, onBar) {
      const bars = demoGen(sym, tf), step = App.TF[tf];
      const id = setInterval(() => {
        const last = bars[bars.length - 1];
        const t = Math.floor((now() + App.TZ) / step) * step;
        if (t > last.time) {
          bars.push({ time: t, open: last.close, high: last.close, low: last.close, close: last.close, volume: 0 });
        }
        const b = bars[bars.length - 1];
        b.close = b.close * (1 + (Math.random() - 0.5) * 0.0016);
        b.high = Math.max(b.high, b.close); b.low = Math.min(b.low, b.close);
        b.volume += Math.round(Math.random() * 60);
        onBar({ ...b });
      }, 1000);
      App.setStatus('live', 'Giả lập — nhảy giá mỗi giây');
      return () => clearInterval(id);
    },
    async quotes(syms) {
      const out = {};
      syms.forEach(s => {
        const d = demoGen(s, '1D'), a = d[d.length - 1], b = d[d.length - 2];
        out[s] = { price: a.close, chg: (a.close / b.close - 1) * 100 };
      });
      return out;
    }
  };

  /* =======================================================
   * 5) FILE CSV — cô tải file giá lên
   *    Cột: thời gian, mở, cao, thấp, đóng, [khối lượng]
   * ======================================================= */
  App.csvSets = {};
  const csv = {
    label: 'File CSV đã nhập',
    short: 'CSV',
    tfs: ['1D'],
    canLoadMore: false,
    hint: 'Dùng nút "Nhập file CSV" bên dưới',
    normalize: s => s,
    async fetchBars(sym) {
      const d = App.csvSets[sym] || App.store.get('csv:' + sym);
      if (!d) throw new Error('Chưa có file CSV tên ' + sym);
      App.csvSets[sym] = d;
      return d.map(b => ({ ...b }));
    },
    live() { App.setStatus('idle', 'Dữ liệu tĩnh từ file'); return () => {}; },
    async quotes(syms) {
      const out = {};
      for (const s of syms) {
        try {
          const d = await csv.fetchBars(s);
          const a = d[d.length - 1], b = d[d.length - 2] || a;
          out[s] = { price: a.close, chg: (a.close / b.close - 1) * 100 };
        } catch (e) {}
      }
      return out;
    }
  };

  // Đọc nội dung CSV -> mảng nến
  App.parseCSV = function (text) {
    const lines = text.replace(/\r/g, '').split('\n').map(l => l.trim()).filter(Boolean);
    if (lines.length < 2) throw new Error('File quá ít dòng');
    const sep = [';', '\t', ','].find(s => lines[0].split(s).length >= 5) || ',';
    const split = l => l.split(sep).map(x => x.trim().replace(/^"|"$/g, ''));
    let head = split(lines[0]).map(h => h.toLowerCase());
    let start = 1;
    const isNum = v => v !== '' && !isNaN(v.replace(',', '.'));
    if (isNum(split(lines[0])[1] || '')) { head = []; start = 0; } // không có dòng tiêu đề
    const find = (names, def) => {
      const i = head.findIndex(h => names.some(n => h.includes(n)));
      return i >= 0 ? i : def;
    };
    const iT = find(['date', 'time', 'ngày', 'ngay', 'thời', 'thoi'], 0);
    const iO = find(['open', 'mở', 'mo cua', 'mở cửa'], 1);
    const iH = find(['high', 'cao'], 2);
    const iL = find(['low', 'thấp', 'thap'], 3);
    const iC = find(['close', 'đóng', 'dong', 'price', 'giá'], 4);
    const iV = find(['vol', 'khối', 'khoi', 'kl'], 5);
    const num = v => parseFloat(String(v).replace(/\s/g, '').replace(/,(?=\d{3}\b)/g, '').replace(',', '.'));
    const parseT = v => {
      if (/^\d{10}$/.test(v)) return +v;
      if (/^\d{13}$/.test(v)) return Math.floor(+v / 1000);
      let m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})(?:[ T](\d{1,2}):(\d{2}))?/); // dd/mm/yyyy
      if (m) return Date.UTC(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0)) / 1000;
      m = v.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/); // yyyy-mm-dd
      if (m) return Date.UTC(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0)) / 1000;
      return NaN;
    };
    const bars = [];
    for (let i = start; i < lines.length; i++) {
      const c = split(lines[i]);
      const b = { time: parseT(c[iT]), open: num(c[iO]), high: num(c[iH]), low: num(c[iL]), close: num(c[iC]), volume: c[iV] != null ? num(c[iV]) || 0 : 0 };
      if (!isNaN(b.time) && !isNaN(b.close)) {
        if (isNaN(b.open)) b.open = b.close;
        if (isNaN(b.high)) b.high = Math.max(b.open, b.close);
        if (isNaN(b.low)) b.low = Math.min(b.open, b.close);
        bars.push(b);
      }
    }
    if (bars.length < 2) throw new Error('Không đọc được dữ liệu — cần cột ngày, mở, cao, thấp, đóng');
    bars.sort((a, b) => a.time - b.time);
    return bars.filter((b, i) => i === 0 || b.time !== bars[i - 1].time);
  };

  // Gộp nến nhỏ thành nến lớn hơn (VD: ngày -> tuần)
  App.aggregate = function (bars, step) {
    const out = [];
    const offset = step === 604800 ? 4 * 86400 : 0; // tuần bắt đầu thứ Hai
    bars.forEach(b => {
      const t = Math.floor((b.time - offset) / step) * step + offset;
      const last = out[out.length - 1];
      if (last && last.time === t) {
        last.high = Math.max(last.high, b.high); last.low = Math.min(last.low, b.low);
        last.close = b.close; last.volume += b.volume;
      } else out.push({ ...b, time: t });
    });
    return out;
  };

  App.aggregateMonth = function (bars) {
    const out = [];
    bars.forEach(b => { const d = new Date(b.time * 1000), t = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) / 1000, l = out[out.length - 1];
      if (l && l.time === t) { l.high = Math.max(l.high, b.high); l.low = Math.min(l.low, b.low); l.close = b.close; l.volume += b.volume; } else out.push({ ...b, time: t }); });
    return out;
  };
  App.sources = { BINANCE: binance, VN: vn, TCBS: tcbs, TD: td, DEMO: demo, CSV: csv };
})(window.App);

</script>
<script>
/* --- js/ta.js --- */
/* =========================================================
 * ta.js — Thư viện hàm tính toán kỹ thuật (giống các hàm ta.* của Pine Script)
 * Mọi hàm nhận mảng số (có thể có NaN) và trả về mảng cùng độ dài.
 * ========================================================= */
(function (App) {
  'use strict';
  const N = NaN;
  const isN = v => v === v && v != null; // không phải NaN

  const T = App.ta = {};

  T.nz = (v, d = 0) => (isN(v) ? v : d);
  T.arr = (n, v = N) => new Array(n).fill(v);

  // Lấy nguồn giá theo tên
  T.src = function (D, name) {
    switch (name) {
      case 'open': return D.o; case 'high': return D.h; case 'low': return D.l;
      case 'hl2': return D.hl2; case 'hlc3': return D.hlc3; case 'ohlc4': return D.ohlc4;
      case 'volume': return D.v;
      default: return D.c;
    }
  };

  // Chuẩn bị dữ liệu dạng cột từ mảng nến
  T.prep = function (bars) {
    const n = bars.length, o = new Array(n), h = new Array(n), l = new Array(n), c = new Array(n), v = new Array(n), t = new Array(n);
    const hl2 = new Array(n), hlc3 = new Array(n), ohlc4 = new Array(n);
    for (let i = 0; i < n; i++) {
      const b = bars[i];
      o[i] = b.open; h[i] = b.high; l[i] = b.low; c[i] = b.close; v[i] = b.volume || 0; t[i] = b.time;
      hl2[i] = (b.high + b.low) / 2; hlc3[i] = (b.high + b.low + b.close) / 3; ohlc4[i] = (b.open + b.high + b.low + b.close) / 4;
    }
    return { n, o, h, l, c, v, t, hl2, hlc3, ohlc4, bars };
  };

  /* ---------- Trung bình động ---------- */
  T.sma = function (s, n) {
    const out = T.arr(s.length); let sum = 0, cnt = 0;
    for (let i = 0; i < s.length; i++) {
      const x = s[i];
      if (isN(x)) { sum += x; cnt++; }
      if (i >= n) { const y = s[i - n]; if (isN(y)) { sum -= y; cnt--; } }
      if (i >= n - 1 && cnt === n) out[i] = sum / n;
    }
    return out;
  };
  T.ema = function (s, n, alpha) {
    const a = alpha || 2 / (n + 1), out = T.arr(s.length);
    let prev = N, seed = 0, cnt = 0;
    for (let i = 0; i < s.length; i++) {
      const x = s[i];
      if (!isN(x)) { out[i] = prev; continue; }
      if (isN(prev)) { prev = a * x + (1 - a) * prev; out[i] = prev; continue; }
      seed += x; cnt++;
      if (cnt === n) { prev = seed / n; out[i] = prev; }
    }
    return out;
  };
  T.rma = (s, n) => T.ema(s, n, 1 / n);           // trung bình Wilder
  T.wma = function (s, n) {
    const out = T.arr(s.length), den = n * (n + 1) / 2;
    for (let i = n - 1; i < s.length; i++) {
      let sum = 0, ok = true;
      for (let j = 0; j < n; j++) { const x = s[i - j]; if (!isN(x)) { ok = false; break; } sum += x * (n - j); }
      if (ok) out[i] = sum / den;
    }
    return out;
  };
  T.hma = (s, n) => T.wma(T.sub(T.mul(T.wma(s, Math.floor(n / 2)), 2), T.wma(s, n)), Math.round(Math.sqrt(n)));
  T.dema = (s, n) => { const e = T.ema(s, n); return T.sub(T.mul(e, 2), T.ema(e, n)); };
  T.tema = (s, n) => { const e1 = T.ema(s, n), e2 = T.ema(e1, n), e3 = T.ema(e2, n); return e1.map((v, i) => 3 * v - 3 * e2[i] + e3[i]); };
  T.vwma = (s, v, n) => T.div(T.sma(T.mul(s, v), n), T.sma(v, n));
  T.alma = function (s, n, offset = 0.85, sigma = 6) {
    const out = T.arr(s.length), m = offset * (n - 1), sd = n / sigma, w = [];
    let norm = 0;
    for (let j = 0; j < n; j++) { w[j] = Math.exp(-((j - m) ** 2) / (2 * sd * sd)); norm += w[j]; }
    for (let i = n - 1; i < s.length; i++) {
      let sum = 0;
      for (let j = 0; j < n; j++) sum += w[j] * s[i - (n - 1 - j)];
      out[i] = sum / norm;
    }
    return out;
  };
  T.linreg = function (s, n, offset = 0) {
    const out = T.arr(s.length);
    for (let i = n - 1; i < s.length; i++) {
      let sx = 0, sy = 0, sxy = 0, sxx = 0, ok = true;
      for (let j = 0; j < n; j++) {
        const y = s[i - n + 1 + j]; if (!isN(y)) { ok = false; break; }
        sx += j; sy += y; sxy += j * y; sxx += j * j;
      }
      if (!ok) continue;
      const slope = (n * sxy - sx * sy) / (n * sxx - sx * sx), icpt = (sy - slope * sx) / n;
      out[i] = icpt + slope * (n - 1 - offset);
    }
    return out;
  };
  T.mcginley = function (s, n) {
    const out = T.arr(s.length), e = T.ema(s, n);
    let prev = N;
    for (let i = 0; i < s.length; i++) {
      if (!isN(prev)) { prev = e[i]; out[i] = prev; continue; }
      prev = prev + (s[i] - prev) / (n * Math.pow(s[i] / prev, 4));
      out[i] = prev;
    }
    return out;
  };
  // Chọn kiểu trung bình theo tên
  T.ma = function (type, s, n, v) {
    switch (type) {
      case 'EMA': return T.ema(s, n); case 'WMA': return T.wma(s, n); case 'RMA': case 'SMMA': return T.rma(s, n);
      case 'HMA': return T.hma(s, n); case 'VWMA': return T.vwma(s, v, n); case 'DEMA': return T.dema(s, n); case 'TEMA': return T.tema(s, n);
      default: return T.sma(s, n);
    }
  };
  T.MA_TYPES = ['SMA', 'EMA', 'WMA', 'RMA', 'HMA', 'VWMA', 'DEMA', 'TEMA'];

  /* ---------- Phép toán mảng ---------- */
  const bin = f => (a, b) => (Array.isArray(a) ? a : null)
    ? a.map((x, i) => f(x, Array.isArray(b) ? b[i] : b))
    : b.map(y => f(a, y));
  T.add = bin((x, y) => x + y); T.sub = bin((x, y) => x - y); T.mul = bin((x, y) => x * y);
  T.div = bin((x, y) => (y === 0 ? N : x / y));
  T.shift = (s, k) => s.map((_, i) => (i - k >= 0 && i - k < s.length ? s[i - k] : N));
  T.change = (s, k = 1) => s.map((x, i) => (i >= k ? x - s[i - k] : N));
  T.sum = function (s, n) {
    const out = T.arr(s.length); let sum = 0;
    for (let i = 0; i < s.length; i++) { sum += T.nz(s[i]); if (i >= n) sum -= T.nz(s[i - n]); if (i >= n - 1) out[i] = sum; }
    return out;
  };
  T.cum = s => { let a = 0; return s.map(x => (a += T.nz(x))); };
  T.highest = function (s, n) {
    const out = T.arr(s.length);
    for (let i = n - 1; i < s.length; i++) { let m = -Infinity; for (let j = i - n + 1; j <= i; j++) if (s[j] > m) m = s[j]; out[i] = m; }
    return out;
  };
  T.lowest = function (s, n) {
    const out = T.arr(s.length);
    for (let i = n - 1; i < s.length; i++) { let m = Infinity; for (let j = i - n + 1; j <= i; j++) if (s[j] < m) m = s[j]; out[i] = m; }
    return out;
  };
  T.highestbars = function (s, n) {
    const out = T.arr(s.length);
    for (let i = n - 1; i < s.length; i++) { let m = -Infinity, k = 0; for (let j = i - n + 1; j <= i; j++) if (s[j] >= m) { m = s[j]; k = j; } out[i] = k - i; }
    return out;
  };
  T.lowestbars = function (s, n) {
    const out = T.arr(s.length);
    for (let i = n - 1; i < s.length; i++) { let m = Infinity, k = 0; for (let j = i - n + 1; j <= i; j++) if (s[j] <= m) { m = s[j]; k = j; } out[i] = k - i; }
    return out;
  };
  T.stdev = function (s, n) {
    const m = T.sma(s, n), out = T.arr(s.length);
    for (let i = n - 1; i < s.length; i++) {
      if (!isN(m[i])) continue;
      let v = 0; for (let j = i - n + 1; j <= i; j++) v += (s[j] - m[i]) ** 2;
      out[i] = Math.sqrt(v / n);
    }
    return out;
  };
  T.dev = function (s, n) { // độ lệch tuyệt đối trung bình
    const m = T.sma(s, n), out = T.arr(s.length);
    for (let i = n - 1; i < s.length; i++) { let v = 0; for (let j = i - n + 1; j <= i; j++) v += Math.abs(s[j] - m[i]); out[i] = v / n; }
    return out;
  };
  T.correlation = function (a, b, n) {
    const out = T.arr(a.length);
    for (let i = n - 1; i < a.length; i++) {
      let sa = 0, sb = 0, saa = 0, sbb = 0, sab = 0;
      for (let j = i - n + 1; j <= i; j++) { sa += a[j]; sb += b[j]; saa += a[j] * a[j]; sbb += b[j] * b[j]; sab += a[j] * b[j]; }
      const cov = sab / n - (sa / n) * (sb / n), va = saa / n - (sa / n) ** 2, vb = sbb / n - (sb / n) ** 2;
      out[i] = va > 0 && vb > 0 ? cov / Math.sqrt(va * vb) : N;
    }
    return out;
  };
  T.percentrank = function (s, n) {
    const out = T.arr(s.length);
    for (let i = n; i < s.length; i++) { let c = 0; for (let j = i - n; j < i; j++) if (s[j] <= s[i]) c++; out[i] = c / n * 100; }
    return out;
  };

  /* ---------- Biến động ---------- */
  T.tr = function (D) {
    return D.c.map((_, i) => i === 0 ? D.h[i] - D.l[i] : Math.max(D.h[i] - D.l[i], Math.abs(D.h[i] - D.c[i - 1]), Math.abs(D.l[i] - D.c[i - 1])));
  };
  T.atr = (D, n) => T.rma(T.tr(D), n);

  /* ---------- Dao động phổ biến ---------- */
  T.rsi = function (s, n) {
    const up = T.rma(s.map((x, i) => (i ? Math.max(x - s[i - 1], 0) : N)), n);
    const dn = T.rma(s.map((x, i) => (i ? Math.max(s[i - 1] - x, 0) : N)), n);
    return up.map((u, i) => (dn[i] === 0 ? 100 : u === 0 ? 0 : 100 - 100 / (1 + u / dn[i])));
  };
  T.stoch = function (s, h, l, n) {
    const hh = T.highest(h, n), ll = T.lowest(l, n);
    return s.map((x, i) => (hh[i] - ll[i] === 0 ? N : 100 * (x - ll[i]) / (hh[i] - ll[i])));
  };
  T.cci = (s, n) => { const m = T.sma(s, n), d = T.dev(s, n); return s.map((x, i) => (x - m[i]) / (0.015 * d[i])); };
  T.roc = (s, n) => s.map((x, i) => (i >= n ? 100 * (x - s[i - n]) / s[i - n] : N));
  T.mom = (s, n) => T.change(s, n);
  T.dmi = function (D, n, smooth) {
    const pdm = [], mdm = [];
    for (let i = 0; i < D.n; i++) {
      if (!i) { pdm.push(N); mdm.push(N); continue; }
      const up = D.h[i] - D.h[i - 1], dn = D.l[i - 1] - D.l[i];
      pdm.push(up > dn && up > 0 ? up : 0); mdm.push(dn > up && dn > 0 ? dn : 0);
    }
    const tr = T.rma(T.tr(D).map((x, i) => (i ? x : N)), n);
    const plus = T.rma(pdm, n).map((x, i) => 100 * x / tr[i]);
    const minus = T.rma(mdm, n).map((x, i) => 100 * x / tr[i]);
    const dx = plus.map((p, i) => { const s = p + minus[i]; return s === 0 ? 0 : 100 * Math.abs(p - minus[i]) / s; });
    return { plus, minus, adx: T.rma(dx, smooth || n) };
  };
  T.obv = D => { let a = 0; return D.c.map((x, i) => (i ? (a += x > D.c[i - 1] ? D.v[i] : x < D.c[i - 1] ? -D.v[i] : 0) : (a = 0))); };
  T.mfi = function (D, n) {
    const tp = D.hlc3, pos = [], neg = [];
    for (let i = 0; i < D.n; i++) {
      const mf = tp[i] * D.v[i];
      pos.push(i && tp[i] > tp[i - 1] ? mf : 0); neg.push(i && tp[i] < tp[i - 1] ? mf : 0);
    }
    const sp = T.sum(pos, n), sn = T.sum(neg, n);
    return sp.map((p, i) => (sn[i] === 0 ? 100 : 100 - 100 / (1 + p / sn[i])));
  };
  T.sar = function (D, start = 0.02, inc = 0.02, max = 0.2) {
    const out = T.arr(D.n); if (D.n < 2) return out;
    let up = D.c[1] >= D.c[0], af = start, ep = up ? D.h[0] : D.l[0], sar = up ? D.l[0] : D.h[0];
    for (let i = 1; i < D.n; i++) {
      sar = sar + af * (ep - sar);
      if (up) {
        sar = Math.min(sar, D.l[i - 1], i > 1 ? D.l[i - 2] : D.l[i - 1]);
        if (D.l[i] < sar) { up = false; sar = ep; ep = D.l[i]; af = start; }
        else if (D.h[i] > ep) { ep = D.h[i]; af = Math.min(af + inc, max); }
      } else {
        sar = Math.max(sar, D.h[i - 1], i > 1 ? D.h[i - 2] : D.h[i - 1]);
        if (D.h[i] > sar) { up = true; sar = ep; ep = D.h[i]; af = start; }
        else if (D.l[i] < ep) { ep = D.l[i]; af = Math.min(af + inc, max); }
      }
      out[i] = sar;
    }
    return out;
  };
  T.supertrend = function (D, factor, n) {
    const atr = T.atr(D, n), st = T.arr(D.n), dir = T.arr(D.n);
    let ub = N, lb = N, d = 1;
    for (let i = 0; i < D.n; i++) {
      if (!isN(atr[i])) continue;
      const up = D.hl2[i] + factor * atr[i], dn = D.hl2[i] - factor * atr[i];
      const pub = ub, plb = lb;
      lb = isN(plb) && (dn < plb && D.c[i - 1] > plb) ? plb : dn;
      ub = isN(pub) && (up > pub && D.c[i - 1] < pub) ? pub : up;
      if (isN(pub)) d = d === -1 ? (D.c[i] > ub ? 1 : -1) : (D.c[i] < lb ? -1 : 1);
      st[i] = d === 1 ? lb : ub; dir[i] = d;
    }
    return { st, dir };
  };
  T.vwap = function (D, anchor = 'D') {
    const out = T.arr(D.n), up = T.arr(D.n), lo = T.arr(D.n);
    let pv = 0, vv = 0, pv2 = 0, key = null;
    for (let i = 0; i < D.n; i++) {
      const k = T.periodKey(D.t[i], anchor);
      if (k !== key) { pv = vv = pv2 = 0; key = k; }
      const p = D.hlc3[i], v = D.v[i] || 1;
      pv += p * v; vv += v; pv2 += p * p * v;
      out[i] = pv / vv;
      const sd = Math.sqrt(Math.max(0, pv2 / vv - out[i] ** 2));
      up[i] = out[i] + sd; lo[i] = out[i] - sd;
    }
    return { vwap: out, sd: up.map((u, i) => u - out[i]) };
  };
  // Khoá theo kỳ (ngày/tuần/tháng/quý/năm) để reset VWAP, pivot…
  T.periodKey = function (t, p) {
    const d = new Date(t * 1000);
    const y = d.getUTCFullYear(), m = d.getUTCMonth();
    switch (p) {
      case 'W': return Math.floor((t / 86400 + 3) / 7);
      case 'M': return y * 12 + m;
      case 'Q': return y * 4 + Math.floor(m / 3);
      case 'Y': return y;
      case '4H': return Math.floor(t / 14400);
      case '1H': return Math.floor(t / 3600);
      default: return Math.floor(t / 86400);
    }
  };

  /* ---------- Đỉnh / đáy (pivot) ---------- */
  T.pivothigh = function (s, L, R) {
    const out = T.arr(s.length);
    for (let i = L; i < s.length - R; i++) {
      let ok = true;
      for (let j = i - L; j <= i + R && ok; j++) if (j !== i && (s[j] > s[i] || (j > i && s[j] === s[i]))) ok = false;
      if (ok) out[i] = s[i];
    }
    return out;
  };
  T.pivotlow = function (s, L, R) {
    const out = T.arr(s.length);
    for (let i = L; i < s.length - R; i++) {
      let ok = true;
      for (let j = i - L; j <= i + R && ok; j++) if (j !== i && (s[j] < s[i] || (j > i && s[j] === s[i]))) ok = false;
      if (ok) out[i] = s[i];
    }
    return out;
  };
  // ZigZag: danh sách đỉnh/đáy xen kẽ, đổi chiều khi giá đi ngược >= dev%
  T.zigzag = function (D, devPct = 5, depth = 10) {
    const pts = [];
    if (D.n < 2) return pts;
    let dir = 0, ext = { i: 0, p: D.c[0] };
    for (let i = 1; i < D.n; i++) {
      const h = D.h[i], l = D.l[i];
      if (dir >= 0) {
        if (h >= ext.p || dir === 0 && h > ext.p) { ext = { i, p: h }; if (dir === 0) dir = 1; }
        if (dir === 1 && (ext.p - l) / ext.p * 100 >= devPct && i - ext.i >= 0) {
          pts.push({ i: ext.i, p: ext.p, hi: true }); dir = -1; ext = { i, p: l }; continue;
        }
      }
      if (dir <= 0) {
        if (l <= ext.p) { ext = { i, p: l }; if (dir === 0) dir = -1; }
        if (dir === -1 && (h - ext.p) / ext.p * 100 >= devPct) {
          pts.push({ i: ext.i, p: ext.p, hi: false }); dir = 1; ext = { i, p: h };
        }
      }
    }
    pts.push({ i: ext.i, p: ext.p, hi: dir === 1, last: true });
    // bỏ các điểm quá gần nhau (độ sâu)
    return pts.filter((p, k) => k === 0 || p.last || p.i - pts[k - 1].i >= Math.min(depth, 2));
  };
  // Tự chọn độ lệch zigzag hợp với biến động của mã
  T.autoDev = function (D) {
    const a = T.atr(D, 14), last = a[a.length - 1], c = D.c[D.n - 1];
    return Math.max(0.3, Math.min(15, (last / c) * 100 * 3));
  };

  T.crossover = (a, b, i) => i > 0 && a[i] > (Array.isArray(b) ? b[i] : b) && a[i - 1] <= (Array.isArray(b) ? b[i - 1] : b);
  T.crossunder = (a, b, i) => i > 0 && a[i] < (Array.isArray(b) ? b[i] : b) && a[i - 1] >= (Array.isArray(b) ? b[i - 1] : b);
  T.isN = isN;
})(window.App);
