<script>
/* --- js/indicators.js --- */
/* =========================================================
 * indicators.js — Danh mục chỉ báo tích hợp sẵn (theo danh sách của TradingView)
 *
 * Mỗi chỉ báo khai báo:
 *   name     tên hiển thị        overlay  true = vẽ chồng lên giá
 *   inputs   [khoá, nhãn, mặc định, kiểu, lựa chọn]
 *   plots    [khoá, tên, màu, kiểu]   (kiểu: line | hist | step | dots | area | cross | cols)
 *   levels   các mức ngang (VD: 70/30 của RSI)
 *   calc(D, I) -> { khoáPlot: mảng giá trị, colors?, markers?, fills?, draw? }
 *   need     lý do không hỗ trợ (cần dữ liệu ngoài)
 * ========================================================= */
(function (App) {
  'use strict';
  const T = App.ta, N = NaN, isN = T.isN;
  const DEFS = App.INDICATORS = {};
  const R = (id, name, o) => { DEFS[id] = Object.assign({ id, name, cat: 'ind', inputs: [], plots: [], levels: [] }, o); };

  const SRC = ['close', 'open', 'high', 'low', 'hl2', 'hlc3', 'ohlc4'];
  const src = (k = 'src', d = 'close') => [k, 'Nguồn', d, 'sel', SRC];
  const len = (d, k = 'len', l = 'Độ dài') => [k, l, d, 'int'];
  const UP = '#089981', DN = '#f23645', BLUE = '#2962ff', ORG = '#ff6d00', PUR = '#7e57c2', GRAY = '#787b86', TEAL = '#00897b', YEL = '#fbc02d';
  const histCol = arr => arr.map((v, i) => v >= 0 ? (i && v < arr[i - 1] ? '#b2dfdb' : '#26a69a') : (i && v > arr[i - 1] ? '#ffcdd2' : '#ff5252'));
  const signCol = (arr, u = UP, d = DN) => arr.map(v => v >= 0 ? u : d);

  /* ===================== A ===================== */
  R('vol24', '24-hour volume', { inputs: [], plots: [['v', 'KL 24 giờ', BLUE, 'cols']],
    calc(D) { const out = T.arr(D.n); let s = 0, j = 0; for (let i = 0; i < D.n; i++) { s += D.v[i]; while (D.t[j] <= D.t[i] - 86400) s -= D.v[j++]; out[i] = s; } return { v: out }; } });
  R('ad', 'Accumulation/distribution', { plots: [['ad', 'A/D', '#999915']],
    calc(D) { return { ad: T.cum(D.c.map((c, i) => { const r = D.h[i] - D.l[i]; return r ? ((c - D.l[i]) - (D.h[i] - c)) / r * D.v[i] : 0; })) }; } });
  R('adl', 'Advance-decline line', { need: 'Cần dữ liệu số mã tăng/giảm của toàn sàn' });
  R('adr', 'Advance-decline ratio', { need: 'Cần dữ liệu số mã tăng/giảm của toàn sàn' });
  R('adrbars', 'Advance-decline ratio (bars)', { inputs: [len(9)], plots: [['r', 'Tỉ lệ', BLUE]], levels: [1],
    calc(D, I) { const up = T.sum(D.c.map((c, i) => c > D.o[i] ? 1 : 0), I.len), dn = T.sum(D.c.map((c, i) => c < D.o[i] ? 1 : 0), I.len); return { r: up.map((u, i) => dn[i] ? u / dn[i] : u) }; } });
  R('alma', 'Arnaud Legoux moving average', { overlay: true, inputs: [len(9), ['off', 'Offset', 0.85, 'float'], ['sig', 'Sigma', 6, 'float'], src()], plots: [['m', 'ALMA', BLUE]],
    calc(D, I) { return { m: T.alma(T.src(D, I.src), I.len, I.off, I.sig) }; } });
  R('aroon', 'Aroon', { inputs: [len(14)], plots: [['up', 'Aroon lên', ORG], ['dn', 'Aroon xuống', BLUE]],
    calc(D, I) { const hb = T.highestbars(D.h, I.len + 1), lb = T.lowestbars(D.l, I.len + 1); return { up: hb.map(x => 100 * (x + I.len) / I.len), dn: lb.map(x => 100 * (x + I.len) / I.len) }; } });
  R('aroonosc', 'Aroon oscillator', { inputs: [len(14)], plots: [['o', 'Dao động Aroon', PUR]], levels: [0, 90, -90],
    calc(D, I) { const hb = T.highestbars(D.h, I.len + 1), lb = T.lowestbars(D.l, I.len + 1); return { o: hb.map((x, i) => 100 * (x - lb[i]) / I.len) }; } });

  // Các chỉ báo "Auto" vẽ bằng lớp phủ dựa trên ZigZag
  const zz = (D, I) => T.zigzag(D, I.dev > 0 ? I.dev : T.autoDev(D), I.depth || 10);
  const FIBL = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1, 1.272, 1.618, 2.618];
  const FIBC = ['#787b86', '#f23645', '#ff9800', '#4caf50', '#089981', '#00bcd4', '#787b86', '#2962ff', '#9c27b0', '#e91e63'];
  R('autofibret', 'Auto fib retracement', { overlay: true, inputs: [['dev', 'Độ lệch % (0 = tự động)', 0, 'float'], ['depth', 'Độ sâu', 10, 'int']],
    calc(D, I) { const p = zz(D, I); if (p.length < 2) return {}; const a = p[p.length - 2], b = p[p.length - 1];
      return { draw(g, X) { const x1 = X.x(a.i), x2 = X.W; FIBL.slice(0, 7).forEach((lv, k) => { const pr = b.p + (a.p - b.p) * lv, y = X.y(pr); X.hline(g, x1, x2, y, FIBC[k], `${lv} (${App.fmtPrice(pr)})`); }); X.seg(g, X.x(a.i), X.y(a.p), X.x(b.i), X.y(b.p), GRAY, [4, 4]); } }; } });
  R('autofibext', 'Auto fib extension', { overlay: true, inputs: [['dev', 'Độ lệch % (0 = tự động)', 0, 'float'], ['depth', 'Độ sâu', 10, 'int']],
    calc(D, I) { const p = zz(D, I); if (p.length < 3) return {}; const [a, b, c] = p.slice(-3);
      return { draw(g, X) { const d = b.p - a.p; [0, 0.382, 0.618, 1, 1.272, 1.618, 2.618].forEach((lv, k) => { const pr = c.p + d * lv; X.hline(g, X.x(c.i), X.W, X.y(pr), FIBC[k + 1], `${lv} (${App.fmtPrice(pr)})`); });
        X.poly(g, [a, b, c].map(q => [X.x(q.i), X.y(q.p)]), GRAY, [4, 4]); } }; } });
  R('autokeylevels', 'Auto key levels', { overlay: true, inputs: [len(10, 'lb', 'Số nến hai bên'), ['max', 'Số mức tối đa', 6, 'int']],
    calc(D, I) { const ph = T.pivothigh(D.h, I.lb, I.lb), pl = T.pivotlow(D.l, I.lb, I.lb), lv = [];
      for (let i = 0; i < D.n; i++) { if (isN(ph[i])) lv.push(ph[i]); if (isN(pl[i])) lv.push(pl[i]); }
      const tol = T.atr(D, 14)[D.n - 1] * 0.5, cl = [];
      lv.forEach(p => { const c = cl.find(c => Math.abs(c.p - p) < tol); if (c) { c.p = (c.p * c.n + p) / (c.n + 1); c.n++; } else cl.push({ p, n: 1 }); });
      const top = cl.sort((a, b) => b.n - a.n).slice(0, I.max);
      return { draw(g, X) { top.forEach(c => X.hline(g, 0, X.W, X.y(c.p), c.p > D.c[D.n - 1] ? DN : UP, `${App.fmtPrice(c.p)} ×${c.n}`, c.n > 2 ? 2 : 1)); } }; } });
  R('autopitchfork', 'Auto pitchfork', { overlay: true, inputs: [['dev', 'Độ lệch % (0 = tự động)', 0, 'float'], ['depth', 'Độ sâu', 10, 'int']],
    calc(D, I) { const p = zz(D, I); if (p.length < 4) return {}; const [a, b, c] = p.slice(-4, -1);
      return { draw(g, X) { const A = [X.x(a.i), X.y(a.p)], B = [X.x(b.i), X.y(b.p)], C = [X.x(c.i), X.y(c.p)], M = [(B[0] + C[0]) / 2, (B[1] + C[1]) / 2];
        const dx = M[0] - A[0], dy = M[1] - A[1], k = dx ? (X.W - A[0]) / dx : 0;
        X.seg(g, A[0], A[1], A[0] + dx * k, A[1] + dy * k, '#e91e63'); [B, C].forEach(P => X.seg(g, P[0], P[1], P[0] + dx * k, P[1] + dy * k, BLUE)); X.seg(g, B[0], B[1], C[0], C[1], GRAY); } }; } });
  R('autotrend', 'Auto trendlines', { overlay: true, inputs: [len(10, 'lb', 'Số nến hai bên')],
    calc(D, I) { const ph = [], pl = []; const H = T.pivothigh(D.h, I.lb, I.lb), L = T.pivotlow(D.l, I.lb, I.lb);
      for (let i = 0; i < D.n; i++) { if (isN(H[i])) ph.push([i, H[i]]); if (isN(L[i])) pl.push([i, L[i]]); }
      return { draw(g, X) { [[ph, DN], [pl, UP]].forEach(([arr, col]) => { if (arr.length < 2) return; const [p1, p2] = arr.slice(-2); const s = (p2[1] - p1[1]) / (p2[0] - p1[0]), iEnd = D.n + 10;
        X.seg(g, X.x(p1[0]), X.y(p1[1]), X.x(iEnd), X.y(p1[1] + s * (iEnd - p1[0])), col, null, 2); }); } }; } });
  R('adx', 'Average directional index', { inputs: [len(14, 'smooth', 'Làm mượt ADX'), len(14, 'len', 'Độ dài DI')], plots: [['adx', 'ADX', '#ff5252']],
    calc(D, I) { return { adx: T.dmi(D, I.len, I.smooth).adx }; } });
  R('ao', 'Awesome oscillator', { plots: [['ao', 'AO', TEAL, 'hist']],
    calc(D) { const ao = T.sub(T.sma(D.hl2, 5), T.sma(D.hl2, 34)); return { ao, colors: { ao: ao.map((v, i) => i && v >= ao[i - 1] ? UP : DN) } }; } });
  R('adrange', 'Average day range', { inputs: [len(14)], plots: [['a', 'ADR', '#2196f3']], calc(D, I) { return { a: T.sma(T.sub(D.h, D.l), I.len) }; } });
  R('atr', 'Average true range', { inputs: [len(14), ['ma', 'Làm mượt', 'RMA', 'sel', ['RMA', 'SMA', 'EMA', 'WMA']]], plots: [['a', 'ATR', '#b71c1c']],
    calc(D, I) { return { a: T.ma(I.ma, T.tr(D), I.len) }; } });

  /* ===================== B ===================== */
  R('bop', 'Balance of power', { plots: [['b', 'BOP', '#ff5252']], levels: [0],
    calc(D) { return { b: D.c.map((c, i) => D.h[i] - D.l[i] ? (c - D.o[i]) / (D.h[i] - D.l[i]) : 0) }; } });
  R('bbtrend', 'BBTrend', { inputs: [len(20, 'sl', 'Dải ngắn'), len(50, 'll', 'Dải dài'), ['k', 'Độ lệch chuẩn', 2, 'float']], plots: [['b', 'BBTrend', TEAL, 'hist']], levels: [0],
    calc(D, I) { const m1 = T.sma(D.c, I.sl), s1 = T.stdev(D.c, I.sl), m2 = T.sma(D.c, I.ll), s2 = T.stdev(D.c, I.ll);

    calc(D) { const out = App.techRatingSeries(D).all; return { r: out, colors: { r: out.map(v => v > 0.1 ? UP : v < -0.1 ? DN : GRAY) } }; } });
  R('twap', 'Time weighted average price', { overlay: true, inputs: [['a', 'Neo theo', 'D', 'sel', ['D', 'W', 'M']]], plots: [['t', 'TWAP', '#ff9800']],
    calc(D, I) { const out = T.arr(D.n); let s = 0, k = 0, key = null; for (let i = 0; i < D.n; i++) { const kk = T.periodKey(D.t[i], I.a); if (kk !== key) { s = 0; k = 0; key = kk; } s += D.ohlc4[i]; k++; out[i] = s / k; } return { t: out }; } });
  R('sessions', 'Trading sessions', { overlay: true, inputs: [],
    calc(D) { const tfs = App.TF[App.state.tf] || 86400; if (tfs >= 86400) return {};
      const S = [['Tokyo', 0, 9, 'rgba(255,152,0,0.07)'], ['London', 8, 16.5, 'rgba(33,150,243,0.07)'], ['New York', 13.5, 20, 'rgba(76,175,80,0.07)']];
      return { draw(g, X) { S.forEach(([nm, a, b, col]) => { let st = null; for (let i = 0; i <= D.n; i++) { const h = i < D.n ? ((D.t[i] - App.TZ) % 86400) / 3600 : -1, inS = h >= a && h < b;
        if (inS && st == null) st = i; if (!inS && st != null) { X.box(g, X.x(st), 0, X.x(i - 1), X.H, col); g.fillStyle = col.replace('0.07', '0.8'); g.font = '10px sans-serif'; g.fillText(nm, X.x(st) + 2, 12); st = null; } } }); } }; } });
  R('tsi_str', 'Trend strength index', { inputs: [len(14)], plots: [['t', 'TSI', BLUE]], levels: [0],
    calc(D, I) { const idx = D.c.map((_, i) => i); return { t: T.correlation(D.c, idx, I.len) }; } });
  R('tema', 'Triple EMA', { overlay: true, inputs: [len(9), src()], plots: [['t', 'TEMA', '#f44336']], calc(D, I) { return { t: T.tema(T.src(D, I.src), I.len) }; } });
  R('trix', 'TRIX', { inputs: [len(18)], plots: [['t', 'TRIX', DN]], levels: [0],
    calc(D, I) { const l = D.c.map(Math.log), e = T.ema(T.ema(T.ema(l, I.len), I.len), I.len); return { t: T.change(e).map(x => x * 10000) }; } });
  R('tsi', 'True strength index', { inputs: [len(25, 'l', 'Dài'), len(13, 's', 'Ngắn'), len(13, 'sig', 'Tín hiệu')], plots: [['t', 'TSI', BLUE], ['s', 'Tín hiệu', DN]], levels: [0],
    calc(D, I) { const pc = T.change(D.c), ds = x => T.ema(T.ema(x, I.l), I.s), t = T.div(ds(pc), ds(pc.map(Math.abs))).map(x => 100 * x); return { t, s: T.ema(t, I.sig) }; } });

  /* ===================== U–Z ===================== */
  R('uo', 'Ultimate oscillator', { inputs: [len(7, 'a', 'Nhanh'), len(14, 'b', 'Vừa'), len(28, 'c', 'Chậm')], plots: [['u', 'UO', '#f44336']], levels: [70, 50, 30],
    calc(D, I) { const bp = D.c.map((c, i) => c - Math.min(D.l[i], i ? D.c[i - 1] : D.l[i])), tr = D.c.map((c, i) => Math.max(D.h[i], i ? D.c[i - 1] : D.h[i]) - Math.min(D.l[i], i ? D.c[i - 1] : D.l[i]));
      const av = n => T.div(T.sum(bp, n), T.sum(tr, n)), a = av(I.a), b = av(I.b), c = av(I.c); return { u: a.map((x, i) => 100 * (4 * x + 2 * b[i] + c[i]) / 7) }; } });
  R('updownvol', 'Up/down volume', { plots: [['u', 'KL tăng', UP, 'cols'], ['d', 'KL giảm', DN, 'cols'], ['dl', 'Chênh lệch', BLUE]],
    calc(D) { const u = D.v.map((v, i) => D.c[i] >= D.o[i] ? v : 0), d = D.v.map((v, i) => D.c[i] < D.o[i] ? -v : 0); return { u, d, dl: T.add(u, d) }; }, note: 'Ước lượng theo màu nến' });
  R('vap', 'Visible average price', { overlay: true,

  R('volstop', 'Volatility stop', { overlay: true, inputs: [len(20), ['k', 'Hệ số', 2, 'float']], plots: [['v', 'Dừng biến động', TEAL, 'cross']],
    calc(D, I) { const a = T.atr(D, I.len), out = T.arr(D.n), col = []; let up = true, mx = D.c[0], mn = D.c[0], st = N;
      for (let i = 0; i < D.n; i++) { if (!isN(a[i])) { col.push(GRAY); continue; } mx = Math.max(mx, D.c[i]); mn = Math.min(mn, D.c[i]);

        st = s; out[i] = s; col.push(up ? UP : DN); }
      return { v: out, colors: { v: col } }; } });
  R('volume', 'Volume', { overlay: true, scale: 'vol', inputs: [len(20, 'ml', 'Độ dài MA'), ['showma', 'Hiện MA', false, 'bool']], plots: [['v', 'Khối lượng', '#26a69a', 'cols'], ['m', 'MA khối lượng', BLUE]],
    calc(D, I) { return { v: D.v, m: I.showma ? T.sma(D.v, I.ml) : T.arr(D.n), colors: { v: D.c.map((c, i) => c >= D.o[i] ? 'rgba(8,153,129,0.5)' : 'rgba(242,54,69,0.5)') } }; } });
  R('voldelta', 'Volume delta', { plots: [['d', 'Delta', TEAL, 'hist']], calc(D) { const d = D.v.map((v, i) => { const r = D.h[i] - D.l[i]; return r ? v * (2 * D.c[i] - D.h[i] - D.l[i]) / r : 0; }); return { d, colors: { d: signCol(d) } }; }, note: 'Ước lượng từ vị trí giá đóng cửa trong nến' });

  R('vwap', 'Volume weighted average price', { overlay: true, inputs: [['a', 'Neo theo', 'D', 'sel', ['D', 'W', 'M', 'Q', 'Y']], ['k', 'Hệ số dải', 1, 'float'], ['bands', 'Hiện dải', true, 'bool']], plots: [['v', 'VWAP', '#2962ff'], ['u', 'Dải trên', '#4caf50'], ['l', 'Dải dưới', '#4caf50']],

  R('vwma', 'Volume weighted moving average', { overlay: true, inputs: [len(20), src()], plots: [['v', 'VWMA', BLUE]], calc(D, I) { return { v: T.vwma(T.src(D, I.src), D.v, I.len) }; } });

      return { p: T.div(T.sum(vp, I.len), s), m: T.div(T.sum(vm, I.len), s) }; } });
  R('wpr', 'Williams %R', { inputs: [len(14)], plots: [['w', '%R', PUR]], levels: [-20, -50, -80],
    calc(D, I) { const hh = T.highest(D.h, I.len), ll = T.lowest(D.l, I.len); return { w: D.c.map((c, i) => -100 * (hh[i] - c) / (hh[i] - ll[i])) }; } });
  R('alligator', 'Williams alligator', { overlay: true, inputs: [len(13, 'j', 'Hàm'), len(8, 't', 'Răng'), len(5, 'l', 'Môi')], plots: [['j', 'Hàm', BLUE], ['t', 'Răng', '#e91e63'], ['l', 'Môi', '#66bb6a']],
    calc(D, I) { return { j: T.shift(T.rma(D.hl2, I.j), 8), t: T.shift(T.rma(D.hl2, I.t), 5), l: T.shift(T.rma(D.hl2, I.l), 3) }; } });
  R('fractals', 'Williams fractals', { overlay: true, inputs: [len(2, 'n', 'Chu kỳ')],
    calc(D, I) { const H = T.pivothigh(D.h, I.n, I.n), L = T.pivotlow(D.l, I.n, I.n), mk = []; for (let i = 0; i < D.n; i++) { if (isN(H[i])) mk.push({ i, pos: 'aboveBar', shape: 'arrowDown', color: DN }); if (isN(L[i])) mk.push({ i, pos: 'belowBar', shape: 'arrowUp', color: UP }); } return { markers: mk }; } });
  R('woodies', 'Woodies CCI', { inputs: [len(6, 't', 'CCI Turbo'), len(14, 'c', 'CCI 14')], plots: [['h', 'Histogram', GRAY, 'hist'], ['t', 'CCI Turbo', '#ffeb3b'], ['c', 'CCI 14', '#009688']], levels: [100, 0, -100],
    calc(D, I) { const c = T.cci(D.hlc3, I.c); return { h: c, t: T.cci(D.hlc3, I.t), c, colors: { h: c.map(v => v >= 0 ? 'rgba(8,153,129,0.5)' : 'rgba(242,54,69,0.5)') } }; } });
  R('zigzag', 'Zig zag', { overlay: true, inputs: [['dev', 'Độ lệch % (0 = tự động)', 5, 'float'], ['depth', 'Độ sâu', 10, 'int'], ['labels', 'Hiện giá', true, 'bool']],

      if (I.labels) p.forEach((q, k) => { if (!k) return; const ch = (q.p / p[k - 1].p - 1) * 100; X.label(g, X.x(q.i), X.y(q.p) + (q.hi ? -10 : 10), `${App.fmtPrice(q.p)} (${App.fmtPct(ch)})`, q.hi ? DN : UP); }); } }; } });

  /* ===================== Hồ sơ khối lượng (tab "Hồ sơ") ===================== */
  App.volumeProfile = function (D, a, b, rows) {
    let hi = -Infinity, lo = Infinity;
    for (let i = a; i <= b; i++) { hi = Math.max(hi, D.h[i]); lo = Math.min(lo, D.l[i]); }
    if (!(hi > lo)) return null;
    const step = (hi - lo) / rows, up = new Array(rows).fill(0), dn = new Array(rows).fill(0);
    for (let i = a; i <= b; i++) {
      const r0 = Math.max(0, Math.floor((D.l[i] - lo) / step)), r1 = Math.min(rows - 1, Math.floor((D.h[i] - lo) / step)), share = D.v[i] / (r1 - r0 + 1);
      for (let r = r0; r <= r1; r++) (D.c[i] >= D.o[i] ? up : dn)[r] += share;
    }
    const tot = up.map((u, i) => u + dn[i]), poc = tot.indexOf(Math.max(...tot)), sum = tot.reduce((s, x) => s + x, 0);
    let va = tot[poc], lo2 = poc, hi2 = poc;
    while (va < sum * 0.7 && (lo2 > 0 || hi2 < rows - 1)) { const nx = hi2 < rows - 1 ? tot[hi2 + 1] : -1, pv = lo2 > 0 ? tot[lo2 - 1] : -1; if (nx >= pv) va += tot[++hi2]; else va += tot[--lo2]; }
    return { lo, step, up, dn, tot, poc, vah: hi2, val: lo2, max: tot[poc] };
  };

      const y1 = X.y(vp.lo + (r + 1) * vp.step), y2 = X.y(vp.lo + r * vp.step), h = Math.max(1, y2 - y1 - 1), inVA = r >= vp.val && r <= vp.vah;
      const wu = width * vp.up[r] / vp.max, wd = width * vp.dn[r] / vp.max;
      const x0 = fromRight ? xLeft + width - wu - wd : xLeft;
      g.fillStyle = inVA ? 'rgba(8,153,129,0.55)' : 'rgba(8,153,129,0.25)'; g.fillRect(x0, y1, wu, h);
      g.fillStyle = inVA ? 'rgba(242,54,69,0.55)' : 'rgba(242,54,69,0.25)'; g.fillRect(x0 + wu, y1, wd, h);
    });
    const yp = X.y(vp.lo + (vp.poc + 0.5) * vp.step);
    X.seg(g, fromRight ? 0 : xLeft, yp, fromRight ? X.W : xLeft + width * 1.2, yp, '#ff5252', null, 1.5);
  };
  const VPcat = 'profile';
  R('vpvr', 'Visible range volume profile', { cat: VPcat, overlay: true, inputs: [['rows', 'Số hàng', 24, 'int'], ['w', 'Độ rộng (%)', 30, 'int']],
    calc(D, I) { return { draw(g, X) { const [a, b] = X.visible(); App.drawProfile(g, X, App.volumeProfile(D, a, b, I.rows), X.W * (1 - I.w / 100), X.W * I.w / 100, true); } }; } });
  R('vpfixed', 'Fixed range volume profile (N nến cuối)', { cat: VPcat, overlay: true, inputs: [len(150, 'len', 'Số nến'), ['rows', 'Số hàng', 24, 'int']],
    calc(D, I) { const a = Math.max(0, D.n - I.len), vp = App.volumeProfile(D, a, D.n - 1, I.rows); return { draw(g, X) { const x1 = X.x(a), x2 = X.x(D.n - 1); App.drawProfile(g, X, vp, x1, Math.max(20, (x2 - x1) * 0.5), false); } }; } });
  R('vpsession', 'Session volume profile', { cat: VPcat, overlay: true, inputs: [['rows', 'Số hàng', 16, 'int']],
    calc(D, I) { const per = []; let key = null; for (let i = 0; i < D.n; i++) { const k = T.periodKey(D.t[i], 'D'); if (k !== key) { per.push([i, i]); key = k; } else per[per.length - 1][1] = i; }
      const vps = per.slice(-30).map(([a, b]) => ({ a, b, vp: App.volumeProfile(D, a, b, I.rows) }));
      return { draw(g, X) { vps.forEach(p => { const x1 = X.x(p.a), x2 = X.x(p.b); App.drawProfile(g, X, p.vp, x1, Math.max(6, (x2 - x1) * 0.7), false); }); } }; } });
  R('vpperiodic', 'Periodic volume profile', { cat: VPcat, overlay: true, inputs: [['p', 'Chu kỳ', 'W', 'sel', ['D', 'W', 'M', 'Q']], ['rows', 'Số hàng', 20, 'int']],
    calc(D, I) { const per = []; let key = null; for (let i = 0; i < D.n; i++) { const k = T.periodKey(D.t[i], I.p); if (k !== key) { per.push([i, i]); key = k; } else per[per.length - 1][1] = i; }
      const vps = per.slice(-20).map(([a, b]) => ({ a, b, vp: App.volumeProfile(D, a, b, I.rows) }));
      return { draw(g, X) { vps.forEach(p => { const x1 = X.x(p.a), x2 = X.x(p.b); App.drawProfile(g, X, p.vp, x1, Math.max(6, (x2 - x1) * 0.8), false); }); } }; } });
  R('vpauto', 'Auto anchored volume profile', { cat: VPcat, overlay: true, inputs: [['rows', 'Số hàng', 24, 'int']],
    calc(D, I) { const p = T.zigzag(D, T.autoDev(D), 10), a = p.length > 1 ? p[p.length - 2].i : 0, vp = App.volumeProfile(D, a, D.n - 1, I.rows);
      return { draw(g, X) { const x1 = X.x(a), x2 = X.x(D.n - 1); App.drawProfile(g, X, vp, x1, Math.max(20, (x2 - x1) * 0.6), false); } }; } });

  // Mô tả ngắn tiếng Việt cho một số chỉ báo phổ biến (hiện khi bấm "?")
  App.IND_HELP = {
    ma: 'Giá trung bình cộng của N nến gần nhất — làm mượt giá, xem xu hướng.',
    ema: 'Trung bình hàm mũ — giống MA nhưng ưu tiên nến gần đây, phản ứng nhanh hơn.',
    rsi: 'Đo tốc độ tăng/giảm, 0–100. Trên 70: quá mua, dưới 30: quá bán.',
    macd: 'Hiệu hai đường EMA (12, 26) và đường tín hiệu EMA 9 — bắt đổi xu hướng.',
    bb: 'Dải Bollinger: MA ± k lần độ lệch chuẩn — đo độ biến động.',
    stoch: 'So sánh giá đóng cửa với vùng cao–thấp N nến. Trên 80 quá mua, dưới 20 quá bán.',
    ichimoku: 'Hệ thống mây Ichimoku: xu hướng, hỗ trợ/kháng cự và động lượng.',
    vwap: 'Giá trung bình theo khối lượng trong ngày — mức giá "công bằng".',
    supertrend: 'Đường dừng theo ATR, đổi màu khi xu hướng đảo chiều.',
    atr: 'Biên độ dao động thực trung bình — đo độ biến động.',
    adx: 'Đo sức mạnh xu hướng (không phân biệt hướng). Trên 25: xu hướng mạnh.',
    obv: 'Cộng dồn khối lượng theo hướng giá — xác nhận dòng tiền.',
    volume: 'Khối lượng giao dịch mỗi nến.',
    sar: 'Các điểm dừng lỗ dạng parabol bám theo xu hướng.',
    vpvr: 'Phân bố khối lượng theo mức giá trong vùng đang nhìn. Đường đỏ = POC (giá giao dịch nhiều nhất).'

<script>
/* --- js/patterns.js --- */
/* =========================================================
 * patterns.js — Mô hình nến Nhật (44 mẫu) và mô hình biểu đồ tự động
 * Mỗi mô hình được đăng ký như một chỉ báo (nhóm "Mô hình"), vẽ bằng nhãn/hình.
 * ========================================================= */
(function (App) {
  'use strict';
  const T = App.ta, DEFS = App.INDICATORS, isN = T.isN;
  const UP = '#089981', DN = '#f23645', NEU = '#787b86';

  /* ---------- Thông số nến dùng chung ---------- */
  function feats(D) {
    const body = D.c.map((c, i) => Math.abs(c - D.o[i]));
    const bodyAvg = T.ema(body, 14), sma50 = T.sma(D.c, 50);
    const F = i => {
      const o = D.o[i], c = D.c[i], h = D.h[i], l = D.l[i], b = body[i], r = h - l || 1e-12;
      const top = Math.max(o, c), bot = Math.min(o, c);
      return { o, c, h, l, b, r, top, bot, up: h - top, dn: bot - l, white: c > o, black: c < o,
        small: b < (bodyAvg[i] || b), long: b > (bodyAvg[i] || b), doji: b <= r * 0.05, mid: (o + c) / 2,
        upTrend: c > sma50[i], downTrend: c < sma50[i] };
    };
    return F;
  }

  // Định nghĩa từng mô hình: [id, tên, hướng, số nến, hàm(F, i) -> true/false]
  const CANDLES = [
    ['abandonedbear', 'Abandoned baby (bearish)', -1, 3, (F, i) => { const a = F(i - 2), b = F(i - 1), c = F(i); return a.upTrend && a.white && a.long && b.doji && b.l > a.h && c.black && c.h < b.l; }],
    ['abandonedbull', 'Abandoned baby (bullish)', 1, 3, (F, i) => { const a = F(i - 2), b = F(i - 1), c = F(i); return a.downTrend && a.black && a.long && b.doji && b.h < a.l && c.white && c.l > b.h; }],
    ['darkcloud', 'Dark cloud cover (bearish)', -1, 2, (F, i) => { const a = F(i - 1), b = F(i); return a.upTrend && a.white && a.long && b.black && b.o >= a.h && b.c < a.mid && b.c > a.o; }],
    ['doji', 'Doji (neutral)', 0, 1, (F, i) => { const a = F(i); return a.doji && !(a.dn > a.r * 0.7) && !(a.up > a.r * 0.7); }],
    ['dojistarbear', 'Doji star (bearish)', -1, 2, (F, i) => { const a = F(i - 1), b = F(i); return a.upTrend && a.white && a.long && b.doji && b.bot > a.top; }],
    ['dojistarbull', 'Doji star (bullish)', 1, 2, (F, i) => { const a = F(i - 1), b = F(i); return a.downTrend && a.black && a.long && b.doji && b.top < a.bot; }],
    ['tasukidown', 'Downside Tasuki gap (bearish)', -1, 3, (F, i) => { const a = F(i - 2), b = F(i - 1), c = F(i); return a.downTrend && a.black && a.long && b.black && b.top < a.bot && c.white && c.o < b.top && c.o > b.bot && c.c > b.top && c.c < a.bot; }],
    ['dragonfly', 'Dragonfly Doji (bullish)', 1, 1, (F, i) => { const a = F(i); return a.doji && a.downTrend && a.dn > a.r * 0.7 && a.up <= a.r * 0.05; }],

    ['kickbear', 'Kicking (bearish)', -1, 2, (F, i) => { const a = F(i - 1), b = F(i); return a.white && a.long && a.up < a.r * 0.05 && a.dn < a.r * 0.05 && b.black && b.long && b.up < b.r * 0.05 && b.dn < b.r * 0.05 && b.h < a.l; }],
    ['kickbull', 'Kicking (bullish)', 1, 2, (F, i) => { const a = F(i - 1), b = F(i); return a.black && a.long && a.up < a.r * 0.05 && a.dn < a.r * 0.05 && b.white && b.long && b.up < b.r * 0.05 && b.dn < b.r * 0.05 && b.l > a.h; }],

    ['marublack', 'Marubozu black (bearish)', -1, 1, (F, i) => { const a = F(i); return a.black && a.long && a.up < a.b * 0.05 && a.dn < a.b * 0.05; }],
    ['maruwhite', 'Marubozu white (bullish)', 1, 1, (F, i) => { const a = F(i); return a.white && a.long && a.up < a.b * 0.05 && a.dn < a.b * 0.05; }],
    ['morningdoji', 'Morning Doji star (bullish)', 1, 3, (F, i) => { const a = F(i - 2), b = F(i - 1), c = F(i); return a.downTrend && a.black && a.long && b.doji && b.top < a.bot && c.white && c.c > a.mid; }],
    ['morningstar', 'Morning star (bullish)', 1, 3, (F, i) => { const a = F(i - 2), b = F(i - 1), c = F(i); return a.downTrend && a.black && a.long && b.small && !b.doji && b.top < a.bot && c.white && c.long && c.c > a.mid; }],
    ['onneck', 'On-neck (bearish)', -1, 2, (F, i) => { const a = F(i - 1), b = F(i); return a.downTrend && a.black && a.long && b.white && b.o < a.c && b.small && Math.abs(b.c - a.l) <= a.r * 0.05; }],
    ['piercing', 'Piercing (bullish)', 1, 2, (F, i) => { const a = F(i - 1), b = F(i); return a.downTrend && a.black && a.long && b.white && b.o <= a.l && b.c > a.mid && b.c < a.o; }],
    ['rise3', 'Rising three methods (bullish)', 1, 5, (F, i) => { const a = F(i - 4), x = [F(i - 3), F(i - 2), F(i - 1)], e = F(i); return a.upTrend && a.white && a.long && x.every(k => k.small && k.h < a.h && k.l > a.l) && x[0].black && x[2].black && e.white && e.long && e.c > a.c; }],
    ['risewindow', 'Rising window (bullish)', 1, 2, (F, i) => { const a = F(i - 1), b = F(i); return a.upTrend && b.l > a.h && a.r > 0 && b.r > 0; }],
    ['shootingstar', 'Shooting star (bearish)', -1, 1, (F, i) => { const a = F(i); return a.upTrend && a.small && a.b > 0 && a.up >= 2 * a.b && a.dn <= a.b * 0.3; }],
    ['spinblack', 'Spinning top black (neutral)', 0, 1, (F, i) => { const a = F(i); return a.black && a.up >= a.b && a.dn >= a.b && a.b > a.r * 0.05; }],
    ['spinwhite', 'Spinning top white (neutral)', 0, 1, (F, i) => { const a = F(i); return a.white && a.up >= a.b && a.dn >= a.b && a.b > a.r * 0.05; }],
    ['3crows', 'Three black crows (bearish)', -1, 3, (F, i) => { const x = [F(i - 2), F(i - 1), F(i)]; return x.every(k => k.black && k.long && k.dn < k.r * 0.15) && x[1].o < x[0].o && x[1].o > x[0].c && x[2].o < x[1].o && x[2].o > x[1].c && x[2].c < x[1].c; }],
    ['3soldiers', 'Three white soldiers (bullish)', 1, 3, (F, i) => { const x = [F(i - 2), F(i - 1), F(i)]; return x.every(k => k.white && k.long && k.up < k.r * 0.15) && x[1].o > x[0].o && x[1].o < x[0].c && x[2].o > x[1].o && x[2].o < x[1].c && x[2].c > x[1].c; }],
    ['tristarbear', 'Tri-star (bearish)', -1, 3, (F, i) => { const a = F(i - 2), b = F(i - 1), c = F(i); return a.upTrend && a.doji && b.doji && c.doji && b.bot > a.top && c.top < b.bot; }],
    ['tristarbull', 'Tri-star (bullish)', 1, 3, (F, i) => { const a = F(i - 2), b = F(i - 1), c = F(i); return a.downTrend && a.doji && b.doji && c.doji && b.top < a.bot && c.bot > b.top; }],
    ['tweezerbot', 'Tweezer bottom (bullish)', 1, 2, (F, i) => { const a = F(i - 1), b = F(i); return a.downTrend && a.black && b.white && Math.abs(a.l - b.l) <= Math.max(a.b, b.b) * 0.05 && !a.doji && !b.doji; }],
    ['tweezertop', 'Tweezer top (bearish)', -1, 2, (F, i) => { const a = F(i - 1), b = F(i); return a.upTrend && a.white && b.black && Math.abs(a.h - b.h) <= Math.max(a.b, b.b) * 0.05 && !a.doji && !b.doji; }],
    ['tasukiup', 'Upside Tasuki gap (bullish)', 1, 3, (F, i) => { const a = F(i - 2), b = F(i - 1), c = F(i); return a.upTrend && a.white && a.long && b.white && b.bot > a.top && c.black && c.o > b.bot && c.o < b.top && c.c < b.bot && c.c > a.top; }]
  ];
  App.CANDLE_LIST = CANDLES;

  // Rút gọn tên để làm nhãn trên biểu đồ
  const short = name => name.replace(/\s*\((bearish|bullish|neutral)\)/, '').replace(/Doji star/, 'Doji★').slice(0, 14);
  function scan(D, list) {
    const F = feats(D), mk = [];
    for (let i = 5; i < D.n; i++) {
      for (const [, name, dir, k, fn] of list) {
        if (i - k + 1 < 0) continue;
        let hit = false; try { hit = fn(F, i); } catch (e) {}
        if (hit) { mk.push({ i, pos: dir < 0 ? 'aboveBar' : dir > 0 ? 'belowBar' : 'aboveBar', shape: dir < 0 ? 'arrowDown' : dir > 0 ? 'arrowUp' : 'circle', color: dir < 0 ? DN : dir > 0 ? UP : NEU, text: short(name) }); break; }
      }
    }

  }
  DEFS.allcandles = { id: 'allcandles', name: 'All candlestick patterns', cat: 'pattern', sub: 'candle', overlay: true, inputs: [], plots: [], levels: [], calc(D) { return { markers: scan(D, CANDLES) }; } };
  CANDLES.forEach(c => {
    DEFS['cp_' + c[0]] = { id: 'cp_' + c[0], name: c[1], cat: 'pattern', sub: 'candle', overlay: true, inputs: [], plots: [], levels: [], calc(D) { return { markers: scan(D, [c]) }; } };
  });

  /* =========================================================
   * Mô hình biểu đồ — dò trên các đỉnh/đáy ZigZag
   * ========================================================= */
  function pivots(D, I) { return T.zigzag(D, I && I.dev > 0 ? I.dev : T.autoDev(D), 5); }
  const near = (a, b, tol) => Math.abs(a - b) <= tol;
  const slope = (p, q) => (q.p - p.p) / (q.i - p.i || 1);

  const FINDERS = {
    doubletop(P, tol) { const r = []; for (let k = 2; k < P.length; k++) { const [a, b, c] = P.slice(k - 2, k + 1); if (a.hi && c.hi && near(a.p, c.p, tol) && a.p - b.p > 2 * tol) r.push({ pts: [a, b, c], name: 'Hai đỉnh', col: DN, neck: b.p }); } return r; },
    doublebottom(P, tol) { const r = []; for (let k = 2; k < P.length; k++) { const [a, b, c] = P.slice(k - 2, k + 1); if (!a.hi && !c.hi && near(a.p, c.p, tol) && b.p - a.p > 2 * tol) r.push({ pts: [a, b, c], name: 'Hai đáy', col: UP, neck: b.p }); } return r; },
    tripletop(P, tol) { const r = []; for (let k = 4; k < P.length; k++) { const s = P.slice(k - 4, k + 1); if (s[0].hi && near(s[0].p, s[2].p, tol) && near(s[2].p, s[4].p, tol) && s[0].p - Math.max(s[1].p, s[3].p) > 2 * tol) r.push({ pts: s, name: 'Ba đỉnh', col: DN, neck: Math.min(s[1].p, s[3].p) }); } return r; },
    triplebottom(P, tol) { const r = []; for (let k = 4; k < P.length; k++) { const s = P.slice(k - 4, k + 1); if (!s[0].hi && near(s[0].p, s[2].p, tol) && near(s[2].p, s[4].p, tol) && Math.min(s[1].p, s[3].p) - s[0].p > 2 * tol) r.push({ pts: s, name: 'Ba đáy', col: UP, neck: Math.max(s[1].p, s[3].p) }); } return r; },
    hs(P, tol) { const r = []; for (let k = 4; k < P.length; k++) { const s = P.slice(k - 4, k + 1); if (s[0].hi && s[2].p > s[0].p + tol && s[2].p > s[4].p + tol && near(s[0].p, s[4].p, 2 * tol)) r.push({ pts: s, name: 'Vai-Đầu-Vai', col: DN, neckLine: [s[1], s[3]] }); } return r; },
    ihs(P, tol) { const r = []; for (let k = 4; k < P.length; k++) { const s = P.slice(k - 4, k + 1); if (!s[0].hi && s[2].p < s[0].p - tol && s[2].p < s[4].p - tol && near(s[0].p, s[4].p, 2 * tol)) r.push({ pts: s, name: 'VĐV ngược', col: UP, neckLine: [s[1], s[3]] }); } return r; },
    _shape(P, tol, kind) {
      const r = [];
      for (let k = 5; k < P.length; k++) {
        const s = P.slice(k - 5, k + 1), H = s.filter(p => p.hi), L = s.filter(p => !p.hi);
        if (H.length < 2 || L.length < 2) continue;
        const sh = slope(H[0], H[H.length - 1]), sl = slope(L[0], L[L.length - 1]), span = s[5].i - s[0].i, eps = tol / span;
        const flatH = Math.abs(sh) < eps, flatL = Math.abs(sl) < eps;
        let name = null, col = NEU;
        if (kind === 'rect' && flatH && flatL) name = 'Chữ nhật';
        if (kind === 'tri' && ((sh < -eps && sl > eps) || (flatH && sl > eps) || (sh < -eps && flatL))) { name = flatH ? 'Tam giác tăng' : flatL ? 'Tam giác giảm' : 'Tam giác cân'; col = flatH ? UP : flatL ? DN : NEU; }
        if (kind === 'rwedge' && sh > eps && sl > eps && sl > sh) { name = 'Nêm tăng'; col = DN; }
        if (kind === 'fwedge' && sh < -eps && sl < -eps && sh < sl) { name = 'Nêm giảm'; col = UP; }
        if (name) r.push({ pts: s, name, col, lines: [[H[0], H[H.length - 1]], [L[0], L[L.length - 1]]] });
      }
      return r;
    },
    flag(P, tol, D, bull, pennant) {
      const r = [], atr = T.atr(D, 14);
      for (let k = 4; k < P.length; k++) {
        const pole0 = P[k - 4], pole1 = P[k - 3], s = P.slice(k - 3, k + 1);
        const move = pole1.p - pole0.p, a = atr[pole1.i] || tol;
        if (bull ? move < 4 * a : move > -4 * a) continue;
        if (pole1.i - pole0.i > 25) continue;
        const rng = Math.max(...s.map(p => p.p)) - Math.min(...s.map(p => p.p));
        if (rng > Math.abs(move) * 0.5) continue;
        const H = s.filter(p => p.hi), L = s.filter(p => !p.hi); if (H.length < 2 || L.length < 2) continue;
        const conv = Math.abs(H[1].p - L[1].p) < Math.abs(H[0].p - L[0].p) * 0.7;
        if (!!pennant !== conv) continue;
        r.push({ pts: [pole0, pole1], name: (pennant ? 'Cờ đuôi nheo ' : 'Cờ ') + (bull ? 'tăng' : 'giảm'), col: bull ? UP : DN, lines: [[H[0], H[1]], [L[0], L[1]]] });
      }
      return r;
    },
    cup(P, tol, D, inv) {
      const r = [];
      for (let k = 3; k < P.length; k++) {
        const [a, b, c, d] = P.slice(k - 3, k + 1);
        if (inv ? (a.hi || !b.hi || c.hi || !d.hi) : (!a.hi || b.hi || !c.hi || d.hi)) continue;
        const depth = Math.abs(a.p - b.p), w = c.i - a.i;
        if (!near(a.p, c.p, 2 * tol) || w < 15 || depth < 3 * tol) continue;
        if (Math.abs(c.p - d.p) > depth * 0.5 || d.i - c.i > w * 0.5) continue;
        if (Math.abs((b.i - a.i) / w - 0.5) > 0.25) continue;
        r.push({ pts: [a, b, c, d], name: inv ? 'Cốc tay cầm ngược' : 'Cốc tay cầm', col: inv ? DN : UP, curve: true });
      }
      return r;
    },
    elliott(P) {
      const r = [];
      for (let k = 5; k < P.length; k++) {
        const s = P.slice(k - 5, k + 1), up = !s[0].hi, p = s.map(x => up ? x.p : -x.p);
        const w1 = p[1] - p[0], w3 = p[3] - p[2], w5 = p[5] - p[4];
        if (p[2] > p[0] && p[3] > p[1] && p[4] > p[1] && p[5] > p[3] && !(w3 < w1 && w3 < w5))
          r.push({ pts: s, name: 'Sóng Elliott', col: '#2962ff', nums: true });
      }
      return r;
    }
  };

  function drawFound(g, X, list) {
    list.forEach(f => {
      const pts = f.pts.map(q => [X.x(q.i), X.y(q.p)]);
      if (f.curve) {
        g.strokeStyle = f.col; g.lineWidth = 2; g.beginPath(); g.moveTo(...pts[0]); g.quadraticCurveTo(pts[1][0], pts[1][1] + (pts[1][1] - pts[0][1]) * 0.4, ...pts[2]); g.lineTo(...pts[3]); g.stroke();
      } else X.poly(g, pts, f.col, null, 2);
      g.globalAlpha = 0.08; g.fillStyle = f.col; g.beginPath(); pts.forEach((p, k) => k ? g.lineTo(...p) : g.moveTo(...p)); g.fill(); g.globalAlpha = 1;
      if (f.neck != null) X.seg(g, pts[0][0], X.y(f.neck), pts[pts.length - 1][0] + 30, X.y(f.neck), f.col, [5, 4]);
      if (f.neckLine) { const [a, b] = f.neckLine; const s = slope(a, b), i2 = f.pts[f.pts.length - 1].i + 10; X.seg(g, X.x(a.i), X.y(a.p), X.x(i2), X.y(a.p + s * (i2 - a.i)), f.col, [5, 4]); }
      if (f.lines) f.lines.forEach(([a, b]) => X.seg(g, X.x(a.i), X.y(a.p), X.x(b.i), X.y(b.p), f.col, [3, 3], 1.5));
      if (f.nums) f.pts.forEach((q, k) => X.label(g, X.x(q.i), X.y(q.p) + (q.hi ? -12 : 12), String(k), f.col));
      const top = Math.min(...pts.map(p => p[1]));
      X.label(g, pts[Math.floor(pts.length / 2)][0], top - 16, f.name, f.col);
    });
  }

  const CHART = [
    ['bearflag', 'Bearish flag chart pattern', (P, t, D) => FINDERS.flag(P, t, D, false, false)],
    ['bullflag', 'Bullish flag chart pattern', (P, t, D) => FINDERS.flag(P, t, D, true, false)],
    ['cuphandle', 'Cup and handle chart pattern', (P, t, D) => FINDERS.cup(P, t, D, false)],
    ['invcup', 'Inverted cup and handle chart pattern', (P, t, D) => FINDERS.cup(P, t, D, true)],
    ['doublebottom', 'Double bottom chart pattern', (P, t) => FINDERS.doublebottom(P, t)],
    ['doubletop', 'Double top chart pattern', (P, t) => FINDERS.doubletop(P, t)],
    ['elliott', 'Elliott wave chart pattern', P => FINDERS.elliott(P)],
    ['hs', 'Head and shoulders chart pattern', (P, t) => FINDERS.hs(P, t)],
    ['ihs', 'Inverted head and shoulders chart pattern', (P, t) => FINDERS.ihs(P, t)],
    ['bearpennant', 'Bearish pennant chart pattern', (P, t, D) => FINDERS.flag(P, t, D, false, true)],
    ['bullpennant', 'Bullish pennant chart pattern', (P, t, D) => FINDERS.flag(P, t, D, true, true)],
    ['rect', 'Rectangle chart pattern', (P, t) => FINDERS._shape(P, t, 'rect')],
    ['triangle', 'Triangle chart pattern', (P, t) => FINDERS._shape(P, t, 'tri')],
    ['triplebottom', 'Triple bottom chart pattern', (P, t) => FINDERS.triplebottom(P, t)],
    ['tripletop', 'Triple top chart pattern', (P, t) => FINDERS.tripletop(P, t)],
    ['fwedge', 'Falling wedge chart pattern', (P, t) => FINDERS._shape(P, t, 'fwedge')],
    ['rwedge', 'Rising wedge chart pattern', (P, t) => FINDERS._shape(P, t, 'rwedge')]
  ];
  // Loại bỏ mô hình trùng lặp (giữ cái mới nhất, không chồng lấn)
  function dedupe(list, max) {
    const out = [];
    list.sort((a, b) => b.pts[b.pts.length - 1].i - a.pts[a.pts.length - 1].i).forEach(f => {
      const a = f.pts[0].i, b = f.pts[f.pts.length - 1].i;
      if (!out.some(o => !(b < o.pts[0].i || a > o.pts[o.pts.length - 1].i))) out.push(f);
    });
    return out.slice(0, max);
  }
  const chartInputs = [['dev', 'Độ lệch % (0 = tự động)', 0, 'float'], ['max', 'Số mô hình tối đa', 6, 'int']];
  function runChart(D, I, finders) {
    const P = pivots(D, I), tol = T.atr(D, 14)[D.n - 1] * 0.8 || D.c[D.n - 1] * 0.01;
    let found = []; finders.forEach(f => { found = found.concat(f[2](P, tol, D)); });
    const show = dedupe(found, I.max);
    return { draw(g, X) { drawFound(g, X, show); }, found: show };
  }
  DEFS.allchart = { id: 'allchart', name: 'All chart patterns', cat: 'pattern', sub: 'chart', overlay: true, inputs: chartInputs, plots: [], levels: [], calc(D, I) { return runChart(D, I, CHART); } };
  CHART.forEach(c => { DEFS['ch_' + c[0]] = { id: 'ch_' + c[0], name: c[1], cat: 'pattern', sub: 'chart', overlay: true, inputs: chartInputs, plots: [], levels: [], calc(D, I) { return runChart(D, I, [c]); } }; });
  DEFS.autotrenddet = { id: 'autotrenddet', name: 'Auto trend detector', beta: true, cat: 'pattern', sub: 'chart', overlay: true, inputs: [['len', 'Độ dài', 50, 'int']], plots: [], levels: [],
    calc(D, I) {
      const lr = T.linreg(D.c, I.len), adx = T.dmi(D, 14, 14).adx, segs = []; let cur = null;
      for (let i = I.len; i < D.n; i++) {
        const sl = lr[i] - lr[i - 1], tr = adx[i] < 20 ? 0 : sl > 0 ? 1 : -1;
        if (!cur || cur.tr !== tr) { cur = { a: i, b: i, tr, hi: D.h[i], lo: D.l[i] }; segs.push(cur); } else { cur.b = i; cur.hi = Math.max(cur.hi, D.h[i]); cur.lo = Math.min(cur.lo, D.l[i]); }
      }
      const show = segs.filter(s => s.b - s.a > 8).slice(-8);
      return { draw(g, X) { show.forEach(s => { const col = s.tr > 0 ? 'rgba(8,153,129,0.10)' : s.tr < 0 ? 'rgba(242,54,69,0.10)' : 'rgba(120,123,134,0.10)'; X.box(g, X.x(s.a), X.y(s.hi), X.x(s.b), X.y(s.lo), col, col.replace('0.10', '0.6'));
        X.label(g, (X.x(s.a) + X.x(s.b)) / 2, X.y(s.hi) - 10, s.tr > 0 ? 'Tăng' : s.tr < 0 ? 'Giảm' : 'Đi ngang', s.tr > 0 ? UP : s.tr < 0 ? DN : NEU); }); } };
    } };

  /* ---------- Tab "Options" (cần dữ liệu quyền chọn) ---------- */
  DEFS.opt_move = { id: 'opt_move', name: 'Options expected move', cat: 'options', need: 'Cần dữ liệu quyền chọn (options) — các nguồn miễn phí không có', inputs: [], plots: [], levels: [] };
  DEFS.opt_vp = { id: 'opt_vp', name: 'Options volume profile', cat: 'options', need: 'Cần dữ liệu quyền chọn (options) — các nguồn miễn phí không có', inputs: [], plots: [], levels: [] };
})(window.App);

<script>
/* --- js/strategies.js --- */
/* =========================================================
 * strategies.js — 23 chiến lược có sẵn của TradingView + bộ kiểm tra (backtest)
 * Mỗi chiến lược trả về tín hiệu: +1 = vào lệnh Mua, -1 = vào lệnh Bán (đảo chiều),
 * 2 = đóng lệnh Mua, -2 = đóng lệnh Bán. Lệnh khớp ở giá mở cửa nến kế tiếp.
 * ========================================================= */
(function (App) {
  'use strict';
  const T = App.ta, DEFS = App.INDICATORS, isN = T.isN, N = NaN;
  const len = (d, k = 'len', l = 'Độ dài') => [k, l, d, 'int'];

  const S = {
    barupdn: ['Bar up/down strategy', [], (D) => D.c.map((c, i) => i && c > D.o[i] && D.o[i] > D.c[i - 1] ? 1 : i && c < D.o[i] && D.o[i] < D.c[i - 1] ? -1 : 0)],
    bbs: ['Bollinger Bands strategy', [len(20), ['k', 'Hệ số', 2, 'float']], (D, I) => { const m = T.sma(D.c, I.len), sd = T.stdev(D.c, I.len), u = m.map((x, i) => x + I.k * sd[i]), l = m.map((x, i) => x - I.k * sd[i]); return D.c.map((_, i) => T.crossover(D.c, l, i) ? 1 : T.crossunder(D.c, u, i) ? -1 : 0); }],
    bbsd: ['Bollinger Bands strategy directed', [len(20), ['k', 'Hệ số', 2, 'float'], ['dir', 'Hướng', 'Mua', 'sel', ['Mua', 'Bán']]], (D, I) => { const m = T.sma(D.c, I.len), sd = T.stdev(D.c, I.len), u = m.map((x, i) => x + I.k * sd[i]), l = m.map((x, i) => x - I.k * sd[i]);
      return D.c.map((_, i) => I.dir === 'Mua' ? (T.crossover(D.c, l, i) ? 1 : T.crossunder(D.c, u, i) ? 2 : 0) : (T.crossunder(D.c, u, i) ? -1 : T.crossover(D.c, l, i) ? -2 : 0)); }],
    chbreak: ['Channel breakout strategy', [len(5)], (D, I) => { const hh = T.highest(D.h, I.len), ll = T.lowest(D.l, I.len); return D.c.map((_, i) => i && D.h[i] > hh[i - 1] ? 1 : i && D.l[i] < ll[i - 1] ? -1 : 0); }],
    consec: ['Consecutive up/down strategy', [len(3, 'u', 'Số nến tăng liên tiếp'), len(3, 'd', 'Số nến giảm liên tiếp')], (D, I) => { let u = 0, d = 0; return D.c.map((c, i) => { if (!i) return 0; u = c > D.c[i - 1] ? u + 1 : 0; d = c < D.c[i - 1] ? d + 1 : 0; return u >= I.u ? 1 : d >= I.d ? -1 : 0; }); }],
    greedy: ['Greedy strategy', [], (D) => D.c.map((_, i) => i && D.o[i] > D.h[i - 1] ? 1 : i && D.o[i] < D.l[i - 1] ? -1 : 0)],
    insidebar: ['Inside bar strategy', [], (D) => D.c.map((c, i) => i && D.h[i] < D.h[i - 1] && D.l[i] > D.l[i - 1] ? (c > D.o[i] ? 1 : -1) : 0)],
    kcs: ['Keltner channels strategy', [len(20), ['k', 'Hệ số', 1, 'float']], (D, I) => { const m = T.ema(D.c, I.len), r = T.ema(T.sub(D.h, D.l), I.len), u = m.map((x, i) => x + I.k * r[i]), l = m.map((x, i) => x - I.k * r[i]); return D.c.map((_, i) => T.crossover(D.c, u, i) ? 1 : T.crossunder(D.c, l, i) ? -1 : 0); }],
    macds: ['MACD strategy', [len(12, 'f', 'Nhanh'), len(26, 's', 'Chậm'), len(9, 'sig', 'Tín hiệu')], (D, I) => { const m = T.sub(T.ema(D.c, I.f), T.ema(D.c, I.s)), h = T.sub(m, T.ema(m, I.sig)); return D.c.map((_, i) => T.crossover(h, 0, i) ? 1 : T.crossunder(h, 0, i) ? -1 : 0); }],
    moms: ['Momentum strategy', [len(12)], (D, I) => { const m0 = T.mom(D.c, I.len), m1 = T.mom(m0, 1); return D.c.map((_, i) => m0[i] > 0 && m1[i] > 0 ? 1 : m0[i] < 0 && m1[i] < 0 ? -1 : 0); }],
    macross: ['Moving average crossover', [len(9)], (D, I) => { const m = T.sma(D.c, I.len); return D.c.map((_, i) => T.crossover(D.c, m, i) ? 1 : T.crossunder(D.c, m, i) ? -1 : 0); }],
    outsidebar: ['Outside bar strategy', [], (D) => D.c.map((c, i) => i && D.h[i] > D.h[i - 1] && D.l[i] < D.l[i - 1] ? (c > D.o[i] ? 1 : -1) : 0)],
    sars: ['Parabolic SAR strategy', [['s', 'Bắt đầu', 0.02, 'float'], ['inc', 'Bước', 0.02, 'float'], ['max', 'Tối đa', 0.2, 'float']], (D, I) => { const s = T.sar(D, I.s, I.inc, I.max); return D.c.map((c, i) => T.crossover(D.c, s, i) ? 1 : T.crossunder(D.c, s, i) ? -1 : 0); }],
    pivext: ['Pivot extension strategy', [len(4, 'l', 'Nến trái'), len(2, 'r', 'Nến phải')], (D, I) => { const H = T.pivothigh(D.h, I.l, I.r), L = T.pivotlow(D.l, I.l, I.r), s = T.arr(D.n, 0); for (let i = 0; i < D.n; i++) { if (isN(L[i]) && i + I.r < D.n) s[i + I.r] = 1; if (isN(H[i]) && i + I.r < D.n) s[i + I.r] = -1; } return s; }],
    pivrev: ['Pivot reversal strategy', [len(4, 'l', 'Nến trái'), len(2, 'r', 'Nến phải')], (D, I) => { const H = T.pivothigh(D.h, I.l, I.r), L = T.pivotlow(D.l, I.l, I.r); let hp = N, lp = N; return D.c.map((c, i) => { const k = i - I.r; if (k >= 0) { if (isN(H[k])) hp = H[k]; if (isN(L[k])) lp = L[k]; } return isN(hp) && D.h[i] > hp ? (hp = N, 1) : isN(lp) && D.l[i] < lp ? (lp = N, -1) : 0; }); }],
    pchans: ['Price channel strategy', [len(20)], (D, I) => { const hh = T.highest(D.h, I.len), ll = T.lowest(D.l, I.len); return D.c.map((_, i) => i && D.h[i] > hh[i - 1] ? 1 : i && D.l[i] < ll[i - 1] ? -1 : 0); }],
    rbadx: ['Rob Booker — ADX breakout', [len(14, 'adx', 'Độ dài ADX'), ['th', 'Ngưỡng ADX', 18, 'float'], len(20, 'box', 'Hộp nến')], (D, I) => { const a = T.dmi(D, I.adx, I.adx).adx, hh = T.highest(D.h, I.box), ll = T.lowest(D.l, I.box); return D.c.map((c, i) => i && a[i - 1] < I.th ? (c > hh[i - 1] ? 1 : c < ll[i - 1] ? -1 : 0) : 0); }],
    rsis: ['RSI strategy', [len(14), ['ob', 'Quá mua', 70, 'float'], ['os', 'Quá bán', 30, 'float']], (D, I) => { const r = T.rsi(D.c, I.len); return D.c.map((_, i) => T.crossover(r, I.os, i) ? 1 : T.crossunder(r, I.ob, i) ? -1 : 0); }],
    stochs: ['Stochastic slow strategy', [len(14), ['ob', 'Quá mua', 80, 'float'], ['os', 'Quá bán', 20, 'float']], (D, I) => { const k = T.sma(T.stoch(D.c, D.h, D.l, I.len), 3), d = T.sma(k, 3); return D.c.map((_, i) => T.crossover(k, d, i) && k[i] < I.os ? 1 : T.crossunder(k, d, i) && k[i] > I.ob ? -1 : 0); }],
    sts: ['Supertrend strategy', [len(10), ['f', 'Hệ số', 3, 'float']], (D, I) => { const { dir } = T.supertrend(D, I.f, I.len); return dir.map((d, i) => i && isN(dir[i - 1]) && d !== dir[i - 1] ? d : 0); }],
    techs: ['Technical ratings strategy', [], (D) => { const r = DEFS.techrating.calc(D).r; return r.map((v, i) => T.crossover(r, 0.1, i) ? 1 : T.crossunder(r, -0.1, i) ? -1 : 0); }],
    twoma: ['Two moving averages crossover', [len(9, 'f', 'MA nhanh'), len(21, 's', 'MA chậm')], (D, I) => { const a = T.sma(D.c, I.f), b = T.sma(D.c, I.s); return D.c.map((_, i) => T.crossover(a, b, i) ? 1 : T.crossunder(a, b, i) ? -1 : 0); }],
    volexp: ['Volatility expansion-close strategy', [len(5), ['k', 'Hệ số ATR', 0.75, 'float']], (D, I) => { const a = T.atr(D, I.len); return D.c.map((_, i) => i && D.h[i] > D.c[i - 1] + I.k * a[i - 1] ? 1 : i && D.l[i] < D.c[i - 1] - I.k * a[i - 1] ? -1 : 0); }]
  };

  /* ---------- Bộ kiểm tra chiến lược ---------- */
  App.backtest = function (D, sig, opt = {}) {
    const cap0 = opt.capital || 10000, fee = (opt.fee || 0.04) / 100;
    let pos = 0, qty = 0, entry = 0, eIdx = 0, cash = cap0, peak = cap0, mdd = 0;
    const trades = [], equity = [];
    const close = (i, px, why) => {
      const pnl = pos * qty * (px - entry) - fee * qty * (px + entry);
      cash += pnl; trades.push({ side: pos > 0 ? 'Mua' : 'Bán', ei: eIdx, xi: i, ep: entry, xp: px, pnl, pct: pos * (px / entry - 1) * 100, why });
      pos = 0; qty = 0;
    };
    for (let i = 0; i < D.n; i++) {
      // thực hiện tín hiệu của nến trước tại giá mở cửa nến này
      const s = i ? sig[i - 1] : 0, px = D.o[i];
      if (s === 2 && pos > 0) close(i, px, 'Đóng');
      if (s === -2 && pos < 0) close(i, px, 'Đóng');
      if ((s === 1 && pos <= 0) || (s === -1 && pos >= 0)) {
        if (pos) close(i, px, 'Đảo chiều');
        pos = s; entry = px; eIdx = i; qty = cash / px;
      }
      const eq = cash + (pos ? pos * qty * (D.c[i] - entry) : 0);
      equity.push(eq); peak = Math.max(peak, eq); mdd = Math.max(mdd, (peak - eq) / peak * 100);
    }
    if (pos) close(D.n - 1, D.c[D.n - 1], 'Đang mở');
    const wins = trades.filter(t => t.pnl > 0), loss = trades.filter(t => t.pnl <= 0);
    const gp = wins.reduce((s, t) => s + t.pnl, 0), gl = -loss.reduce((s, t) => s + t.pnl, 0);
    return { trades, equity, net: cash - cap0, netPct: (cash / cap0 - 1) * 100, n: trades.length, winRate: trades.length ? wins.length / trades.length * 100 : 0,
      pf: gl ? gp / gl : gp ? Infinity : 0, mdd, avg: trades.length ? (cash - cap0) / trades.length : 0, buyHold: (D.c[D.n - 1] / D.c[0] - 1) * 100 };
  };

  Object.entries(S).forEach(([id, [name, inputs, fn]]) => {
    DEFS['st_' + id] = {
      id: 'st_' + id, name, cat: 'strategy', overlay: true, inputs, plots: [], levels: [],
      calc(D, I) {
        const sig = fn(D, I), bt = App.backtest(D, sig, App.settings.bt || {}), mk = [];
        bt.trades.forEach(t => {
          mk.push({ i: t.ei, pos: t.side === 'Mua' ? 'belowBar' : 'aboveBar', shape: t.side === 'Mua' ? 'arrowUp' : 'arrowDown', color: t.side === 'Mua' ? '#2962ff' : '#e91e63', text: t.side });
          if (t.why === 'Đóng') mk.push({ i: t.xi, pos: t.side === 'Mua' ? 'aboveBar' : 'belowBar', shape: 'circle', color: '#787b86', text: 'Đóng' });
        });
        return { markers: mk, backtest: bt };
      }
    };
  });
})(window.App);

</script>
<script>
/* --- js/stockpredict.js --- */
/* =========================================================
 * stockpredict.js — Kết nối GreenView với công cụ dự đoán StockPredict (thư mục co_phieu/)
 *
 *  • Nguồn giá "SP": giá cổ phiếu VN do Python lấy hộ (trình duyệt bị chặn khi gọi thẳng API Vietcap).
 *      - window.GV_DATA: dữ liệu nhúng sẵn (web app Streamlit) {ma, bars, ke_hoach, tin_hieu}
 *      - window.GV_API : địa chỉ máy chủ trên máy (co_phieu/chay_greenview.bat), "" = cùng địa chỉ trang
 *  • Chỉ báo "Khuyến nghị StockPredict": vùng mua, cắt lỗ, chốt lời, ngày chốt lời dự kiến,
 *    các lần báo Mua trong quá khứ và kết quả.
 *  • Chiến lược "StockPredict — Dự đoán xu hướng": cùng quy tắc đã kiểm định của công cụ
 *    (trọng số động lượng, ngưỡng 50, khung lớn tăng, cắt lỗ 0,5 ATR dưới đáy hồi, chốt lời 3R, giữ ≤ 60 nến).
 * ========================================================= */
(function (App) {
  'use strict';
  const T = App.ta, DEFS = App.INDICATORS, isN = T.isN, N = NaN;
  const hasData = () => !!(window.GV_DATA && window.GV_DATA.bars);
  const hasApi = () => window.GV_API != null;
  const api = (path) => (window.GV_API || '') + path;

  /* ---------------- Dữ liệu ---------------- */
  const SP = App.sp = { goi: {}, dang: {} };
  if (hasData()) SP.goi[window.GV_DATA.ma] = window.GV_DATA;

  async function daily(sym, fresh) {
    const g = SP.goi[sym];
    if (g && g.bars && !fresh) return g.bars;
    if (!hasApi()) throw new Error(`Chưa có dữ liệu ${sym}. Mở GreenView bằng co_phieu/chay_greenview.bat để xem mọi mã VN, hoặc chọn mã trong web app.`);
    const j = await App.fetchJSON(api('/api/gia?ma=' + encodeURIComponent(sym)), { timeout: 60000 });
    if (j.loi) throw new Error(j.loi);
    SP.goi[sym] = Object.assign(SP.goi[sym] || {}, { ma: sym, bars: j.bars });
    return j.bars;
  }

  // Kế hoạch + tín hiệu quá khứ: nhúng sẵn, hoặc hỏi máy chủ (chạy nền, vẽ lại khi có)
  SP.keHoach = function (sym) {
    const g = SP.goi[sym];
    if (g && g.ke_hoach) return g;
    if (hasApi() && !SP.dang[sym]) {
      SP.dang[sym] = true;
      App.fetchJSON(api('/api/khuyen_nghi?ma=' + encodeURIComponent(sym)), { timeout: 120000 })
        .then(j => { SP.goi[sym] = Object.assign(SP.goi[sym] || { ma: sym }, j); if (App.chart && App.chart.D) App.chart.renderIndicators(); })
        .catch(e => { SP.goi[sym] = Object.assign(SP.goi[sym] || { ma: sym }, { ke_hoach: { loi: e.message } }); });
    }
    return null;
  };

  const sp = {
    label: 'StockPredict (giá VN)',
    short: 'SP',
    tfs: ['1D', '1W', '1M'],
    canLoadMore: false,
    hint: 'Giá cổ phiếu VN do công cụ dự đoán lấy hộ (Vietcap). VD: FPT, HPG, VCB, VNINDEX — giá theo đồng',
    normalize: s => s.toUpperCase().replace(/[^A-Z0-9]/g, ''),
    async fetchBars(sym, tf, beforeTime, fresh) {
      if (beforeTime) return [];
      const d = (await daily(sym, fresh)).map(b => ({ ...b }));
      return tf === '1W' ? App.aggregate(d, 604800) : tf === '1M' ? App.aggregateMonth(d) : d;
    },
    live(sym, tf, onBar) {
      if (!hasApi()) { App.setStatus('idle', hasData() ? `Dữ liệu StockPredict lúc ${window.GV_DATA.luc || ''}` : 'Dữ liệu tĩnh'); return () => {}; }
      let stopped = false;
      const id = setInterval(async () => {
        if (stopped) return;
        try { (await sp.fetchBars(sym, tf, null, true)).slice(-2).forEach(onBar); App.setStatus('live', 'StockPredict — cập nhật mỗi phút'); }
        catch (e) { App.setStatus('warn', 'Không cập nhật được giá: ' + e.message); }
      }, 60000);
      App.setStatus('live', 'StockPredict — cập nhật mỗi phút');
      return () => { stopped = true; clearInterval(id); };
    },
    async quotes(syms) {
      const out = {};
      await Promise.all(syms.map(async s => {
        try {
          let d = SP.goi[s] && SP.goi[s].bars;
          if (!d && hasApi()) d = (await App.fetchJSON(api('/api/gia?ma=' + encodeURIComponent(s) + '&n=3'), { timeout: 60000 })).bars;
          if (!d || !d.length) return;
          const a = d[d.length - 1], b = d[d.length - 2] || a;
          out[s] = { price: a.close, chg: (a.close / b.close - 1) * 100 };
        } catch (e) { /* bỏ qua */ }
      }));
      return out;
    }
  };
  // Đặt nguồn StockPredict lên đầu danh sách
  App.sources = Object.assign({ SP: sp }, App.sources);
  // Có máy chủ trên máy: nguồn "Cổ phiếu Việt Nam" bị trình duyệt chặn thì lấy giá qua StockPredict
  if (hasApi()) {
    const vn = App.sources.VN, f0 = vn.fetchBars.bind(vn), q0 = vn.quotes.bind(vn);
    vn.fetchBars = async (sym, tf, before) => {
      try { return await f0(sym, tf, before); }
      catch (e) {
        if (before || !sp.tfs.includes(tf)) throw e;
        const k = App.isIndex(sym) ? 1 : 0.001;   // nguồn VN tính nghìn đồng
        return (await sp.fetchBars(sym, tf)).map(b => ({ ...b, open: b.open * k, high: b.high * k, low: b.low * k, close: b.close * k }));
      }
    };
    vn.quotes = async syms => {
      const out = await q0(syms).catch(() => ({})), thieu = syms.filter(s => !out[s]);
      if (thieu.length) { const r = await sp.quotes(thieu); thieu.forEach(s => { if (r[s]) out[s] = { price: App.isIndex(s) ? r[s].price : r[s].price / 1000, chg: r[s].chg }; }); }
      return out;
    };
  }

  /* ---------------- Tiện ích thời gian ---------------- */
  // Nến cuối cùng có thời gian <= t (t là đầu ngày, cộng gần 1 ngày để khớp cả nguồn có cộng múi giờ)
  function idx(D, t) {
    const x = t + 86399; let lo = 0, hi = D.n - 1, r = -1;
    while (lo <= hi) { const m = (lo + hi) >> 1; if (D.t[m] <= x) { r = m; lo = m + 1; } else hi = m - 1; }
    return r;
  }
  // Vị trí (có thể ở tương lai) của ngày t trên trục nến
  function idxFuture(D, t) {
    const last = D.t[D.n - 1];
    if (t <= last) return idx(D, t);
    const step = App.TF[App.state.tf] || 86400, days = (t - last) / 86400;
    return D.n - 1 + (step <= 86400 ? days * 5 / 7 * (86400 / step) : days * 86400 / step);
  }
  // Hệ số đổi đơn vị giá (nguồn VN tính nghìn đồng, SP/TCBS tính đồng)
  function heSo(D, g) {
    const a = D.c[D.n - 1], b = g.bars && g.bars.length ? g.bars[g.bars.length - 1].close : null;
    if (!b || !a) return 1;
    for (const k of [1, 0.001, 1000]) if (Math.abs(a / (b * k) - 1) < 0.2) return k;
    return null;
  }

  /* ---------------- Chỉ báo: Khuyến nghị StockPredict ---------------- */
  const MAU = { 'Mua': '#089981', 'Gần đủ điều kiện': '#2962ff', 'Theo dõi': '#ff9800', 'Không mua': '#787b86' };
  DEFS.sp_plan = {
    id: 'sp_plan', name: 'Khuyến nghị StockPredict', cat: 'stockpredict', overlay: true, plots: [], levels: [],
    inputs: [['kh', 'Hiện kế hoạch hiện tại', true, 'bool'], ['qk', 'Hiện các lần báo Mua trong quá khứ', true, 'bool'], ['tg', 'Hiện ngày chốt lời dự kiến', true, 'bool']],
    calc(D, I) {

      if (!g) return { draw(gx, X) { X.label(gx, X.W / 2, 22, hasApi() ? `StockPredict: đang phân tích ${sym}…` : `StockPredict: chưa có khuyến nghị cho ${sym}`, '#787b86'); } };

        if (j >= 0 && s.ket_qua !== 'Đang giữ') mk.push({ i: j, pos: 'aboveBar', shape: 'circle', color: ok ? '#089981' : '#f23645', text: `${s.ket_qua} ${s.lai_pct > 0 ? '+' : ''}${s.lai_pct}%` });
        tr.push({ i, j: j < 0 ? D.n - 1 : j, sl: s.cat_lo * k, tp: s.chot_loi * k, ok });
      });

        markers: mk,
        draw(gx, X) {

            X.seg(gx, x1, X.y(t.sl), x2, X.y(t.sl), 'rgba(242,54,69,0.8)', [3, 3]);
          });
          if (!I.kh) return;
          if (kh.loi) { X.label(gx, X.W / 2, 22, 'StockPredict: ' + kh.loi, '#f23645'); return; }
          if (!kh.muc) return;
          const n = D.n - 1, xa = X.x(Math.max(0, n - 25)), xb = X.W, col = MAU[kh.muc] || '#787b86';
          if (kh.vung && kh.vung[0] != null) X.box(gx, xa, X.y(kh.vung[1] * k), xb, X.y(kh.vung[0] * k), 'rgba(41,98,255,0.12)', 'rgba(41,98,255,0.5)');
          if (kh.gia_mua) X.hline(gx, xa, xb, X.y(kh.gia_mua * k), '#2962ff', 'Mua ' + App.fmtPrice(kh.gia_mua * k), 1.5);
          if (kh.cat_lo) X.hline(gx, xa, xb, X.y(kh.cat_lo * k), '#f23645', 'Cắt lỗ ' + App.fmtPrice(kh.cat_lo * k), 1.5);
          if (kh.chot_loi) X.hline(gx, xa, xb, X.y(kh.chot_loi * k), '#089981', 'Chốt lời ' + App.fmtPrice(kh.chot_loi * k) + (kh.rr ? ` (R:R ${kh.rr})` : ''), 1.5);
          if (I.tg && kh.du_kien) {

            if (xd != null) {
              X.seg(gx, xd, 30, xd, X.H - 30, '#089981', [6, 4], 1.5);

          const dinh = kh.dinh && kh.dinh.muc && kh.dinh.muc !== 'Chưa có đỉnh' ? ` · Đỉnh: ${kh.dinh.muc}` : '';
          X.label(gx, Math.min(X.W - 150, Math.max(150, X.W / 2)), 18, `StockPredict: ${kh.muc} · điểm ${kh.diem}${dinh}`, col);
        }

  };

  /* ---------------- Chỉ báo: Pha thị trường (chu kỳ) ---------------- */
  DEFS.sp_pha = {
    id: 'sp_pha', name: 'Pha thị trường VN (chu kỳ)', cat: 'stockpredict', overlay: true, plots: [], levels: [],
    inputs: [['op', 'Độ đậm nền (%)', 18, 'int']],
    calc(D, I) {
      const P = window.GV_PHA || [];
      if (!P.length) return { draw(g, X) { X.label(g, X.W / 2, 22, 'Chưa có dữ liệu pha – chạy quét toàn thị trường trong StockPredict', '#787b86'); } };
      const seg = [];
      P.forEach(([t, pha, mau]) => {
        const ts = Date.parse(t) / 1000, i = idx(D, ts); if (i < 0) return;
        const s = seg[seg.length - 1];
        if (s && s.pha === pha) s.j = i; else seg.push({ i, j: i, pha, mau });
      });
      const a = Math.max(0, Math.min(100, I.op)) / 100, hex = c => { const n = parseInt(c.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
      const cuoi = P[P.length - 1];

        const nua = Math.abs((X.x(1) || 0) - (X.x(0) || 0)) / 2;   // nửa độ rộng 1 nến (toạ độ số lẻ không dùng được)
        seg.forEach(s => { const a1 = X.x(s.i), a2 = X.x(s.j); if (a1 == null || a2 == null) return; X.box(g, a1 - nua, 0, a2 + nua, X.H, hex(s.mau)); });
        X.label(g, Math.min(X.W - 120, Math.max(120, X.W / 2)), 40, `Thị trường: pha ${cuoi[1]}`, cuoi[2]);
      } };
    }
  };

  /* ---------------- Chỉ báo: Đỉnh/đáy thật (để so với tín hiệu) ---------------- */
  // Đỉnh/đáy "thật" = điểm cao/thấp nhất trong ±N nến VÀ cách đáy/đỉnh trước ≥ X% (zigzag).
  // Chỉ dùng để NHÌN LẠI QUÁ KHỨ: điểm gần cuối biểu đồ chưa được xác nhận (cần N nến sau đó).
  DEFS.sp_dinh_day = {
    id: 'sp_dinh_day', name: 'Đỉnh/đáy thật (để so sánh)', cat: 'stockpredict', overlay: true, plots: [], levels: [],
    inputs: [['n', 'Số nến mỗi bên', 10, 'int'], ['pct', 'Biên độ tối thiểu (%)', 8, 'float'], ['nhan', 'Ghi giá & % trên nhãn', true, 'bool']],
    calc(D, I) {
      const n = Math.max(2, I.n | 0), mk = [], dd = [];
      for (let i = n; i < D.n - n; i++) {
        let hi = true, lo = true;
        for (let j = i - n; j <= i + n; j++) { if (j === i) continue; if (D.h[j] > D.h[i]) hi = false; if (D.l[j] < D.l[i]) lo = false; }
        if (hi) dd.push({ i, p: D.h[i], k: 'H' }); if (lo) dd.push({ i, p: D.l[i], k: 'L' });
      }
      // gộp thành zigzag xen kẽ, bỏ sóng nhỏ hơn X%
      const z = [];
      dd.forEach(x => {
        const t = z[z.length - 1];
        if (!t) return z.push(x);
        if (t.k === x.k) { if ((x.k === 'H' && x.p > t.p) || (x.k === 'L' && x.p < t.p)) z[z.length - 1] = x; return; }
        if (Math.abs(x.p / t.p - 1) * 100 >= I.pct) z.push(x);
      });
      z.forEach((x, k) => {
        const tr = z[k - 1], ch = tr ? (x.p / tr.p - 1) * 100 : null;
        mk.push({ i: x.i, pos: x.k === 'H' ? 'aboveBar' : 'belowBar', shape: 'square', color: x.k === 'H' ? '#f23645' : '#089981',
          text: (x.k === 'H' ? 'ĐỈNH' : 'ĐÁY') + (I.nhan ? ` ${App.fmtPrice(x.p)}${ch != null ? ` (${ch > 0 ? '+' : ''}${ch.toFixed(0)}%)` : ''}` : '') });
      });
      return { markers: mk, draw(g, X) { for (let k = 1; k < z.length; k++) X.seg(g, X.x(z[k - 1].i), X.y(z[k - 1].p), X.x(z[k].i), X.y(z[k].p), 'rgba(255,152,0,0.7)', [4, 3], 1.5); } };
    }
  };

  /* ---------------- Chiến lược: Dự đoán xu hướng (bản JS của quy tắc đã kiểm định) ---------------- */
  const sign = x => (x > 0 ? 1 : x < 0 ? -1 : 0), kep = x => Math.max(-1, Math.min(1, x));

  // Điểm động lượng một khung (giống Pine "Động lượng (đã kiểm định)") — chỉ dùng dữ liệu đến từng nến
  App.spScore = function (D, kp = 3) {
    const n = D.n, a = T.atr(D, 14);
    const m = T.sub(T.ema(D.c, 12), T.ema(D.c, 26)), sg = T.ema(m, 9), hist = T.sub(m, sg);
    const kS = T.sma(T.stoch(D.c, D.h, D.l, 14), 3), dS = T.sma(kS, 3);
    const mf = T.mfi(D, 14), dm = T.dmi(D, 14, 14), vol30 = T.sum(D.v, 30);
    const diem = T.arr(n), xh = T.arr(n, 0), h1Bar = T.arr(n, -1);
    let h1 = N, h2 = N, l1 = N, l2 = N, hb = -1, chuaH = N, chuaL = N, xu = 0, haO = N, haCp = N;
    const xanh = [], rd = [], rt = [], cross = [];
    for (let i = 0; i < n; i++) {
      // đỉnh/đáy xác nhận sau kp nến
      const p = i - kp;
      if (p >= kp) {
        let isH = true, isL = true;
        for (let j = p - kp; j <= p + kp; j++) {
          if (j === p) continue;
          if (j < p ? D.h[j] >= D.h[p] : D.h[j] > D.h[p]) isH = false;
          if (j < p ? D.l[j] <= D.l[p] : D.l[j] < D.l[p]) isL = false;
        }
        if (isH) { h2 = h1; h1 = D.h[p]; hb = p; chuaH = D.h[p]; }
        if (isL) { l2 = l1; l1 = D.l[p]; chuaL = D.l[p]; }
      }
      h1Bar[i] = hb;
      // LEVEL 1 – cấu trúc đỉnh/đáy
      const bangDinh = isN(h2) && Math.abs(h1 - h2) <= 0.01 * Math.max(h1, h2), bangDay = isN(l2) && Math.abs(l1 - l2) <= 0.01 * Math.max(l1, l2);
      const vSw = !isN(h2) || !isN(l2) ? 0 : bangDinh && bangDay ? 0 : h1 > h2 && l1 > l2 ? 1 : h1 < h2 && l1 < l2 ? -1 : 0;
      // MACD
      cross.push(i && isN(m[i - 1]) && isN(sg[i - 1]) && sign(m[i] - sg[i]) !== sign(m[i - 1] - sg[i - 1]) ? 1 : 0);
      let soCat = 0; for (let j = Math.max(0, i - 19); j <= i; j++) soCat += cross[j];
      const vMacd = !isN(hist[i]) ? 0 : soCat >= 4 ? 0 : sign(hist[i]) * (i && Math.abs(hist[i]) > Math.abs(hist[i - 1]) ? 1 : 0.5);
      // Heikin Ashi
      const haC = (D.o[i] + D.h[i] + D.l[i] + D.c[i]) / 4;
      haO = isN(haO) ? (haO + haCp) / 2 : (D.o[i] + D.c[i]) / 2; haCp = haC;
      const haH = Math.max(D.h[i], haO, haC), haL = Math.min(D.l[i], haO, haC), ai = isN(a[i]) ? a[i] : 0;
      xanh.push(haC > haO); rd.push(Math.min(haO, haC) - haL <= 0.05 * ai); rt.push(haH - Math.max(haO, haC) <= 0.05 * ai);
      let vHa = 0;
      if (i >= 2) {
        const x3 = xanh[i] && xanh[i - 1] && xanh[i - 2], d3 = !xanh[i] && !xanh[i - 1] && !xanh[i - 2];
        vHa = x3 && rd[i] && rd[i - 1] && rd[i - 2] ? 1 : d3 && rt[i] && rt[i - 1] && rt[i - 2] ? -1 : x3 ? 0.5 : d3 ? -0.5 : 0;
      }
      // Stochastic
      let vSt = 0;
      if (i && isN(kS[i]) && isN(dS[i]) && isN(kS[i - 1]) && isN(dS[i - 1]))
        vSt = kS[i - 1] <= dS[i - 1] && kS[i] > dS[i] && kS[i] < 50 ? 1 : kS[i - 1] >= dS[i - 1] && kS[i] < dS[i] && kS[i] > 50 ? -1 : kS[i] > 80 ? -0.3 : kS[i] < 20 ? 0.3 : 0.5 * sign(kS[i] - dS[i]);
      // MFI
      const coKL = vol30[i] > 0 && isN(mf[i]) && i >= 3 && isN(mf[i - 3]);
      const vMf = !coKL ? 0 : mf[i] > 80 ? -0.7 : mf[i] < 20 ? 0.7 : kep(kep((mf[i] - mf[i - 3]) / 15) * 0.6 + (mf[i] > 50 ? 0.4 : -0.4));
      // ADX
      const ad = dm.adx[i], vAdx = isN(ad) && ad >= 25 ? sign(dm.plus[i] - dm.minus[i]) : 0;
      // SMC – phá cấu trúc
      if (isN(chuaH) && D.c[i] > chuaH) { xu = 1; chuaH = N; }
      else if (isN(chuaL) && D.c[i] < chuaL) { xu = -1; chuaL = N; }
      xh[i] = xu;
      const w = 1 + 2.5 + 1 + 1.5 + (coKL ? 1.5 : 0) + 1.5 + (xu ? 1 : 0);
      let d = 100 * (vSw + vMacd * 2.5 + vHa + vSt * 1.5 + (coKL ? vMf * 1.5 : 0) + vAdx * 1.5 + xu) / w;
      if (isN(ad) && ad < 20) d *= 0.7;
      diem[i] = i < 35 ? N : d;
    }
    return { diem, xh, atr: a, h1Bar };
  };

  // Khung lớn: tự chọn theo khung đang xem; trả về điểm & xu hướng của nến khung lớn ĐÃ ĐÓNG
  function khungLon(D) {
    const tf = App.TF[App.state.tf] || 86400;
    const bars = []; for (let i = 0; i < D.n; i++) bars.push({ time: D.t[i], open: D.o[i], high: D.h[i], low: D.l[i], close: D.c[i], volume: D.v[i] });
    const big = tf <= 3600 ? App.aggregate(bars, 14400) : tf < 86400 ? App.aggregate(bars, 86400) : tf < 604800 ? App.aggregate(bars, 604800) : tf < 2592000 ? App.aggregateMonth(bars) : null;
    if (!big || big.length < 40) return null;
    const B = T.prep(big), s = App.spScore(B), d = T.arr(D.n), x = T.arr(D.n, 0);
    let w = 0;
    for (let i = 0; i < D.n; i++) {
      while (w + 1 < B.n && B.t[w + 1] <= D.t[i]) w++;
      if (w >= 1) { d[i] = s.diem[w - 1]; x[i] = s.xh[w - 1]; }
    }
    return { diem: d, xh: x };
  }

  App.spStrategy = function (D, I) {
    const s = App.spScore(D), L = khungLon(D), n = D.n;
    const tong = s.diem.map((d, i) => (L && isN(L.diem[i]) ? (2 * d + L.diem[i]) / 3 : d));
    const xh = tong.map((t, i) => (isN(t) && t >= I.ng && s.diem[i] > 0 && (!I.loc || (L ? L.xh[i] === 1 : true)) ? 1 : 0));
    const opt = App.settings.bt || {}, cap0 = opt.capital || 10000, fee = (I.phi != null ? I.phi : 0.15) / 100, thue = (I.thue || 0) / 100;
    let cash = cap0, peak = cap0, mdd = 0, pos = null;
    const trades = [], equity = [], mk = [];
    for (let i = 0; i < n; i++) {
      // vào lệnh ở giá mở cửa sau nến có tín hiệu
      if (!pos && i && xh[i - 1] === 1 && (i < 2 || xh[i - 2] !== 1)) {
        const j = i - 1, c = D.c[j], a = s.atr[j], hb = s.h1Bar[j];
        let low = N; if (hb >= 0) { low = Infinity; for (let q = hb; q <= j; q++) low = Math.min(low, D.l[q]); }
        const sl = isN(low) && low - 0.5 * a < c ? low - 0.5 * a : c - a, tp = c + I.r * (c - sl), ep = D.o[i];
        if (isN(a) && sl < ep && ep < tp) {
          pos = { ei: i, ep, sl, tp, qty: cash * (1 - fee) / ep };
          mk.push({ i, pos: 'belowBar', shape: 'arrowUp', color: '#2962ff', text: 'Mua ' + Math.round(tong[j]) });
        }
      }
      if (pos) {
        let xp = null, why = '';
        if (D.l[i] <= pos.sl) { xp = i > pos.ei ? Math.min(D.o[i], pos.sl) : pos.sl; why = 'Cắt lỗ'; }
        else if (D.h[i] >= pos.tp) { xp = i > pos.ei ? Math.max(D.o[i], pos.tp) : pos.tp; why = 'Chốt lời'; }
        else if (i - pos.ei + 1 >= I.giu) { xp = D.c[i]; why = 'Hết ' + I.giu + ' nến'; }
        if (xp != null) {
          const val = pos.qty * xp * (1 - fee - thue), pnl = val - cash;
          trades.push({ side: 'Mua', ei: pos.ei, xi: i, ep: pos.ep, xp, pnl, pct: (val / cash - 1) * 100, why });
          mk.push({ i, pos: 'aboveBar', shape: 'circle', color: pnl > 0 ? '#089981' : '#f23645', text: why });
          cash = val; pos = null;
        }
      }
      const eq = pos ? pos.qty * D.c[i] : cash;
      equity.push(eq); peak = Math.max(peak, eq); mdd = Math.max(mdd, (peak - eq) / peak * 100);
    }
    if (pos) { const xp = D.c[n - 1], val = pos.qty * xp * (1 - fee - thue); trades.push({ side: 'Mua', ei: pos.ei, xi: n - 1, ep: pos.ep, xp, pnl: val - cash, pct: (val / cash - 1) * 100, why: 'Đang mở' }); cash = val; }
    const wins = trades.filter(t => t.pnl > 0), loss = trades.filter(t => t.pnl <= 0);
    const gp = wins.reduce((a, t) => a + t.pnl, 0), gl = -loss.reduce((a, t) => a + t.pnl, 0);
    const bt = { trades, equity, net: cash - cap0, netPct: (cash / cap0 - 1) * 100, n: trades.length, winRate: trades.length ? wins.length / trades.length * 100 : 0,
      pf: gl ? gp / gl : gp ? Infinity : 0, mdd, avg: trades.length ? (cash - cap0) / trades.length : 0, buyHold: (D.c[n - 1] / D.c[0] - 1) * 100,
      note: `Quy tắc của công cụ dự đoán: vào lệnh giá mở cửa nến sau tín hiệu, thoát khi chạm cắt lỗ / chốt lời ${I.r}R / hết ${I.giu} nến. Phí ${I.phi}%/chiều, thuế bán ${I.thue}%. Kiểm định 2006–2026 trên ~900 mã: chưa chắc tốt hơn mua ngẫu nhiên.` };
    return { markers: mk, backtest: bt, tong };
  };


  /* ======================================================================
   * Chiến lược theo khoá học: "Công thức 2 đường MA (LEVEL 1)" và "MACD + Sto"
   * Lệnh vị thế 30% vốn + lệnh xác nhận 70% vốn (khi lệnh vị thế có lãi), mỗi lệnh có cắt lỗ riêng.
   * Tín hiệu ở giá đóng cửa nến, khớp giá mở cửa nến sau; cắt lỗ khớp min(giá mở, giá cắt lỗ).
   * ====================================================================== */
  function moPhongLo(D, R, I) {
    // R: { vt(i)->{stop} | null, xn(i, fillVT)->{stop} | null, banPhan(i)->bool, banHet(i)->bool, tenBan }
    const n = D.n, cap0 = (App.settings.bt || {}).capital || 10000, phi = (I.phi != null ? I.phi : 0.15) / 100, thue = (I.thue || 0) / 100;
    let cash = cap0, peak = cap0, mdd = 0, lo = [], cho = null, daBanPhan = false, fillVT = null;
    const trades = [], equity = [], mk = [];
    const dong = (l, i, px, phan, why) => {
      const q = l.q * phan, val = q * px * (1 - phi - thue), von = q * l.ep * (1 + phi);
      cash += val; l.q -= q;
      trades.push({ side: 'Mua', ei: l.ei, xi: i, ep: l.ep, xp: px, pnl: val - von, pct: (val / von - 1) * 100, why });
    };
    for (let i = 0; i < n; i++) {
      // 1) thực hiện lệnh chờ ở giá mở cửa
      if (cho) {
        const o = D.o[i];
        if (cho.k === 'het' && lo.length) { lo.forEach(l => dong(l, i, o, 1, R.tenBan || 'Bán hết')); lo = []; mk.push({ i, pos: 'aboveBar', shape: 'arrowDown', color: '#f23645', text: 'Bán hết' }); }
        else if (cho.k === 'phan' && lo.length) { lo.forEach(l => dong(l, i, o, I.phan / 100, `Bán ${I.phan}%`)); mk.push({ i, pos: 'aboveBar', shape: 'circle', color: '#ff9800', text: `Bán ${I.phan}%` }); }
        else if ((cho.k === 'vt' || cho.k === 'xn') && o > cho.stop) {
